<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let Him Cook — History Timeline</title><style>:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#5d6673;--line:#e3e6ea;--acc:#1f6feb;--mark:#b7791f} @media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#e8ebef;--mute:#9aa4b1;--line:#262c35;--acc:#5b9cff;--mark:#f0b849}}*{box-sizing:border-box}body{margin:0 auto;max-width:760px;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}h1{font-size:22px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--mute)}select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}svg{width:100%;height:auto}.axis{stroke:var(--line)}.line{fill:none;stroke:var(--acc);stroke-width:3}.point{fill:var(--acc)}.marker{stroke:var(--mark);stroke-width:2;stroke-dasharray:4 3}.markerDot{fill:var(--mark)}.label{fill:var(--mute);font-size:11px}.event{border-top:1px solid var(--line);padding:9px 0}.event:first-child{border-top:0}.event b{display:block}.sub{color:var(--mute);font-size:12px}.empty{color:var(--mute)}</style></head><body><h1>Historical Performance Timeline</h1><div class="sub">Season PPR performance with independent dated annotation markers.</div><section><label>Player <select id="player"></select></label></section><section><h2>Season PPR points per game</h2><div id="chart"></div></section><section><h2>Dated events</h2><div id="events"></div></section><script>
const demo={
 'Example Player':{seasons:[{season:2021,ppg:12.4,finish:18},{season:2022,ppg:15.8,finish:11},{season:2023,ppg:14.1,finish:15},{season:2024,ppg:18.2,finish:6},{season:2025,ppg:17.3,finish:8}],events:[{date:'2023-10-15',type:'public statement',title:'Example dated annotation',note:'Annotations are stored independently from performance data.'}]}
};
const sel=document.getElementById('player');Object.keys(demo).forEach(n=>sel.add(new Option(n,n)));sel.onchange=render;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const d=demo[sel.value],ss=d.seasons||[],ev=d.events||[];if(!ss.length){chart.innerHTML='<div class="empty">No season history.</div>';return}const W=700,H=300,p=42,minY=0,maxY=Math.max(25,...ss.map(x=>x.ppg));const minX=Math.min(...ss.map(x=>x.season)),maxX=Math.max(...ss.map(x=>x.season));const x=y=>p+(y-minX)/Math.max(1,maxX-minX)*(W-2*p), yy=v=>H-p-v/maxY*(H-2*p);let s=`<svg viewBox="0 0 ${W} ${H}" role="img"><line class="axis" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/>`;for(const e of ev){const yr=+String(e.date).slice(0,4);if(yr>=minX&&yr<=maxX){const xx=x(yr);s+=`<line class="marker" x1="${xx}" y1="${p}" x2="${xx}" y2="${H-p}"/><circle class="markerDot" cx="${xx}" cy="${p}" r="5"/>`}}s+=`<polyline class="line" points="${ss.map(a=>`${x(a.season)},${yy(a.ppg)}`).join(' ')}"/>`;for(const a of ss){s+=`<circle class="point" cx="${x(a.season)}" cy="${yy(a.ppg)}" r="5"/><text class="label" x="${x(a.season)}" y="${H-14}" text-anchor="middle">${a.season}</text><text class="label" x="${x(a.season)}" y="${yy(a.ppg)-10}" text-anchor="middle">${a.ppg.toFixed(1)}</text>`}s+='</svg>';chart.innerHTML=s;events.innerHTML=ev.length?ev.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="event"><b>${esc(e.date)} · ${esc(e.type)}</b><div>${esc(e.title)}</div><div class="sub">${esc(e.note)}</div></div>`).join(''):'<div class="empty">No dated events.</div>'}
render();</script></body></html>
