<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let Him Cook — History Timeline</title><style>:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#5d6673;--line:#e3e6ea;--acc:#1f6feb;--mark:#b7791f}@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#e8ebef;--mute:#9aa4b1;--line:#262c35;--acc:#5b9cff;--mark:#f0b849}}*{box-sizing:border-box}body{margin:0 auto;max-width:760px;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}h1{font-size:22px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--mute)}select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}svg{width:100%;height:auto}.axis{stroke:var(--line)}.line{fill:none;stroke:var(--acc);stroke-width:3}.point{fill:var(--acc)}.marker{stroke:var(--mark);stroke-width:2;stroke-dasharray:4 3}.markerDot{fill:var(--mark)}.label{fill:var(--mute);font-size:11px}.event{border-top:1px solid var(--line);padding:9px 0}.event:first-child{border-top:0}.event b{display:block}.sub,.empty{color:var(--mute);font-size:12px}</style></head><body><h1>Historical Performance Timeline</h1><div class="sub">Season PPR performance with independent dated annotation markers.</div><section><label>Player <select id="player"></select></label></section><section><h2>Season PPR points per game</h2><div id="chart" class="empty">Loading performance data…</div></section><section><h2>Dated events</h2><div id="events" class="empty">No annotation dataset loaded.</div></section><script>
let perf={seasons:[]}, annotations={}; const sel=document.getElementById('player'), chart=document.getElementById('chart'), events=document.getElementById('events');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{perf=await fetch('performance_timeline.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})}catch(e){chart.textContent='performance_timeline.json has not been deployed yet.';return}try{annotations=await fetch('timeline_annotations.json',{cache:'no-store'}).then(r=>r.ok?r.json():{})}catch(e){annotations={}}const names=[...new Set((perf.seasons||[]).map(x=>x.player).filter(Boolean))].sort();sel.innerHTML='';names.forEach(n=>sel.add(new Option(n,n)));sel.onchange=render;if(names.length)render();else chart.textContent='No player-season records found.'}
function render(){const name=sel.value,ss=(perf.seasons||[]).filter(x=>x.player===name).sort((a,b)=>a.season-b.season),ev=(annotations[name]||[]).slice();if(!ss.length){chart.innerHTML='<div class="empty">No season history.</div>';return}const W=700,H=300,p=42,maxY=Math.max(25,...ss.map(x=>+x.ppg||0)),minX=Math.min(...ss.map(x=>x.season)),maxX=Math.max(...ss.map(x=>x.season)),x=y=>p+(y-minX)/Math.max(1,maxX-minX)*(W-2*p),yy=v=>H-p-v/maxY*(H-2*p);let s=`<svg viewBox="0 0 ${W} ${H}" role="img"><line class="axis" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/>`;for(const e of ev){const yr=+String(e.date||'').slice(0,4);if(yr>=minX&&yr<=maxX){const xx=x(yr);s+=`<line class="marker" x1="${xx}" y1="${p}" x2="${xx}" y2="${H-p}"/><circle class="markerDot" cx="${xx}" cy="${p}" r="5"/>`}}s+=`<polyline class="line" points="${ss.map(a=>`${x(a.season)},${yy(+a.ppg||0)}`).join(' ')}"/>`;for(const a of ss){s+=`<circle class="point" cx="${x(a.season)}" cy="${yy(+a.ppg||0)}" r="5"/><text class="label" x="${x(a.season)}" y="${H-14}" text-anchor="middle">${a.season}</text><text class="label" x="${x(a.season)}" y="${yy(+a.ppg||0)-10}" text-anchor="middle">${(+a.ppg||0).toFixed(1)}</text>`}s+='</svg>';chart.innerHTML=s;events.innerHTML=ev.length?ev.sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(e=>`<div class="event"><b>${esc(e.date)} · ${esc(e.type)}</b><div>${esc(e.title)}</div><div class="sub">${esc(e.note)}</div></div>`).join(''):'<div class="empty">No dated annotations for this player.</div>'}
load();</script></body></html>
