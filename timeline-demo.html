<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let Him Cook — History Timeline</title><style>:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#5d6673;--line:#e3e6ea;--acc:#1f6feb;--mark:#b7791f}@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#e8ebef;--mute:#9aa4b1;--line:#262c35;--acc:#5b9cff;--mark:#f0b849}}*{box-sizing:border-box}body{margin:0 auto;max-width:760px;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}h1{font-size:22px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--mute)}select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters label,.playerLabel{display:flex;flex-direction:column;gap:5px}.filters span,.playerLabel span{font-size:12px;color:var(--mute)}svg{width:100%;height:auto}.axis{stroke:var(--line)}.line{fill:none;stroke:var(--acc);stroke-width:3}.point{fill:var(--acc)}.marker{stroke:var(--mark);stroke-width:2;stroke-dasharray:4 3}.markerDot{fill:var(--mark)}.label{fill:var(--mute);font-size:11px}.event{border-top:1px solid var(--line);padding:9px 0}.event:first-child{border-top:0}.sub,.empty{color:var(--mute);font-size:12px}.profile{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}@media(max-width:520px){.filters{grid-template-columns:1fr}}</style></head><body><h1>Historical Performance Timeline</h1><div class="sub">Season PPR performance with independently sourced public faith annotations. Unknown means no supported classification is currently in the dataset.</div><section><div class="filters"><label><span>Faith</span><select id="faith"></select></label><label><span>Denomination</span><select id="denom"></select></label></div><br><label class="playerLabel"><span>Player</span><select id="player"></select></label><div id="profile" class="profile sub"></div></section><section><h2>Season PPR points per game</h2><div id="chart" class="empty">Loading performance data…</div></section><section><h2>Dated events</h2><div id="events" class="empty">No annotation dataset loaded.</div></section><script>
let perf={seasons:[]},annotations={};const sel=document.getElementById('player'),faith=document.getElementById('faith'),denom=document.getElementById('denom'),profile=document.getElementById('profile'),chart=document.getElementById('chart'),events=document.getElementById('events');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rec(n){const r=annotations[n];if(!r||Array.isArray(r))return{profile:{faith:'Unknown',denomination:'Unknown'},events:Array.isArray(r)?r:[]};return{profile:r.profile||{faith:'Unknown',denomination:'Unknown'},events:r.events||[]}}
function uniq(a){return[...new Set(a)].sort()}
function rebuildDenom(){const f=faith.value;const names=uniq((perf.seasons||[]).map(x=>x.player).filter(Boolean));const vals=uniq(names.filter(n=>f==='All'||(rec(n).profile.faith||'Unknown')===f).map(n=>rec(n).profile.denomination||'Unknown'));const old=denom.value;denom.innerHTML='';denom.add(new Option('All denominations','All'));vals.forEach(v=>denom.add(new Option(v,v)));if(vals.includes(old))denom.value=old;rebuildPlayers()}
function rebuildPlayers(){const f=faith.value,d=denom.value,old=sel.value;const names=uniq((perf.seasons||[]).map(x=>x.player).filter(Boolean)).filter(n=>{const p=rec(n).profile;return(f==='All'||(p.faith||'Unknown')===f)&&(d==='All'||(p.denomination||'Unknown')===d)});sel.innerHTML='';names.forEach(n=>sel.add(new Option(n,n)));if(names.includes(old))sel.value=old;if(names.length)render();else{chart.textContent='No players match these filters.';events.textContent='';profile.textContent=''}}
async function load(){try{perf=await fetch('performance_timeline.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})}catch(e){chart.textContent='performance_timeline.json has not been deployed yet.';return}try{annotations=await fetch('timeline_annotations.json',{cache:'no-store'}).then(r=>r.ok?r.json():{})}catch(e){annotations={}}const names=uniq((perf.seasons||[]).map(x=>x.player).filter(Boolean)),faiths=uniq(names.map(n=>rec(n).profile.faith||'Unknown'));faith.innerHTML='';faith.add(new Option('All faiths','All'));faiths.forEach(v=>faith.add(new Option(v,v)));faith.onchange=rebuildDenom;denom.onchange=rebuildPlayers;sel.onchange=render;rebuildDenom()}
function render(){const name=sel.value,r=rec(name),p=r.profile||{},ss=(perf.seasons||[]).filter(x=>x.player===name).sort((a,b)=>a.season-b.season),ev=r.events.slice();profile.innerHTML=`<b>${esc(p.faith||'Unknown')}</b> · ${esc(p.denomination||'Unknown')}<br>${esc(p.basis||'No sourced faith profile currently recorded.')}`;if(!ss.length){chart.innerHTML='<div class="empty">No season history.</div>';return}const W=700,H=300,pad=42,maxY=Math.max(25,...ss.map(x=>+x.ppg||0)),minX=Math.min(...ss.map(x=>x.season)),maxX=Math.max(...ss.map(x=>x.season)),x=y=>pad+(y-minX)/Math.max(1,maxX-minX)*(W-2*pad),yy=v=>H-pad-v/maxY*(H-2*pad);let s=`<svg viewBox="0 0 ${W} ${H}" role="img"><line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/>`;for(const e of ev){const yr=+String(e.date||'').slice(0,4);if(yr>=minX&&yr<=maxX){const xx=x(yr);s+=`<line class="marker" x1="${xx}" y1="${pad}" x2="${xx}" y2="${H-pad}"/><circle class="markerDot" cx="${xx}" cy="${pad}" r="5"/>`}}s+=`<polyline class="line" points="${ss.map(a=>`${x(a.season)},${yy(+a.ppg||0)}`).join(' ')}"/>`;for(const a of ss){s+=`<circle class="point" cx="${x(a.season)}" cy="${yy(+a.ppg||0)}" r="5"/><text class="label" x="${x(a.season)}" y="${H-14}" text-anchor="middle">${a.season}</text><text class="label" x="${x(a.season)}" y="${yy(+a.ppg||0)-10}" text-anchor="middle">${(+a.ppg||0).toFixed(1)}</text>`}s+='</svg>';chart.innerHTML=s;events.innerHTML=ev.length?ev.sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(e=>`<div class="event"><b>${esc(e.date)} · ${esc(e.type)}</b><div>${esc(e.title)}</div><div class="sub">${esc(e.note)}</div>${e.source?`<div class="sub"><a href="${esc(e.source)}" target="_blank" rel="noopener">Source</a></div>`:''}</div>`).join(''):'<div class="empty">No dated annotations for this player.</div>'}
load();</script></body></html>
