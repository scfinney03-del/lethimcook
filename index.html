<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let Him Cook</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Let Him Cook">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#5d6673;--line:#e3e6ea;--acc:#1f6feb;--good:#1a8f4a;--bad:#c0392b;--warn:#b7791f;--live:#d64545;--chip:#eef1f5;--bar:#c9d3e0;--barme:#1f6feb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#e8ebef;--mute:#9aa4b1;--line:#262c35;--acc:#5b9cff;--good:#3ccf6f;--bad:#ff6b6b;--warn:#f0b849;--live:#ff5c5c;--chip:#232932;--bar:#2c3440;--barme:#5b9cff}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:12px 12px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px 12px}
h1{font-size:20px;margin:0;letter-spacing:.2px}
.stamp{color:var(--mute);font-size:12px;text-align:right}
.stamp.stale{color:var(--warn)}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:0 0 8px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.slot{width:40px;flex:0 0 40px;font-size:12px;color:var(--mute);font-weight:600}
.main{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.pts b{font-size:16px}
.pts small{display:block;font-size:11px;color:var(--mute)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--chip);color:var(--mute);margin-right:4px;vertical-align:1px}
.pill.live{background:var(--live);color:#fff}
.pill.final{background:var(--chip)}
.pill.warn{background:var(--warn);color:#111}
.pill.bad{background:var(--bad);color:#fff}
.flag{font-size:12px;color:var(--warn)}
.flag.bad{color:var(--bad)}
.act{padding:10px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .when{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--acc)}
.act .when.now{color:var(--bad)}
.act .text{margin-top:2px}
.act .where{font-size:12px;color:var(--mute);margin-top:2px}
.empty{color:var(--mute);font-size:14px;padding:4px 0}
details summary{cursor:pointer;color:var(--mute);font-size:13px;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
.score{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:4px 0 10px}
.score .lbl{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .num{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bar{grid-column:1/3;height:8px;background:var(--bar);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--barme)}
.bar.them i{background:var(--mute)}
.vs{display:grid;grid-template-columns:40px 1fr auto 1fr;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.vs:first-of-type{border-top:0}
.vs .me,.vs .them{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .them{text-align:right}
.vs .edge{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;padding:1px 6px;border-radius:8px;background:var(--chip)}
.vs .edge.up{color:var(--good)}
.vs .edge.down{color:var(--bad)}
.vs small{display:block;color:var(--mute);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.win{color:var(--good);font-weight:700}.loss{color:var(--bad);font-weight:700}
footer{color:var(--mute);font-size:11px;text-align:center;margin-top:16px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ctl button{font:inherit;font-size:14px;font-weight:600;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.ctl button:active{opacity:.7}
.ctl button.warn{color:var(--warn)}.ctl button.go{color:var(--acc)}
.ctlmsg{font-size:12px;color:var(--mute);margin-top:8px;min-height:16px}
.paused{color:var(--warn);font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.6px;padding:3px 10px;border-radius:9px;color:#fff;background:var(--good);vertical-align:1px}
.badge.off{background:var(--bad)}
.ctl button.stop{background:var(--bad);color:#fff;border-color:var(--bad)}
.ctl button.start{background:var(--good);color:#fff;border-color:var(--good)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:4px;vertical-align:0}
.dot.off{background:var(--bad)}
.logo{width:26px;height:26px;flex:0 0 26px;object-fit:contain;border-radius:6px;background:var(--chip)}
.mb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);margin-top:3px}
.mb i{display:block;height:5px;border-radius:3px;background:var(--barme)}
.mb i.them{background:var(--mute)}
.mb span{min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
.pair{grid-column:1/5;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 4px 46px}
.pair .t{height:5px;border-radius:3px;background:var(--bar);overflow:hidden}
.pair .t i{display:block;height:100%;background:var(--barme)}
.pair .t.r{direction:rtl}.pair .t.r i{background:var(--mute)}
.fbar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute)}
.fbar .t{flex:1;height:6px;border-radius:3px;background:var(--bar);overflow:hidden}.fbar .t i{display:block;height:100%;background:var(--barme)}
.fbar .t i.up{background:var(--good)}.fbar .t i.dn{background:var(--bad)}
.form{color:var(--mute)}.form.up{color:var(--good)}.form.dn{color:var(--bad)}
</style>
</head>
<body>
<header><h1>Let Him Cook</h1><div class="stamp" id="stamp">loading…</div></header>
<div id="app"><section><div class="empty">Waiting for the first refresh…</div></section></div>
<footer>Updates every 15 minutes while the laptop is on. Pull down to refresh.</footer>
<script>
(function(){
const $=(s)=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>(v===null||v===""||v===undefined||isNaN(+v))?null:+v;
const f1=v=>{const n=num(v);return n===null?"":n.toFixed(1)};
const blank=v=>v===null||v===undefined||String(v).trim()==="";

const LOGOFIX={JAC:"jax",WAS:"wsh",LA:"lar",OAK:"lv",SD:"lac",STL:"lar"};
function logo(team){team=String(team||"").toUpperCase();if(!team||team==="0")return '<div class="logo"></div>';const ab=LOGOFIX[team]||team.toLowerCase();return '<img class="logo" alt="" loading="lazy" src="https://a.espncdn.com/i/teamlogos/nfl/500/'+ab+'.png" onerror="this.style.visibility=\'hidden\'">';}
function statusPill(st,kick){
  st=String(st||"");
  if(/progress/i.test(st))return '<span class="pill live">LIVE</span>';
  if(/final/i.test(st))return '<span class="pill final">Final</span>';
  if(/bye/i.test(st))return '<span class="pill warn">BYE</span>';
  if(kick)return '<span class="pill">'+esc(kick)+'</span>';
  if(/upcoming/i.test(st))return "";
  return st?'<span class="pill">'+esc(st)+'</span>':"";
}
function flags(p){
  const out=[];
  if(!blank(p.inj)&&!/healthy|^ok$|^-$/i.test(p.inj))out.push('<span class="flag'+(/^out|ir|season/i.test(p.inj)?' bad':'')+'">'+esc(p.inj)+'</span>');
  if(!blank(p.practice)&&!/full|^ok$/i.test(p.practice))out.push('<span class="flag">'+esc(p.practice)+'</span>');
  if(!blank(p.news)&&/out|risk|uncertain|role|trending/i.test(p.news))out.push('<span class="flag'+(/out|risk/i.test(p.news)?' bad':'')+'">'+esc(p.news)+'</span>');
  if(!blank(p.forecast)&&!/indoor|clear|fine|mild|^-$/i.test(p.forecast))out.push('<span class="flag">'+esc(p.forecast)+'</span>');
  return out.join(' · ');
}
function playerRow(p){
  const started=/progress|final/i.test(String(p.status||""));
  const live=num(p.live),proj=num(p.proj);
  let pts="";
  if(started&&live!==null)pts='<b>'+f1(live)+'</b><small>proj '+f1(proj)+'</small>';
  else if(proj!==null)pts='<b>'+f1(proj)+'</b><small>proj</small>';
  if(String(p.team)==="0")p.team="";
  let fl=flags(p);
  const nb=num(p.nextBye); if(nb!==null&&d_week!==null&&nb===d_week+1)fl=(fl?fl+' · ':'')+'<span class="flag">Bye next week</span>';
  const kick=(p.kickoff&&String(p.game||"").indexOf(String(p.kickoff))<0)?p.kickoff:"";
  return '<div class="row"><div class="slot">'+esc(p.slot)+'</div>'+logo(p.team)+'<div class="main"><div class="name">'+esc(p.player)+'</div><div class="sub">'+statusPill(p.status,kick)+esc([p.pos,p.team,p.game].filter(x=>!blank(x)).join(' · '))+(fl?'<br>'+fl:'')+'</div></div><div class="pts">'+pts+'</div></div>';
}
let d_week=null;
function render(d){
  d_week=num(d.week);
  const st=$("#stamp");
  const t=d.updatedIso?new Date(d.updatedIso):null;
  let age="";
  if(t){const m=Math.round((Date.now()-t.getTime())/60000);age=m<1?"just now":(m<90?m+" min ago":Math.round(m/60)+" h ago");st.classList.toggle("stale",m>40)}
  const recs=(d.season||[]).filter(s=>!blank(s.record)).map(s=>String(s.record).replace(/\s/g,""));
  st.textContent=(d.week?"Week "+d.week+(recs.length?" · "+recs[recs.length-1]:"")+" · ":"")+(d.updated||"")+(age?" ("+age+")":"");
  let h="";

  // Action board
  const push=(d.board||[]).filter(b=>num(b.push)>=1&&!/^LIVE:/i.test(b.text||""));
  const rest=(d.board||[]).filter(b=>!(num(b.push)>=1)&&!blank(b.text)&&!/^LIVE:/i.test(b.text||""));
  h+='<section><h2>Do this</h2>';
  if(push.length)h+=push.map(b=>'<div class="act"><div class="when'+(/now/i.test(b.when)?' now':'')+'">'+esc(b.when)+(num(b.score)!==null?' · '+Math.round(num(b.score)):'')+'</div><div class="text">'+esc(b.text)+'</div>'+(blank(b.where)?'':'<div class="where">'+esc(b.where)+'</div>')+'</div>').join("");
  else h+='<div class="empty">Nothing needs a move right now.</div>';
  if(rest.length)h+='<details><summary>'+rest.length+' more on the board</summary>'+rest.map(b=>'<div class="act"><div class="when">'+esc(b.when)+'</div><div class="text">'+esc(b.text)+'</div></div>').join("")+'</details>';
  h+='</section>';

  // Matchup
  const m=d.matchup||{};
  if(m.title||(m.rows||[]).length){
    let lv=null; const lm=/LIVE:\s*You\s+([\d.]+)\s*-\s*(.+?)\s+([\d.]+)/.exec(d.live||""); if(lm)lv={me:+lm[1],them:+lm[3]};
    const anyLive=!!lv||(m.rows||[]).some(r=>num(r.myLive)!==null||num(r.theirLive)!==null);
    const mine=lv?lv.me:(anyLive?num(m.myLive):num(m.myExp)), theirs=lv?lv.them:(anyLive?num(m.theirLive):num(m.theirExp));
    const mx=Math.max(mine||0,theirs||0,num(m.myExp)||0,num(m.theirExp)||0,1);
    h+='<section><h2>'+esc(m.title||"Matchup")+'</h2><div class="score">';
    h+='<div class="lbl">Me'+(anyLive?' (live · expected '+f1(m.myExp)+')':' (expected)')+'</div><div class="num">'+f1(mine)+'</div><div class="bar"><i style="width:'+(100*(mine||0)/mx)+'%"></i></div>';
    h+='<div class="lbl">'+esc(m.opp||"Them")+(anyLive?' (expected '+f1(m.theirExp)+')':'')+'</div><div class="num">'+f1(theirs)+'</div><div class="bar them"><i style="width:'+(100*(theirs||0)/mx)+'%"></i></div></div>';
    h+=(m.rows||[]).map(r=>{
      const e=num(r.edge);const cls=e===null?"":(e>2?"up":(e<-2?"down":""));
      const myv=num(r.myLive)!==null?f1(r.myLive):f1(r.myExp), thv=num(r.theirLive)!==null?f1(r.theirLive):f1(r.theirExp);
      const a=num(myv),b=num(thv),mx2=Math.max(a||0,b||0,num(r.myExp)||0,num(r.theirExp)||0,0.1);
      return '<div class="vs"><div class="slot">'+esc(r.slot)+'</div><div class="me">'+esc(r.my)+'<small>'+myv+'</small></div><div class="edge '+cls+'">'+(e===null?"":(e>0?"+":"")+e.toFixed(1))+'</div><div class="them">'+esc(r.their)+'<small>'+thv+'</small></div><div class="pair"><div class="t"><i style="width:'+(100*Math.max(a||0,0)/mx2)+'%"></i></div><div class="t r"><i style="width:'+(100*Math.max(b||0,0)/mx2)+'%"></i></div></div></div>'}).join("");
    h+='</section>';
  }

  // Lineup
  const ro=d.roster||[];
  const starters=ro.filter(p=>!/^BN|^IR/i.test(p.slot||"")&&!blank(p.player));
  const bench=ro.filter(p=>/^BN|^IR/i.test(p.slot||"")&&!blank(p.player));
  h+='<section><h2>Lineup</h2>'+starters.map(playerRow).join("")+'</section>';
  if(bench.length)h+='<section><h2>Bench</h2>'+bench.map(playerRow).join("")+'</section>';

  // Form & usage (bars = 3-wk avg vs season avg)
  const fm=(d.form||[]).filter(x=>!blank(x.player)&&(num(x.avg3)!==null||num(x.last)!==null));
  if(fm.length){
    const fmx=Math.max.apply(null,fm.map(x=>Math.max(num(x.avg3)||0,num(x.season)||0,num(x.last)||0)).concat([1]));
    h+='<section><h2>Form &amp; usage</h2>'+fm.map(x=>{
      const f=String(x.form||""),fc=/ris/i.test(f)?"up":(/fad/i.test(f)?"dn":"");
      const bits=[];if(num(x.tgt)!==null)bits.push(Math.round(num(x.tgt)*(num(x.tgt)<=1?100:1))+'% tgt');if(num(x.snap)!==null)bits.push(Math.round(num(x.snap)*(num(x.snap)<=1?100:1))+'% snaps');if(num(x.touches)!==null)bits.push(Math.round(num(x.touches))+' touches');if(!blank(x.depth))bits.push(/^\d+$/.test(String(x.depth).trim())?'depth '+esc(x.depth):esc(x.depth));if(!blank(x.flag))bits.push(esc(x.flag));
      return '<div class="row"><div class="slot">'+esc(x.slot)+'</div><div class="main"><div class="name">'+esc(x.player)+' <span class="form '+fc+'" style="font-size:12px;font-weight:600">'+esc(f)+'</span></div>'
        +'<div class="fbar"><span style="width:66px;flex:0 0 66px">last '+f1(x.last)+'</span><div class="t"><i class="'+fc+'" style="width:'+(100*(num(x.last)||0)/fmx)+'%"></i></div></div>'
        +'<div class="fbar"><span style="width:66px;flex:0 0 66px">3-wk '+f1(x.avg3)+'</span><div class="t"><i style="width:'+(100*(num(x.avg3)||0)/fmx)+'%"></i></div></div>'
        +'<div class="fbar"><span style="width:66px;flex:0 0 66px">season '+f1(x.season)+'</span><div class="t"><i style="width:'+(100*(num(x.season)||0)/fmx)+'%;opacity:.55"></i></div></div>'
        +(bits.length?'<div class="sub" style="white-space:normal">'+bits.join(' · ')+'</div>':'')+'</div></div>'}).join("")+'</section>';
  }

  // Waivers
  const wv=(d.waivers||[]).filter(w=>!blank(w.player)&&!/^(gone|taken|rostered)/i.test(String(w.inLeague||"")));
  if(wv.length){
    h+='<section><h2>Waiver watch</h2><table><tr><th>#</th><th>Player</th><th class="n">Wk</th><th class="n">Season</th><th>Status</th></tr>';
    h+=wv.slice(0,8).map(w=>'<tr><td>'+esc(w.pri)+'</td><td><div style="display:flex;gap:8px;align-items:center">'+logo(w.team)+'<div><b>'+esc(w.player)+'</b><br><span class="sub">'+esc([w.pos,w.team,w.inLeague].filter(x=>!blank(x)).join(' · '))+(blank(w.next3)?'':' · next '+esc(w.next3))+'</span></div></div></td><td class="n">'+f1(w.wk)+'</td><td class="n">'+(num(w.season)===null?"":Math.round(num(w.season)))+'</td><td>'+esc(w.status||"")+'</td></tr>').join("");
    h+='</table></section>';
  }

  // IR stash + streamers
  const ir=(d.ir||[]).filter(x=>!blank(x.player)), sr=(d.streamers||[]).filter(x=>!blank(x.best));
  if(ir.length||sr.length){
    h+='<section><h2>Free upgrades</h2>';
    if(ir.length)h+='<table><tr><th>IR stash'+(num(d.irOpen)!==null?' ('+d.irOpen+' slot'+(d.irOpen==1?'':'s')+' open)':'')+'</th><th class="n">ROS</th><th class="n">/wk</th></tr>'+ir.map(x=>'<tr><td><b>'+esc(x.player)+'</b><br><span class="sub">'+esc([x.pos,x.team,x.injury].filter(v=>!blank(v)).join(' · '))+'</span></td><td class="n">'+Math.round(num(x.ros)||0)+'</td><td class="n">'+f1(x.perwk)+'</td></tr>').join("")+'</table>';
    if(sr.length)h+='<table style="margin-top:8px"><tr><th>Streamer</th><th class="n">Proj</th><th>Yours</th><th class="n">Edge</th></tr>'+sr.map(x=>'<tr><td><b>'+esc(x.best)+'</b><br><span class="sub">'+esc(x.pos)+(blank(x.verdict)?'':' · '+esc(x.verdict))+'</span></td><td class="n">'+f1(x.proj)+'</td><td>'+esc(x.mine)+'<br><span class="sub">'+f1(x.myproj)+'</span></td><td class="n">'+(num(x.edge)===null?"":(num(x.edge)>0?"+":"")+f1(x.edge))+'</td></tr>').join("")+'</table>';
    h+='</section>';
  }

  // Season
  const se=(d.season||[]).filter(s=>!blank(s.opp)&&num(s.my)!==null);
  if(se.length){
    h+='<section><h2>Season</h2><table><tr><th>Wk</th><th>Opponent</th><th class="n">Me</th><th class="n">Them</th><th></th></tr>';
    const smx=Math.max.apply(null,se.map(s=>Math.max(num(s.my)||0,num(s.their)||0)).concat([1]));
    h+=se.map(s=>'<tr><td>'+esc(s.week)+'</td><td>'+esc(s.opp)+'<div class="mb"><i style="width:'+(60*(num(s.my)||0)/smx)+'%"></i><span>'+f1(s.my)+'</span></div><div class="mb"><i class="them" style="width:'+(60*(num(s.their)||0)/smx)+'%"></i><span>'+f1(s.their)+'</span></div></td><td class="n">'+f1(s.my)+'</td><td class="n">'+f1(s.their)+'</td><td class="'+(/^w/i.test(s.result||"")?'win':(/^l/i.test(s.result||"")?'loss':''))+'">'+esc(s.result||"")+'</td></tr>').join("");
    h+='</table></section>';
  }
  // Controls (talk to the laptop through the command channel)
  if(d.cmd){
    const la=num(d.listenerAge); const lOn=la!==null&&la>=0&&la<180;
    let chk=""; if(d.checkedIso){const cm=Math.round((Date.now()-new Date(d.checkedIso).getTime())/60000);chk=esc(d.checked||"")+(cm<1?" (just now)":" ("+cm+" min ago)");}
    h+='<section><h2>Laptop</h2><div style="margin:2px 0 6px"><span class="badge'+(d.paused?' off':'')+'">'+(d.paused?'PAUSED':'RUNNING')+'</span></div>'
      +'<div class="sub" style="white-space:normal">Last check '+(chk||esc(d.updated||""))+' · last data '+esc(d.updated||"")+'<br><span class="dot'+(lOn?'':' off')+'"></span>Buttons '+(lOn?'online':(la===null||la<0?'unknown':'offline'))+'</div><div class="ctl">'
      +(d.paused?'<button class="start" data-cmd="resume">Resume refresh</button>':'<button class="stop" data-cmd="pause">Pause refresh</button>')
      +'<button class="go" data-cmd="refresh">Refresh now</button><button data-cmd="ping">Ping laptop</button><button onclick="location.reload()">Reload page</button></div><div class="ctlmsg" id="ctlmsg"></div></section>';
  }
  $("#app").innerHTML=h;
  document.querySelectorAll(".ctl button[data-cmd]").forEach(b=>b.addEventListener("click",()=>send(b.dataset.cmd,d.cmd)));
}
function send(cmd,topic){
  const m=$("#ctlmsg"); m.textContent="Sending…";
  fetch("https://ntfy.sh/"+topic,{method:"POST",body:cmd}).then(r=>{m.textContent=r.ok?"Sent. The laptop replies to your phone in a few seconds.":"Couldn't send ("+r.status+").";}).catch(()=>{m.textContent="Couldn't send — no connection.";});
}
function load(){
  fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{try{localStorage.setItem("lhc",JSON.stringify(d))}catch(e){}render(d)})
  .catch(()=>{try{const c=localStorage.getItem("lhc");if(c){render(JSON.parse(c));$("#stamp").textContent+=" · offline copy"}else{$("#stamp").textContent="no data yet"}}catch(e){$("#stamp").textContent="no data yet"}});
}
load();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
setInterval(load,5*60*1000);
})();
</script>
</body>
</html>
