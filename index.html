<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let Him Cook</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Let Him Cook">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#5d6673;--line:#e3e6ea;--acc:#1f6feb;--good:#1a8f4a;--bad:#c0392b;--warn:#b7791f;--live:#d64545;--chip:#eef1f5;--bar:#c9d3e0;--barme:#1f6feb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#e8ebef;--mute:#9aa4b1;--line:#262c35;--acc:#5b9cff;--good:#3ccf6f;--bad:#ff6b6b;--warn:#f0b849;--live:#ff5c5c;--chip:#232932;--bar:#2c3440;--barme:#5b9cff}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:12px 12px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;overflow-x:hidden}
table{table-layout:fixed}
td .sub{white-space:normal;overflow:visible}
td{overflow-wrap:anywhere}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px 12px}
h1{font-size:20px;margin:0;letter-spacing:.2px}
.stamp{color:var(--mute);font-size:12px;text-align:right}
.stamp.stale{color:var(--warn)}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:0 0 8px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.slot{width:40px;flex:0 0 40px;font-size:12px;color:var(--mute);font-weight:600}
.main{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.pts b{font-size:16px}
.pts small{display:block;font-size:11px;color:var(--mute)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--chip);color:var(--mute);margin-right:4px;vertical-align:1px}
.pill.live{background:var(--live);color:#fff}
.pill.final{background:var(--chip)}
.pill.warn{background:var(--warn);color:#111}
.pill.bad{background:var(--bad);color:#fff}
.flag{font-size:12px;color:var(--warn)}
.flag.bad{color:var(--bad)}
.flag.good{color:var(--good)}
.act{padding:10px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .when{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--acc)}
.act .when.now{color:var(--bad)}
.act .text{margin-top:2px}
.act .where{font-size:12px;color:var(--mute);margin-top:2px}
.empty{color:var(--mute);font-size:14px;padding:4px 0}
details summary{cursor:pointer;color:var(--mute);font-size:13px;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
.score{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:4px 0 10px}
.score .lbl{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .num{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bar{grid-column:1/3;height:8px;background:var(--bar);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--barme)}
.bar.them i{background:var(--mute)}
.vs{display:grid;grid-template-columns:40px 1fr auto 1fr;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.vs:first-of-type{border-top:0}
.vs .me,.vs .them{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .them{text-align:right}
.vs .edge{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;padding:1px 6px;border-radius:8px;background:var(--chip)}
.vs .edge.up{color:var(--good)}
.vs .edge.down{color:var(--bad)}
.vs small{display:block;color:var(--mute);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.win{color:var(--good);font-weight:700}.loss{color:var(--bad);font-weight:700}
footer{color:var(--mute);font-size:11px;text-align:center;margin-top:16px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ctl button{font:inherit;font-size:14px;font-weight:600;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;transition:background .12s,color .12s,transform .08s;-webkit-tap-highlight-color:transparent}
.ctl button:active{transform:scale(.96);background:var(--acc);color:#fff;border-color:var(--acc)}
.ctl button.sending{background:var(--warn);color:#fff;border-color:var(--warn)}
.ctl button.sent{background:var(--good);color:#fff;border-color:var(--good)}
.ctl button.failed{background:var(--bad);color:#fff;border-color:var(--bad)}
.ctl button:active{opacity:.7}
.ctl button.warn{color:var(--warn)}.ctl button.go{color:var(--acc)}
.ctlmsg{font-size:12px;color:var(--mute);margin-top:8px;min-height:16px}
.paused{color:var(--warn);font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.6px;padding:3px 10px;border-radius:9px;color:#fff;background:var(--good);vertical-align:1px}
.badge.off{background:var(--bad)}
.ctl button.stop{background:var(--bad);color:#fff;border-color:var(--bad)}
.ctl button.start{background:var(--good);color:#fff;border-color:var(--good)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:4px;vertical-align:0}
.dot.off{background:var(--bad)}
.logo{width:26px;height:26px;flex:0 0 26px;object-fit:contain;border-radius:6px;background:var(--chip)}
.mb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);margin-top:3px}
.mb i{display:block;height:5px;border-radius:3px;background:var(--barme)}
.mb i.them{background:var(--mute)}
.mb span{min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
.pair{grid-column:1/5;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 4px 46px}
.pair .t{height:5px;border-radius:3px;background:var(--bar);overflow:hidden}
.pair .t i{display:block;height:100%;background:var(--barme)}
.pair .t.r{direction:rtl}.pair .t.r i{background:var(--mute)}
.fbar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute)}
.fbar .t{flex:1;height:6px;border-radius:3px;background:var(--bar);overflow:hidden}.fbar .t i{display:block;height:100%;background:var(--barme)}
.fbar .t i.up{background:var(--good)}.fbar .t i.dn{background:var(--bad)}
.form{color:var(--mute)}.form.up{color:var(--good)}.form.dn{color:var(--bad)}

.stick{position:sticky;top:0;z-index:6;background:var(--bg);padding-top:4px;margin-bottom:10px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0;background:var(--bg);padding:0 0 4px}
.crumb{background:var(--bg);padding:2px 2px 8px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--acc);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.crumb .back{flex:0 0 auto;color:var(--acc);font-weight:700;text-decoration:none;font-size:16px}
.crumb .path{overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--acc)}
.crumb .sub{color:var(--acc);opacity:.75}
.crumb .sep{opacity:.5;margin:0 4px}
body.big .crumb{font-size:19px;padding:4px 2px 10px}
.nav a{text-align:center;font-size:13px;font-weight:600;padding:8px 4px;border-radius:9px;background:var(--chip);color:var(--mute);text-decoration:none}
.nav a.on{background:var(--acc);color:#fff}
a.pl{color:inherit;text-decoration:none;border-bottom:1px dotted var(--mute)}
a.back{color:var(--acc);text-decoration:none;font-size:13px;font-weight:600}
.tap,.tapp{cursor:pointer}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.filters select,.filters input{font:inherit;font-size:14px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--ink);width:100%;min-width:0}
.filters input{grid-column:1/3}
table.kv{margin-top:6px}table.kv td{white-space:normal}
button.more{font:inherit;font-weight:600;width:100%;margin-top:8px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--acc)}
details.g summary::before{content:none}details.g summary{padding:0}
.g summary .sub{display:block;white-space:normal!important;line-height:1.45}details.g summary > div{display:flex}
.slot{width:44px;flex:0 0 44px}
.ch rect.b{fill:var(--barme)}.ch rect.b.them{fill:var(--mute)}.ch rect.b.proj{fill:var(--barme);opacity:.35}.ch rect.b.me{fill:var(--barme)}
circle.d{fill:var(--mute);opacity:.7}circle.d.me{fill:var(--good);opacity:1}circle.d.fa{fill:var(--acc)}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--mute);vertical-align:-1px;margin-right:3px}.lg.me{background:var(--barme)}.lg.them{background:var(--mute)}.lg.proj{background:var(--barme);opacity:.35}.lg.fa{background:var(--acc)}
.name.mine,.sub.mine a{color:var(--good)}
path.ln{stroke:var(--barme)}path.ln.them{stroke:var(--mute)}path.ln.proj{stroke:var(--barme);opacity:.6}circle.pt{fill:var(--barme)}circle.pt.them{fill:var(--mute)}circle.pt.proj{fill:var(--barme);opacity:.6}
.ch rect.b.good{fill:var(--good)}.ch rect.b.bad{fill:var(--bad)}.lg.good{background:var(--good)}.lg.bad{background:var(--bad)}

/* Easy-read mode: bigger, bolder, higher contrast (keratoconus-friendly) */
body.big{font-size:22px;line-height:1.5;padding-left:8px;padding-right:8px}
body.big{--ink:#000;--mute:#1e242c;--line:#9aa3af;--bar:#9aa3af;--good:#0b6b31;--bad:#b0160e;--warn:#7a4d00;--acc:#0a4fc2;--barme:#0a4fc2;--card:#fff;--bg:#e9ecf0;--chip:#dfe4ea}
@media (prefers-color-scheme:dark){body.big{--ink:#fff;--mute:#e3e8ee;--line:#6b7583;--bar:#6b7583;--good:#5ce08a;--bad:#ff7b7b;--warn:#ffd166;--acc:#7fb2ff;--barme:#7fb2ff;--card:#0f1216;--bg:#000;--chip:#2a313b}}
body.big section{border-width:2px}body.big b,body.big .name{font-weight:800}
body.big h1{font-size:30px}body.big h2{font-size:17px;letter-spacing:.4px;color:var(--ink)}body.big .stamp{font-size:17px}
body.big .sub,body.big .flag,body.big .pill,body.big small,body.big .fbar,body.big .mb,body.big .act .where,body.big .act .when,body.big .vs small,body.big .sub *{font-size:19px!important}
body.big .name{font-size:22px}body.big .pts b{font-size:26px}body.big .vs{font-size:20px;grid-template-columns:50px 1fr auto 1fr}body.big .vs .edge{font-size:16px}
body.big table{font-size:20px}body.big th{font-size:16px;color:var(--ink)}body.big td,body.big th{padding:9px 5px}
body.big .row{padding:12px 0}body.big .slot{font-size:17px;width:58px;flex:0 0 58px;color:var(--ink)}
body.big .bar{height:14px}body.big .fbar .t,body.big .pair .t,body.big .mb i{height:11px}
body.big .pill{padding:3px 10px;border-radius:12px}body.big .logo{width:34px;height:34px;flex-basis:34px}
body.big .nav a{font-size:19px;padding:14px 4px;color:var(--ink)}body.big .nav a.on{color:#fff}body.big .ctl button,body.big .filters select,body.big .filters input,body.big button.more{font-size:18px;padding:14px 10px}
body.big svg text{font-size:15px!important;fill:var(--ink)!important}body.big svg{height:auto!important;min-height:190px}body.big path.ln{stroke-width:3.5}body.big circle.d{r:5.5}body.big circle.d.me{r:7}
body.big a.pl{border-bottom:2px solid var(--acc);font-weight:600}
body.big .flag{font-weight:700}body.big .score .lbl{font-size:16px;white-space:normal}

body.big .vs{grid-template-columns:58px 1fr auto;row-gap:4px}
body.big .vs .me,body.big .vs .them{white-space:normal;overflow:visible;text-overflow:clip;text-align:left}
body.big .vs .slot{grid-column:1;grid-row:1}body.big .vs .me{grid-column:2;grid-row:1}body.big .vs .them{grid-column:2;grid-row:2}body.big .vs .edge{grid-column:3;grid-row:1/3;align-self:center}body.big .pair{grid-row:3}
body.big .vs .them::before{content:"vs ";color:var(--mute);font-weight:400}
body.big .pair{grid-column:1/4;padding-left:58px}
body.big .name,body.big .sub,body.big .score .lbl{white-space:normal;overflow:visible;text-overflow:clip}
body.big .pill{white-space:nowrap}
body.big .pts{max-width:36%}body.big .main{min-width:0}
body.big .vs .pill{font-size:15px!important;padding:2px 7px}
.aa{font:inherit;font-size:13px;font-weight:700;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;margin-left:6px}
body.big .aa{background:var(--acc);color:#fff;border-color:var(--acc);font-size:18px;padding:6px 12px}

:root{--me:#1f6feb;--them:#6b7280;--proj:#9ec1ff;--fa:#7c3aed}
@media (prefers-color-scheme:dark){:root{--me:#5b9cff;--them:#9aa4b1;--proj:#3b5a8a;--fa:#b794f6}}
.ch rect.b{fill:var(--me)}.ch rect.b.them{fill:var(--them)}.ch rect.b.proj{fill:var(--proj);opacity:1}.ch rect.b.me{fill:var(--me)}.ch rect.b.warn{fill:var(--warn)}
circle.d{fill:var(--them);opacity:.75}circle.d.me{fill:var(--good);opacity:1}circle.d.fa{fill:var(--fa)}
.lg{background:var(--them)}.lg.me{background:var(--me)}.lg.them{background:var(--them)}.lg.proj{background:var(--proj);opacity:1}.lg.fa{background:var(--fa)}
path.ln{stroke:var(--me)}path.ln.them{stroke:var(--them)}path.ln.proj{stroke:var(--proj);opacity:1}circle.pt{fill:var(--me)}circle.pt.them{fill:var(--them)}circle.pt.proj{fill:var(--proj)}
polygon.rad{fill:var(--me);fill-opacity:.25;stroke:var(--me);stroke-width:2}polygon.rad.me{fill:var(--good);stroke:var(--good)}circle.radp{fill:var(--me)}
.nav{grid-template-columns:repeat(6,1fr);gap:3px}.nav a{font-size:12px;padding:8px 2px}
.search{position:relative;margin:0 0 10px}.search input{font:inherit;font-size:15px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.search #gsr{display:none;position:absolute;left:0;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.15);max-height:60vh;overflow:auto}
.hit{display:flex;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);text-decoration:none;color:inherit}.hit:first-child{border-top:0}

.hdrbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

body.big .nav{grid-template-columns:repeat(3,1fr)}body.big .nav a{font-size:18px}
body.big polygon.rad{stroke-width:3.5}
.ch rect.b.good{fill:var(--good)}.ch rect.b.bad{fill:var(--bad)}.ch rect.b.warn{fill:var(--warn)}
.vs .face{width:22px;height:22px;flex-basis:22px;vertical-align:middle;margin:0 3px}body.big .search input{font-size:19px;padding:12px}
.ch rect.b.them{fill:var(--them)}.ch rect.b.proj{fill:var(--proj)}.ch rect.b.good{fill:var(--good)}.ch rect.b.bad{fill:var(--bad)}.ch rect.b.warn{fill:var(--warn)}
.portal{cursor:pointer}

a.aa{text-decoration:none;display:inline-block}a.aa.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.more[disabled]{opacity:.45}
.wi-btns button.more{flex:1;width:auto;margin:0;padding:9px 4px;font-size:13px}
body.big body.big body.big body.big .wi-t.on body.big body.big 
.act{border-left:4px solid var(--line);padding-left:10px}
.act.u1{border-left-color:var(--good)}.act.u2{border-left-color:var(--warn)}.act.u3{border-left-color:var(--bad)}.act.u4{border-left-color:var(--bad)}
.act.u1 .when{color:var(--good)}.act.u2 .when{color:var(--warn)}.act.u3 .when{color:var(--bad)}.act.u4 .when{color:var(--bad)}
.act .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.act.u1 .dot{background:var(--good)}.act.u2 .dot{background:var(--warn)}.act.u3 .dot{background:var(--bad)}.act.u4 .dot{background:var(--bad)}

.wp{display:flex;align-items:center;gap:8px;margin:6px 0}
.wrow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}
.wrow .nm{flex:0 0 46px;font-weight:700;color:var(--ink)}
.wrow .tr{flex:1;height:12px;border-radius:6px;background:var(--chip);overflow:hidden}
.wrow .tr i{display:block;height:100%;background:var(--bar);border-radius:6px}

.wrow .pc{flex:0 0 40px;text-align:right;font-weight:700;color:var(--mute)}
.wrow.lead .pc{color:var(--acc)}

<script>
(function(){
const $=(s)=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>(v===null||v===""||v===undefined||isNaN(+v))?null:+v;
const f1=v=>{const n=num(v);return n===null?"":n.toFixed(1)};
const f2=v=>{const n=num(v);return n===null?"":n.toFixed(2)};
const pct=v=>{const n=num(v);return n===null?"":Math.round(n*(n<=1?100:1))+"%"};
const blank=v=>v===null||v===undefined||String(v).trim()==="";
let D=null, d_week=null, clockTimer=null;
let NAV=true,LASTSIG='',SY=0,USER_SCROLL=0,RESTORING=0;
window.addEventListener('scroll',()=>{if(!RESTORING){SY=window.scrollY;USER_SCROLL=Date.now()}},{passive:true});
function keepPlace(y){
  if(!(y>0))return;
  const t0=Date.now(),mark=USER_SCROLL;
  const tick=()=>{
    if(USER_SCROLL!==mark)return;                 // the user moved: leave them alone
    if(Math.abs(window.scrollY-y)>2){RESTORING=1;window.scrollTo(0,y);RESTORING=0}
    if(Date.now()-t0<1200)requestAnimationFrame(tick);
  };
  tick();
}
let SHOW=false;try{SHOW=localStorage.getItem('lhc_show')==='1'}catch(e){}
let CMDKEY='';try{CMDKEY=localStorage.getItem('lhc_cmd')||''}catch(e){}
const WXI={Indoors:'🏟️','Heavy wind':'💨','Rain likely':'🌧️',Cold:'🥶',Breezy:'🍃',Fine:'☀️'};const wxIcon=i=>WXI[i]||'';
function face(sid,team,pos){if(!sid)return logo(team);if(pos==='DST'||!/^\d+$/.test(String(sid)))return logo(team||sid);return '<img class="logo face portal" data-psid="'+esc(sid)+'" alt="" loading="lazy" src="https://sleepercdn.com/content/nfl/players/thumb/'+esc(sid)+'.jpg" onerror="this.onerror=null;this.src=\'https://a.espncdn.com/i/teamlogos/nfl/500/'+(LOGOFIX[String(team||'').toUpperCase()]||String(team||'').toLowerCase())+'.png\'">';}
function co(name){if(blank(name)||/^(TBD|vacant|-)$/i.test(name))return esc(name||'');return '<a class="pl" href="#coach/'+encodeURIComponent(name)+'">'+esc(name)+'</a>';}
function tn(name){ // a league team name, as a portal to that team's page
  if(blank(name))return '';
  const p=(D&&D.power||[]).find(x=>x.name===name)||(D&&D.teams||[]).find(x=>x.name===name);
  if(!p||p.team===undefined)return esc(name);
  return '<a class="pl'+(isMine(name)?' mine':'')+'" href="#team/'+esc(p.team)+'">'+esc(name)+'</a>';
}
function mg(manager,team){if(blank(manager))return '';const t=team!==undefined?team:((D&&D.teams||[]).find(x=>x.manager===manager)||{}).team;return t!==undefined?'<a class="pl" href="#team/'+esc(t)+'">'+esc(manager)+'</a>':esc(manager);}
function posChip(p){if(blank(p))return '';const k=String(p).toUpperCase().replace('DEF','DST');return '<span class="pos '+esc(k)+'">'+esc(k)+'</span>';}
function teamLink(name){const t=(D&&D.teams||[]).find(x=>x.name===name);return t?'<a class="pl" href="#team/'+t.team+'">'+esc(name)+'</a>':esc(name);}
const state={view:"home",team:null,player:null,filters:{pos:"ALL",owner:"ALL",sort:"value",q:""}};
try{const f=JSON.parse(localStorage.getItem("lhc_filters")||"null");if(f)Object.assign(state.filters,f)}catch(e){}

const LOGOFIX={JAC:"jax",WAS:"wsh",LA:"lar",OAK:"lv",SD:"lac",STL:"lar"};
function logo(team){team=String(team||"").toUpperCase();if(!team||team==="0")return '<div class="logo"></div>';const ab=LOGOFIX[team]||team.toLowerCase();return '<img class="logo portal" data-nfl="'+team+'" alt="" loading="lazy" src="https://a.espncdn.com/i/teamlogos/nfl/500/'+ab+'.png" onerror="this.style.visibility=\'hidden\'">';}
function gamePill(st){st=String(st||"");if(/progress/i.test(st))return '<span class="pill" style="background:var(--good);color:#fff">LIVE</span>';if(/final/i.test(st))return '<span class="pill" style="background:var(--bad);color:#fff">FINAL</span>';if(/bye/i.test(st))return '<span class="pill" style="background:var(--warn);color:#fff">BYE</span>';return '<span class="pill" style="background:var(--warn);color:#fff">PENDING</span>';}
function statusPill(st,kick){
  st=String(st||"");
  if(/progress/i.test(st))return '<span class="pill" style="background:var(--good);color:#fff">LIVE</span>';
  if(/final/i.test(st))return '<span class="pill" style="background:var(--bad);color:#fff">FINAL</span>';
  if(/bye/i.test(st))return '<span class="pill" style="background:var(--warn);color:#fff">BYE</span>';
  if(kick)return '<span class="pill" style="background:var(--warn);color:#fff">PENDING</span> <span class="pill">'+esc(kick)+'</span>';
  if(/upcoming/i.test(st))return '<span class="pill" style="background:var(--warn);color:#fff">PENDING</span>';
  return st?'<span class="pill">'+esc(st)+'</span>':"";
}
const cleanName=n=>String(n||"").replace(/\s+(Jr\.|Sr\.|III|II|IV)$/,"").trim();
function pl(name){if(blank(name))return "";return '<a class="pl" href="#player/'+encodeURIComponent(cleanName(name))+'">'+esc(name)+'</a>';}
function findPlayer(name){const c=cleanName(name).toLowerCase();return (D&&D.players||[]).find(p=>String(p.name).toLowerCase()===c)||null;}
function gradeColor(g){return /^A/.test(g)?'var(--good)':(/^B/.test(g)?'#2f8f5b':(/^C/.test(g)?'#b8860b':'var(--bad)'));}
function bar(v,mx,cls){const w=mx>0?Math.max(0,Math.min(100,100*(num(v)||0)/mx)):0;return '<div class="t"><i class="'+(cls||'')+'" style="width:'+w+'%"></i></div>';}
function fbar(label,v,mx,txt,cls){return '<div class="fbar"><span style="width:84px;flex:0 0 84px">'+esc(label)+'</span>'+bar(v,mx,cls)+'<span style="width:44px;flex:0 0 44px;text-align:right">'+esc(txt===undefined?f1(v):txt)+'</span></div>';}
function kv(rows){return '<table class="kv">'+rows.filter(r=>r&&!blank(r[1])).map(r=>'<tr><td style="color:var(--mute);width:46%">'+String(r[0])+'</td><td>'+r[1]+'</td></tr>').join("")+'</table>';}
function flags(p){
  const out=[];
  if(!blank(p.inj)&&!/healthy|^ok$|^-$/i.test(p.inj))out.push('<span class="flag'+(/^out|ir|season/i.test(p.inj)?' bad':'')+'">'+esc(p.inj)+'</span>');
  if(!blank(p.practice)&&!/full|^ok$/i.test(p.practice))out.push('<span class="flag">'+esc(p.practice)+'</span>');
  if(!blank(p.news)&&/out|risk|uncertain|role|trending/i.test(p.news))out.push('<span class="flag'+(/out|risk/i.test(p.news)?' bad':'')+'">'+esc(p.news)+'</span>');
  if(!blank(p.forecast)&&!/indoor|clear|fine|mild|^-$/i.test(p.forecast))out.push('<span class="flag">'+esc(p.forecast)+'</span>');
  return out.join(' · ');
}
function playerRow(p){
  const started=/progress|final/i.test(String(p.status||""));
  const live=num(p.live),proj=num(p.proj);
  let pts="";
  if(started&&live!==null)pts='<b>'+f1(live)+'</b><small>proj '+f1(proj)+'</small>';
  else if(proj!==null)pts='<b>'+f1(proj)+'</b><small>proj</small>';
  if(String(p.team)==="0")p.team="";
  let fl=flags(p);
  const nb=num(p.nextBye); if(nb!==null&&d_week!==null&&nb===d_week+1)fl=(fl?fl+' · ':'')+'<span class="flag">Bye next week</span>';
  let fb="";
  if(SHOW){const kick0=(p.kickoff&&String(p.game||"").indexOf(String(p.kickoff))<0)?p.kickoff:"";return '<div class="row"><div class="slot">'+esc(p.slot)+'</div>'+face(p.sid,p.team,p.pos)+'<div class="main"><div class="name">'+pl(p.player)+'</div><div class="sub">'+statusPill(p.status,kick0)+esc([p.pos,p.team,p.game].filter(x=>!blank(x)).join(' · '))+(p.forecast?' '+wxIcon(p.forecast):'')+(fl?'<br>'+fl:'')+'</div></div><div class="pts">'+pts+'</div></div>';}
  const nu=blank(p.nextUp)?p.fallback:p.nextUp, nsrc=blank(p.nextUp)?'Waiver':(p.nextSrc||''), nwk=blank(p.nextUp)?p.fbWk:p.nextWk;
  if(!blank(nu))fb+='Next up → <b>'+pl(nu)+'</b>'+(nsrc?' <span class="pill">'+esc(nsrc)+'</span>':'')+(num(nwk)!==null?' '+f1(nwk)+'/wk':'');
  if(num(p.cons)!==null&&num(p.nsrc)!==null&&p.nsrc>0){fb+=(fb?'<br>':'')+'consensus <b>'+f1(p.cons)+'</b> <small>('+Math.round(p.nsrc)+' source'+(p.nsrc==1?'':'s')+(num(p.spread)!==null&&p.spread>0?', spread '+f1(p.spread):'')+(blank(p.grade)?'':', experts <b style="color:'+gradeColor(p.grade)+'">'+esc(p.grade)+'</b>')+')</small>'+(num(p.spread)!==null&&p.spread>=6?' <span class="flag">sources split</span>':'');}
  if(num(p.buzz)!==null&&p.buzz<=-3)fb+='<br><span class="flag bad" style="font-weight:600">News: '+esc(p.headline||'negative buzz')+' ('+f1(p.buzz)+')</span>';
  if(num(p.value)!==null&&num(p.perWk)!==null&&Math.abs(p.value-p.perWk)>=0.05)fb+=(fb?' · ':'')+'value <b>'+f1(p.value)+'</b>/wk <small>(ROS '+f1(p.perWk)+' + form)</small>';
  if(!blank(p.verdict)&&!/^Hold$/.test(p.verdict))fb+='<br><span class="flag'+(/^Upgrade/.test(p.verdict)?' bad':'')+'" style="font-weight:600">'+esc(p.verdict)+'</span>';
  if(num(p.weekVsValue)!==null&&(p.weekVsValue>=1.25||p.weekVsValue<=0.7))fb+='<br><span class="flag'+(p.weekVsValue>=1.25?' good':'')+'">'+(p.weekVsValue>=1.25?'Big week projected ('+Math.round(p.weekVsValue*100)+'% of his usual) — hold through it':'Weak week projected ('+Math.round(p.weekVsValue*100)+'% of his usual)')+'</span>';
  if(num(p.next3)!==null&&(p.next3>=1.15||p.next3<=0.85))fb+=' · <span class="flag'+(p.next3>=1.15?' good':' bad')+'">next 3 defenses '+(p.next3>=1.15?'soft':'tough')+' ('+f1(p.next3)+'x)</span>';
  if(!blank(p.plan))fb+='<br><span class="flag'+(/IR|Out|drop/i.test(p.plan)?' bad':'')+'" style="font-weight:600">Plan: '+esc(p.plan)+'</span>';
  if(!blank(p.handcuff))fb+=(fb?' · ':'')+'handcuff <b>'+pl(p.handcuff)+'</b>'+(blank(p.hcStatus)?'':' <span class="'+(/^free/i.test(p.hcStatus)?'form up':'form dn')+'">'+esc(p.hcStatus)+'</span>');
  const kick=(p.kickoff&&String(p.game||"").indexOf(String(p.kickoff))<0)?p.kickoff:"";
  return '<div class="row"><div class="slot">'+esc(p.slot)+'</div>'+face(p.sid,p.team,p.pos)+'<div class="main"><div class="name">'+pl(p.player)+'</div><div class="sub">'+statusPill(p.status,kick)+posChip(p.pos)+' '+tl(p.team)+(blank(p.game)?'':' · '+esc(p.game))+(p.forecast?' '+wxIcon(p.forecast):'')+(fl?'<br>'+fl:'')+(fb?'<br><span style="white-space:normal">'+fb+'</span>':'')+'</div></div><div class="pts">'+pts+'</div></div>';
}
function clockText(d){
  if(!d||!d.nextIso)return '';
  const n=new Date(d.nextIso),now=new Date(),ms=n-now;
  const t=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if(ms>60000)return 'next update ~'+t+' (in '+Math.round(ms/60000)+' min)';
  if(ms>-180000)return 'updating now… (~'+t+')';
  return 'next update was due '+t+' — laptop may be asleep';
}
function stamp(d){
  const st=$("#stamp");
  const t=d.updatedIso?new Date(d.updatedIso):null;
  let age="";
  if(t){const m=Math.round((Date.now()-t.getTime())/60000);age=m<1?"just now":(m<90?m+" min ago":Math.round(m/60)+" h ago");st.classList.toggle("stale",m>40)}
  const recs=(d.season||[]).filter(s=>!blank(s.record)).map(s=>String(s.record).replace(/\s/g,""));
  st.innerHTML=esc((d.week?"Week "+d.week+(recs.length?" · "+recs[recs.length-1]:"")+" · ":"")+(d.updated||"")+(age?" ("+age+")":""))+(SHOW?'':'<br><span id="clock" style="font-size:11px">'+esc(clockText(d))+'</span>')+(LIVE.at?'<br><span style="font-size:11px;color:var(--good)">live scores '+esc(LIVE.at.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'}))+(anyLiveNow()?' · refreshing every 45 s':'')+'</span>':'');
}


// ---------------- CHARTS (inline SVG, bars + one scatter) ----------------
function svgBars(o){ // o: {labels:[], series:[{vals:[],cls:'',name:''}], line:{v,label}, h}
  const W=360,H=o.h||150,L=30,B=22,T=10,R=6;const n=o.labels.length;if(!n)return '';
  const all=[].concat.apply([],o.series.map(s=>s.vals.map(v=>num(v)||0))).concat([o.line?num(o.line.v)||0:0,1]);
  const mx=Math.max.apply(null,all)*1.08;const sc=v=>(H-B)-((H-B-T)*(Math.max(0,num(v)||0)/mx));
  const gw=(W-L-R)/n,bw=Math.max(2,(gw-4)/o.series.length);
  let h='<svg class="ch" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:'+H+'px;display:block">';
  [0,0.5,1].forEach(t=>{const y=sc(mx/1.08*t);h+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-4)+'" y="'+(y+4)+'" font-size="9" text-anchor="end" fill="var(--mute)">'+Math.round(mx/1.08*t)+'</text>'});
  o.series.forEach((s,si)=>{s.vals.forEach((v,i)=>{if(num(v)===null)return;const x=L+i*gw+2+si*bw,y=sc(v);h+='<rect class="b '+(s.cls||'')+(s.clsAt&&s.clsAt[i]?' '+s.clsAt[i]:'')+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+((H-B)-y)+'" rx="2"/>'})});
  if(o.line&&num(o.line.v)!==null){const y=sc(o.line.v);h+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="'+(W-R)+'" y="'+(y-3)+'" font-size="9" text-anchor="end" fill="var(--warn)">'+esc(o.line.label||'')+'</text>'}
  o.labels.forEach((l,i)=>{if(n>12&&i%2)return;h+='<text x="'+(L+i*gw+gw/2)+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" fill="var(--mute)">'+esc(l)+'</text>'});
  h+='</svg>';
  if(o.legend)h+='<div class="sub" style="white-space:normal">'+o.legend.map(x=>'<span class="lg '+x[0]+'"></span>'+esc(x[1])).join(' &nbsp; ')+'</div>';
  return h;
}
function svgScatter(o){ // o:{pts:[{x,y,label,cls}], xl, yl, h}
  const W=360,H=o.h||220,L=34,B=26,T=12,R=10;const pts=o.pts.filter(p=>num(p.x)!==null&&num(p.y)!==null);if(!pts.length)return '';
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);const x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  const px=v=>L+((W-L-R)*((v-x0)/((x1-x0)||1))),py=v=>(H-B)-((H-B-T)*((v-y0)/((y1-y0)||1)));
  let h='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:'+H+'px;display:block">';
  h+='<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="var(--line)"/><line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="var(--line)"/>';
  h+='<text x="'+((W+L)/2)+'" y="'+(H-4)+'" font-size="10" text-anchor="middle" fill="var(--mute)">'+esc(o.xl||'')+'</text><text x="9" y="'+((H-B+T)/2)+'" font-size="10" text-anchor="middle" fill="var(--mute)" transform="rotate(-90 9 '+((H-B+T)/2)+')">'+esc(o.yl||'')+'</text>';
  h+='<text x="'+L+'" y="'+(H-B+10)+'" font-size="9" fill="var(--mute)">'+f1(x0)+'</text><text x="'+(W-R)+'" y="'+(H-B+10)+'" font-size="9" text-anchor="end" fill="var(--mute)">'+f1(x1)+'</text><text x="'+(L-3)+'" y="'+(T+4)+'" font-size="9" text-anchor="end" fill="var(--mute)">'+f1(y1)+'</text><text x="'+(L-3)+'" y="'+(H-B)+'" font-size="9" text-anchor="end" fill="var(--mute)">'+f1(y0)+'</text>';
  pts.forEach(p=>{h+='<circle class="d '+(p.cls||'')+'" cx="'+px(p.x)+'" cy="'+py(p.y)+'" r="'+(p.cls==='me'?5:3.5)+'"/>'+(p.label?'<text x="'+(px(p.x)+5)+'" y="'+(py(p.y)-4)+'" font-size="9" fill="var(--ink)">'+esc(p.label)+'</text>':'')});
  h+='</svg>';return h;
}

function svgLine(o){ // o:{labels:[], series:[{vals:[],cls:'',dash:bool}], h}
  const W=360,H=o.h||150,L=34,B=22,T=10,R=8;const n=o.labels.length;if(n<2)return '';
  const all=[].concat.apply([],o.series.map(s=>s.vals.filter(v=>num(v)!==null).map(v=>+v))).concat([1]);
  const mx=Math.max.apply(null,all)*1.06,mn=Math.min(0,Math.min.apply(null,all));
  const px=i=>L+((W-L-R)*i/(n-1)),py=v=>(H-B)-((H-B-T)*((v-mn)/((mx-mn)||1)));
  let h='<svg class="ch" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:'+H+'px;display:block">';
  [0,0.5,1].forEach(t=>{const v=mn+(mx-mn)*t,y=py(v);h+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-4)+'" y="'+(y+4)+'" font-size="9" text-anchor="end" fill="var(--mute)">'+Math.round(v)+'</text>'});
  o.series.forEach(s=>{let d='',started=false;s.vals.forEach((v,i)=>{if(num(v)===null){started=false;return}d+=(started?' L':' M')+px(i).toFixed(1)+' '+py(+v).toFixed(1);started=true});
    h+='<path class="ln '+(s.cls||'')+'" d="'+d.trim()+'" fill="none" stroke-width="2.2"'+(s.dash?' stroke-dasharray="5 4"':'')+' stroke-linejoin="round"/>';
    s.vals.forEach((v,i)=>{if(num(v)===null)return;h+='<circle class="pt '+(s.cls||'')+'" cx="'+px(i)+'" cy="'+py(+v)+'" r="2.6"/>'});});
  o.labels.forEach((l,i)=>{if(n>12&&i%2&&i!==n-1)return;h+='<text x="'+px(i)+'" y="'+(H-6)+'" font-size="9" text-anchor="'+(i===0?'start':(i===n-1?'end':'middle'))+'" fill="var(--mute)">'+esc(l)+'</text>'});
  h+='</svg>';
  if(o.legend)h+='<div class="sub" style="white-space:normal">'+o.legend.map(x=>'<span class="lg '+x[0]+'"></span>'+esc(x[1])).join(' &nbsp; ')+'</div>';

// ---------------- LEAGUE MATCHUPS (every pairing, not just ours) ----------------
const LSLOTS=['QB','WR','WR','RB','RB','TE','W/R/T','K','DEF'];
function mgrOf(d,team){const p=(d.power||[]).find(x=>x.name===team);return p?p.manager:'';}
function enrichL(d,x){
  const p=(x.sid&&(d.players||[]).find(y=>String(y.sid)===String(x.sid)))||findPlayer(x.player)||{};
  const g=p.game||{};const st=String(g.status||'');
  const proj=num(p.proj)!==null?num(p.proj):(num(x.week)||0);
  const live=num(g.live);const nfl=x.nfl||p.team;
  const frac=g.opp?gameFrac(nfl,st):0;                  // no game (bye) means nothing left to score
  const started=live!==null&&!/upcoming/i.test(st);
  const exp=!g.opp?0:(started?live+proj*frac:proj);
  return {name:x.player,slot:x.slot,pos:x.pos==='DEF'?'DST':x.pos,nfl:nfl,sid:x.sid||p.sid,proj:proj,live:started?live:null,frac:frac,exp:exp,status:st,opp:g.opp,ha:g.ha,kick:g.kick,bye:!g.opp,inj:String((p.inj||{}).status||'')};
}
function sideL(d,team){
  const rows=(d.league||[]).filter(p=>p.teamName===team);
  const st=rows.filter(p=>!/^(BN|IR)/i.test(String(p.slot||'')));
  const used=new Set(),lineup=[];
  LSLOTS.forEach(sl=>{const i=st.findIndex((p,ix)=>!used.has(ix)&&String(p.slot)===sl);if(i>=0){used.add(i);lineup.push(enrichL(d,st[i]))}else lineup.push({slot:sl,empty:true,exp:0,proj:0,frac:0,live:null})});
  st.forEach((p,ix)=>{if(!used.has(ix))lineup.push(enrichL(d,p))});
  const bench=rows.filter(p=>/^BN/i.test(String(p.slot||''))).map(x=>enrichL(d,x));
  return {team:team,mgr:mgrOf(d,team),lineup:lineup,bench:bench};
}
function modelL(A,B){
  const sdr=r=>{if(r.empty)return 0;const b=SDPOS[r.pos]||6;return b*Math.sqrt(Math.max(0.35,(r.proj||0)/12))*Math.sqrt(r.frac)};
  const sum=(L,f)=>L.reduce((s,r)=>s+(f(r)||0),0);
  const ea=sum(A.lineup,r=>r.exp),eb=sum(B.lineup,r=>r.exp),na=sum(A.lineup,r=>r.live),nb=sum(B.lineup,r=>r.live);
  const va=sum(A.lineup,r=>sdr(r)*sdr(r)),vb=sum(B.lineup,r=>sdr(r)*sdr(r)),sd=Math.sqrt(va+vb);
  const win=sd<0.01?(ea>eb?100:(ea<eb?0:50)):Math.round(100*phi((ea-eb)/sd));
  const n=Math.max(A.lineup.length,B.lineup.length),rows=[];
  for(let i=0;i<n;i++){const a=A.lineup[i]||{empty:true,exp:0},b=B.lineup[i]||{empty:true,exp:0};
    const s2=Math.sqrt(sdr(a)*sdr(a)+sdr(b)*sdr(b));
    rows.push({slot:(a.slot||b.slot),a:a,b:b,gap:(a.exp||0)-(b.exp||0),sw:s2<0.01?((a.exp||0)>(b.exp||0)?100:((a.exp||0)<(b.exp||0)?0:50)):Math.round(100*phi(((a.exp||0)-(b.exp||0))/s2))});}
  return {ea:ea,eb:eb,na:na,nb:nb,win:win,sd:sd,rows:rows,live:(na>0||nb>0),minsA:sum(A.lineup,r=>r.empty?0:r.frac*60),minsB:sum(B.lineup,r=>r.empty?0:r.frac*60),
    benchA:sum(A.bench,r=>r.live!==null?r.live:0),benchB:sum(B.bench,r=>r.live!==null?r.live:0)};
}

// ---------------- WHAT ACTUALLY HAPPENED (games already played) ----------------
function gameWeek(g){

  if(hl&&String(hl.opp||'').toUpperCase()===String(g.away||'').toUpperCase())return num(hl.week);

function gameScore(g){

    if(num(L.awayScore)!==null)a=num(L.awayScore);

function logLine(l){
  const b=[],G=k=>num(l[k])||0;
  if('pa' in l){        // team defense: a different box score entirely
    if(G('sack'))b.push(G('sack')+' sack'+(G('sack')===1?'':'s'));
    if(G('dint'))b.push(G('dint')+' INT');
    if(G('fr'))b.push(G('fr')+' fumble'+(G('fr')===1?'':'s')+' recovered');
    if(G('dtd'))b.push(G('dtd')+' TD');
    if(G('sfty'))b.push(G('sfty')+' safety');
    if(G('blk'))b.push(G('blk')+' blocked kick');
    b.push(Math.round(G('pa'))+' allowed');
    return b.join(' · ');
  }
  if(G('fga')||G('pat'))b.push(G('fgm')+' of '+G('fga')+' FG'+(G('pat')?', '+G('pat')+' PAT':''));
  if(G('payd'))b.push(Math.round(G('payd'))+' pass yd');
  if(G('car'))b.push(G('car')+' car, '+Math.round(G('ruyd'))+' yd');
  if(G('rec')||G('tgt'))b.push(G('rec')+' of '+G('tgt')+', '+Math.round(G('reyd'))+' yd');
  if(G('td'))b.push(G('td')+' TD');

}
function rawLine(sid){

  if(G('rec'))b.push(G('rec')+' of '+(G('rec_tgt')||G('rec'))+', '+Math.round(G('rec_yd'))+' yd'+(G('rec_td')?', '+G('rec_td')+' TD':''));

function shortName(n){const w=cleanName(n).split(/\s+/);if(w.length>2&&/^(St\.|Van|De|Mc|La)$/i.test(w[w.length-2]))return w.slice(-2).join(' ');return w[w.length-1]||n;}

      +'<div class="sub" style="white-space:normal">Everyone the app tracks who played in this game, best first. Green is yours.</div>';
    const sw=rows.filter(r=>r.proj!==null&&r.proj>3).map(r=>Object.assign({},r,{diff:r.pts-r.proj})).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff)).slice(0,6);

function gameCharts(g){

  if(fa.length)h+='<section><h2>Free agents on this team</h2>'+fa.map(p=>'<div class="row tapp" data-player="'+esc(p.name)+'">'+face(p.sid,p.team,p.pos)+'<div class="main"><div class="name">'+esc(p.name)+'</div><div class="sub">'+esc(p.pos)+' · wk '+f1(p.proj)+'</div></div><div class="pts"><b>'+f1(p.value)+'</b><small>value</small></div></div>').join('')+'</section>';
  return h;
}

function defRow(m,line){

    +' <small style="color:var(--mute);font-weight:400">'+esc(m.pos||'')+(num(m.snap)>0?' · '+Math.round(100*num(m.snap))+'% of snaps':'')+'</small>'
    +(out?' <span class="flag">'+esc(m.inj||'out')+'</span>':(m.inj?' <span class="flag">'+esc(m.inj)+'</span>':''))
    +'</div><div class="sub" style="white-space:normal">'+line+'</div></div></div>';
}
function plu(n,one,many){n=num(n)||0;return (Number.isInteger(n)?n:f1(n))+' '+(n===1?one:many);}
function rushLine(m){const b=[];if(num(m.sack))b.push(plu(m.sack,'sack','sacks'));if(num(m.qbh))b.push(plu(Math.round(num(m.qbh)),'QB hit','QB hits'));if(!b.length&&num(m.tkl))b.push(plu(Math.round(num(m.tkl)),'tackle','tackles'));return b.join(' \u00b7 ')||'\u2014';}
function covLine(m){const b=[];if(num(m.dint))b.push(plu(Math.round(num(m.dint)),'INT','INTs'));if(num(m.pd))b.push(plu(Math.round(num(m.pd)),'pass broken up','passes broken up'));if(!b.length&&num(m.tkl))b.push(plu(Math.round(num(m.tkl)),'tackle','tackles'));return b.join(' \u00b7 ')||'\u2014';}
function defUnit(u,heading,intro){

    +(missing>0?' · <b style="color:var(--warn)">missing '+missing+'% of its defensive production this week</b>':' · everyone who matters is available')+'.</div>';
  if(rush.length){
    h+='<div class="sub" style="font-weight:600;margin-top:10px">'+gl('rushv','Pass rush')+'</div>'
      +svgBars({labels:rush.map(m=>shortName(m.name)),series:[{vals:rush.map(m=>num(m.v)),cls:'me',clsAt:rush.map(m=>m.out?'bad':'')}],h:110})
      +rush.map(m=>defRow(m,rushLine(m))).join('');
  }
  if(cov.length){
    h+='<div class="sub" style="font-weight:600;margin-top:10px">'+gl('coverv','Coverage')+'</div>'

      +outs.map(m=>defRow(Object.assign({out:true},m),(num(m.sack)?plu(m.sack,'sack','sacks')+' \u00b7 ':'')+'worth '+f1(m.impact)+' a game to this defence')).join('');
  }
  return h+'<div class="sub" style="white-space:normal;margin-top:6px">Built from every defensive snap in the nflverse box scores. Your league has no defensive slots, so nobody here is startable — this is for reading how hard a week your own guys are facing.</div></section>';
}

function envSection(p){

// ---------------- TRADE CHECK (tap any rival's player) ----------------
const SLOTS=[['QB',['QB']],['RB',['RB']],['RB',['RB']],['WR',['WR']],['WR',['WR']],['TE',['TE']],['FLEX',['RB','WR','TE']],['K',['K']],['DEF',['DST']]];
let WANTS={};try{WANTS=JSON.parse(localStorage.getItem('lhc_wants')||'{}')}catch(e){}
function saveWants(){try{localStorage.setItem('lhc_wants',JSON.stringify(WANTS))}catch(e){}}
function wantsOf(m){return WANTS[m]||{pos:[],offered:[]}}
function myTeamId(d){const me=(d.power||[]).find(x=>isMine(x.name));return me?me.team:null;}
function rosterOf(d,tid){return (d.league||[]).filter(r=>String(r.team)===String(tid)&&!/^IR/.test(r.slot||''));}
function bestNine(rows,key){
  const used={},out=[];
  SLOTS.forEach(s=>{let best=null;rows.forEach(p=>{if(used[p.player])return;if(s[1].indexOf(p.pos)<0)return;const v=num(p[key])||0;if(!best||v>(num(best[key])||0))best=p});
    if(best){used[best.player]=1;out.push(best)}});
  return {pts:out.reduce((a,p)=>a+(num(p[key])||0),0),used:used};
}
// A roster is worth more than its starting nine: the bench is insurance against injuries, byes
// and the guy who quietly becomes a starter in three weeks. That is why a bench-for-bench swap
// is not automatically worth zero.
function teamValue(rows){
  const nine=bestNine(rows,'value');
  let bench=0;rows.forEach(p=>{if(!nine.used[p.player])bench+=Math.max(0,num(p.value)||0)});
  return nine.pts+0.3*bench;
}
function weekPts(rows){return bestNine(rows,'week').pts;}
function asRow(p){return {player:p.name,pos:p.pos,value:p.value,ros:(p.ros&&p.ros.cons),week:p.proj,slot:'BN',nfl:p.team,bye:p.bye};}
function tradeCheck(d,p){
  if(SHOW)return '';
  const tid=myTeamId(d);if(tid===null)return '';
  const own=num(p.owner);
  if(!own||String(own)===String(tid))return '';
  const mine=rosterOf(d,tid),theirs=rosterOf(d,own);
  if(!mine.length||!theirs.length)return '';
  const theirTeam=(d.power||[]).find(x=>String(x.team)===String(own))||{};
  const mgr=theirTeam.manager||p.ownerName||'them';
  const W=wantsOf(mgr);
  const offered=(W.offered||[]).some(n=>cleanName(n)===cleanName(p.name));
  const target=theirs.find(r=>cleanName(r.player)===cleanName(p.name))||asRow(p);
  const base=teamValue(mine),baseT=teamValue(theirs),baseW=weekPts(mine);
  const offers=[];
  mine.forEach(g=>{
    const newMine=mine.filter(r=>r.player!==g.player).concat([target]);
    const newTheirs=theirs.filter(r=>cleanName(r.player)!==cleanName(target.player)).concat([g]);
    const wanted=(W.pos||[]).indexOf(g.pos)>=0;
    // how far below even they will still say yes: further if they asked for this position,
    // further still if they have publicly shopped the player you are asking for
    const tol=-0.75+(wanted?-1.5:0)+(offered?-1.75:0);
    const gt=teamValue(newTheirs)-baseT;
    offers.push({give:g,wanted:wanted,tol:tol,gainMe:teamValue(newMine)-base,gainThem:gt,weekMe:weekPts(newMine)-baseW,ok:gt>=tol});
  });
  offers.sort((a,b)=>b.gainMe-a.gainMe);
  const fair=offers.filter(o=>o.ok);
  const best=fair[0]||null,dream=offers[0]||null;
  const pv=theirTeam.posValue||{};const avg={};
  ['QB','RB','WR','TE','K','DST'].forEach(k=>{const v=(d.power||[]).map(x=>x.posValue&&num(x.posValue[k])).filter(x=>x!==null);avg[k]=v.length?v.reduce((a,b)=>a+b,0)/v.length:null});
  const theirThin=['QB','RB','WR','TE'].filter(k=>num(avg[k])&&num(pv[k])<avg[k]*0.85);
  const inj=(p.inj||{}).status||'';
  const already=(d.trades||[]).find(t=>cleanName(t.get)===cleanName(p.name));
  let verdict,cls,why;
  if(!best&&dream&&dream.gainMe>0.15){verdict='They will laugh';cls='bad';why='He would add '+f1(dream.gainMe)+'/wk of roster value, but every package that gets him costs them '+f1(Math.abs(dream.gainThem))+'/wk. You would need to package two pieces.';}
  else if(!best||best.gainMe<=0.15){verdict='Pass';cls='bad';why='Even counting bench insurance he adds '+f1(best?best.gainMe:(dream?dream.gainMe:0))+'/wk of roster value. Not worth the asset.';}
  else if(best.gainMe>=1.5&&best.gainThem>=-0.25){verdict='Go get him';cls='good';why='Adds '+f1(best.gainMe)+'/wk of roster value and barely dents theirs.';}
  else if(best.gainMe>=0.8){verdict=offered?'Ask now':'Worth asking';cls='warn';why='Adds '+f1(best.gainMe)+'/wk. They give up '+f1(Math.abs(best.gainThem))+'/wk'+(offered?', but they have already put him on the block, so the ask is cheap.':', so expect to sweeten it.');}
  else {verdict='Only if cheap';cls='warn';why='A thin gain of '+f1(best.gainMe)+'/wk — worth it only for a bench piece you do not miss.';}
  if(/^(IR|Out|PUP|Sus)/i.test(inj)&&verdict!=='Pass'){verdict='Wait';cls='bad';why='He is '+esc(inj)+'. Revisit when he practices — his manager reads the same report you do.';}
  let h='<section><details><summary style="color:var(--ink);font-size:15px"><b>Trade for him?</b> <span class="pill '+(cls==='good'?'ok':(cls==='bad'?'bad':'warn'))+'">'+esc(verdict)+'</span></summary>';
  h+='<div class="sub" style="white-space:normal;margin-top:6px">'+why+'</div>';
  // what this manager has asked for - you tell the app, it changes the maths
  h+='<div class="wants"><div class="sub" style="font-weight:600">What has '+esc(mgr)+' asked for?</div><div class="wi-chips">'
    +['QB','RB','WR','TE'].map(k=>'<button class="wchip'+((W.pos||[]).indexOf(k)>=0?' on':'')+'" data-want="'+esc(mgr)+'|pos|'+k+'">'+k+'</button>').join('')
    +'<button class="wchip'+(offered?' on':'')+'" data-want="'+esc(mgr)+'|off|'+esc(p.name)+'">offered '+esc(String(p.name).split(' ').slice(-1)[0])+'</button></div>'
    +'<div class="sub" style="white-space:normal">'+((W.pos||[]).length||offered?'Counted: '+[(W.pos||[]).length?'wants '+(W.pos||[]).join('/'):'',offered?'has shopped '+esc(p.name):''].filter(x=>x).join(' · ')+'. Packages matching that get more rope before they say no.':'Tap what they said in the league chat. It loosens how much they have to gain for a deal to be realistic.')+'</div></div>';
  h+=kv([['Owner',mg(theirTeam.manager,own)+' <small>('+tn(p.ownerName||'')+')</small>'],
    ['His value',f1(p.value)+'/wk <small>ROS '+f1(p.ros&&p.ros.cons)+'</small>'],
    ['They are thin at',theirThin.length?theirThin.join(', '):'<span class="sub">nothing obvious</span>'],
    ['Trade engine',already?'already lists him — give '+pl(already.give)+', score '+f1(already.score):'<span class="sub">not in this week\'s top trades</span>']]);
  const show=(fair.length?fair:offers).slice(0,3);
  if(show.length){h+='<div class="sub" style="font-weight:600;margin-top:8px">'+(fair.length?'Best packages from your roster':'Closest you could get')+'</div>';
    h+=show.map(o=>'<div class="row" style="padding:8px 0"><div class="main" style="white-space:normal"><div class="name">Give '+pl(o.give.player)+' <small class="sub">'+esc(o.give.pos)+' · '+f1(o.give.value)+'/wk</small>'+(o.wanted?' <span class="pill ok">they asked for '+esc(o.give.pos)+'</span>':'')+'</div><div class="sub" style="white-space:normal">roster value: you '+(o.gainMe>=0?'+':'')+f1(o.gainMe)+'/wk · them '+(o.gainThem>=0?'+':'')+f1(o.gainThem)+'/wk · this week '+(o.weekMe>=0?'+':'')+f1(o.weekMe)+' · '+(o.ok?'<b style="color:var(--good)">realistic ask</b>':'<b style="color:var(--bad)">they say no</b>')+'</div></div><div class="pts"><b style="color:'+(o.gainMe>0?'var(--good)':'var(--bad)')+'">'+(o.gainMe>0?'+':'')+f1(o.gainMe)+'</b><small>roster</small></div></div>').join('');
    h+=svgBars({labels:show.map(o=>String(o.give.player).split(' ').slice(-1)[0].slice(0,8)),series:[{vals:show.map(o=>o.gainMe),cls:'me'},{vals:show.map(o=>o.gainThem),cls:'them'}],h:120,legend:[['me','your gain'],['them','their gain']]});
  }
  h+='<div class="sub" style="white-space:normal;margin-top:6px">Roster value = best starting nine by '+gl('value','value')+' plus 30% of the bench, so depth counts — a bench player who becomes a starter after an injury or a bye is not worth zero. "This week" is the immediate lineup effect.</div>';
  return h+'</details></section>';
}
// ---------------- COLLEGE / DRAFT ----------------
const CMET=[['forty','40-yard dash','s',true],['vertical','Vertical','in',false],['broad','Broad jump','in',false],['bench','Bench reps','',false],['cone','3-cone','s',true],['shuttle','Shuttle','s',true]];
function cPct(pos,key,v,lowGood){const vs=(D&&D.players||[]).filter(x=>x.pos===pos&&x.college&&num(x.college[key])>0).map(x=>num(x.college[key]));if(vs.length<8)return null;const below=vs.filter(x=>lowGood?x>v:x<v).length;return Math.round(100*below/vs.length);}
function collegeSection(d,p){
  const c=p.college;if(!c)return '';
  const exp=num(c.expYears),gp=num((p.form||{}).gp)||0,rook=exp!==null&&exp<=0;
  const rd=num(c.round),pk=num(c.pick);
  const cap=num(c.capital);const capPct=cap!==null?Math.round(cap*100):null;
  const mets=CMET.map(m=>({k:m[0],lab:m[1],u:m[2],low:m[3],v:num(c[m[0]])})).filter(m=>m.v>0);
  const pcts=mets.map(m=>({...m,p:cPct(p.pos,m.k,m.v,m.low)})).filter(m=>m.p!==null);
  let h='<section><h2>'+(rook?'Rookie profile — no NFL sample yet':'Out of college')+'</h2>';
  h+=kv([['School',esc(c.school||'')],['Drafted',rd?('round '+Math.round(rd)+', pick '+Math.round(pk)+' in '+Math.round(num(c.draftYear))):(num(c.draftYear)?'undrafted ('+Math.round(num(c.draftYear))+')':'')],
    [gl('capital','Draft capital'),capPct!==null?capPct+'/100 <small style="color:var(--mute)">'+(capPct>=70?'premium pick — teams force these on the field':(capPct>=40?'solid investment':'late pick — has to earn the work'))+'</small>':''],
    ['Age when drafted',num(c.draftAge)?Math.round(num(c.draftAge))+(num(c.draftAge)<=21?' <small style="color:var(--good)">young for his class</small>':''):''],
    ['Size',[c.height,num(c.weight)?Math.round(num(c.weight))+' lb':''].filter(x=>x).join(' · ')],
    ['NFL seasons',exp!==null?(exp<=0?'rookie':exp+(exp===1?' year in':' years in'))+' · '+gp+' game'+(gp===1?'':'s')+' played':'']]);
  if(pcts.length){h+='<div style="margin-top:8px">'+svgBars({labels:pcts.map(m=>m.lab.split(' ')[0]),series:[{vals:pcts.map(m=>m.p),cls:'me',clsAt:pcts.map(m=>m.p>=70?'good':(m.p<=30?'bad':''))}],h:120,line:{v:50,label:'average '+esc(p.pos)}})+'<div class="sub" style="white-space:normal">Percentile against every '+esc(p.pos)+' in the app with a combine number: '+pcts.map(m=>esc(m.lab)+' '+m.v+m.u+' ('+m.p+'th)').join(' · ')+'</div></div>';}
  const cy=num(c.collYear);
  if(cy){const ry=num(c.recYds)||0,rt=num(c.recTD)||0,rc=num(c.rec)||0,uy=num(c.rushYds)||0,ut=num(c.rushTD)||0,ca=num(c.car)||0,py=num(c.passYds)||0,pt=num(c.passTD)||0;
    const sh=num(c.collShare),us=num(c.collUsage);
    const line=[];if(rc)line.push(rc+' catches, '+Math.round(ry)+' yds, '+Math.round(rt)+' TD');if(ca)line.push(Math.round(ca)+' carries, '+Math.round(uy)+' yds, '+Math.round(ut)+' TD');if(py)line.push(Math.round(py)+' pass yds, '+Math.round(pt)+' TD');
    const shPct=sh!==null?Math.round(sh*100):null;
    h+='<h2 style="margin-top:14px">Last college season · '+Math.round(cy)+' '+esc(c.collTeam||'')+'</h2>'+kv([['Production',line.join('<br>')],
      [gl('share','Share of his offense'),shPct!==null?shPct+'% <small style="color:var(--mute)">'+(shPct>=30?'carried that offense':(shPct>=20?'a real focal point':(shPct>=10?'one of several options':'a complementary piece')))+'</small>':''],
      ['Snap usage',us!==null?Math.round(us*100)+'% of his team\'s plays':'']]);
    const peers=(D&&D.players||[]).filter(x=>x.pos===p.pos&&x.college&&num(x.college.collShare)!==null).map(x=>num(x.college.collShare));
    if(sh!==null&&peers.length>=8){const below=peers.filter(v=>v<sh).length;const pc=Math.round(100*below/peers.length);
      h+=svgBars({labels:['His share','Average '+esc(p.pos)],series:[{vals:[sh*100,(peers.reduce((a,b)=>a+b,0)/peers.length)*100],cls:'me',clsAt:[pc>=70?'good':(pc<=30?'bad':''),'them']}],h:110})+'<div class="sub" style="white-space:normal">'+pc+'th percentile college share among '+esc(p.pos)+'s here. College production share is one of the better rookie signals — it survives the jump better than combine speed does.</div>';}
  }
  if(rook||gp<8)h+='<div class="sub" style="white-space:normal;margin-top:6px">With this little NFL tape, his projection leans on draft capital and the depth chart rather than his own numbers — treat week-to-week swings with more suspicion than usual.</div>';
  return h+'</section>';
}
// ---------------- GLOSSARY ----------------
const GLOSS={
 value:['Value per week','The one number for "how good is this guy going forward". It starts from the rest-of-season consensus, pulls toward his last 3 games and his own career history, adjusts for snap share and whether he is trending up or down, then mixes in a quarter of this week\'s projection. Use it for waivers, trades and who to stash — not for start/sit, where "this week" is the number that matters.'],
 week:['This week','What the six projection sources expect him to score in this week\'s game, weighted by how accurate each source has been, then cut for injury risk. This is the start/sit number.'],
 ros:['ROS','Rest of season, per week. What the season-long projections expect him to average from here on, ignoring this week\'s matchup. Good for trades and stashes.'],
 form:['Form','His average PPR points over his last 3 games. It answers "what is he doing lately", which projections are slow to catch. Weighted more heavily the more games he has played this season.'],
 usage:['Usage','How much of his offense he touches — target share for pass catchers, snap share for quarterbacks. Usage is stickier week to week than points, so a big usage number with small points often means points are coming.'],
 history:['History','His own points per game in 2025, or his career average if 2025 was short. It keeps a hot three weeks from running away with the number.'],
 health:['Health','Chance he actually plays and finishes, from his injury designation and the latest news. Out, IR or PUP is 0%, doubtful 35%, questionable 85%, healthy 100%. This multiplies his weekly projection.'],
 experts:['Expert rank','FantasyPros consensus rank across all their experts, plus how much those experts disagree. A wide spread means nobody knows, which is itself worth knowing.'],
 next3:['Next 3','How friendly his next three defenses are to his position, as a multiplier. 1.0 is average, 1.2 means those defenses give up 20% more than normal to his position, 0.8 means they are tough.'],
 buzz:['Buzz','Net tone of the last 72 hours of news about him, from our keyword list. Negative is bad news piling up, positive is good news. It is a nudge, not a projection.'],
 linemove:['Line move','How far the betting line has shifted since the week opened, in points. Money moves for a reason — a line sliding toward a team usually means the market learned something (a starter is out, weather turned) before the injury reports and projections catch up. A move of 2 points or more is worth a look.'],
 rushv:['Pass rush','A per-game score for what a defender does to the quarterback: three points a sack, plus a bit for every quarterback hit and tackle for loss. It is not fantasy scoring — nobody in your league starts defenders — it is a way of ranking who actually wrecks a pocket, so you can see at a glance whether the guy your quarterback faces on Sunday is a problem or a name.'],
 coverv:['Coverage','A per-game score for a defensive back or linebacker in coverage: three points an interception, one a pass broken up. Thin on two weeks of data, so read it as a hint rather than a verdict.'],
 dmen:['Defenders out','How much of the opposing defence is unavailable this week, weighted by what each missing man is worth per game, then applied to the position it actually helps. A missing edge rusher shows up mostly for your quarterback; a missing corner mostly for your receivers. Capped at 8% and deliberately small, because two weeks of snaps is a thin base to reason from.'],
 livewin:['Live win chance','Who wins the actual NFL game, updated from the score and the clock. It starts at the betting line, then leans harder on the scoreboard as time runs out — a 7-point lead in the first quarter is worth far less than the same lead with four minutes left.'],
 winpct:['Win %','Your chance of winning this week. Every slot is treated as a range rather than a single number — a receiver can swing 20 points, a kicker maybe 6 — and we add those swings up. Players who finished are locked in, players mid-game count part way.'],
 slotwin:['Slot win %','Chance your player outscores theirs in that slot, given how much each can swing from here.'],
 capital:['Draft capital','Where he went in the NFL draft, on a 0–100 scale. It matters because teams play their expensive picks through bad games, and that opportunity is what fantasy points come from.'],

function svgRadar(axes,opts){ // axes:[{label,v(0..1),txt}]
  const n=axes.length;if(n<3)return '';const S=300,c=S/2,r=105;const ang=i=>-Math.PI/2+i*2*Math.PI/n;

  [0.25,0.5,0.75,1].forEach(k=>{h+='<polygon points="'+axes.map((a,i)=>pt(i,k).join(',')).join(' ')+'" fill="none" stroke="var(--line)"/>'});
  axes.forEach((a,i)=>{const p=pt(i,1);h+='<line x1="'+c+'" y1="'+c+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="var(--line)"/>'});
  h+='<polygon class="rad'+(opts&&opts.cls?' '+opts.cls:'')+'" points="'+axes.map((a,i)=>pt(i,Math.max(0.02,Math.min(1,num(a.v)||0))).join(',')).join(' ')+'"/>';
  axes.forEach((a,i)=>{const p=pt(i,Math.max(0.02,Math.min(1,num(a.v)||0)));h+='<circle class="radp" cx="'+p[0]+'" cy="'+p[1]+'" r="3"/>';const q=pt(i,1.22);h+='<text x="'+q[0]+'" y="'+q[1]+'" font-size="10" text-anchor="middle" fill="var(--ink)">'+esc(a.label)+'</text><text x="'+q[0]+'" y="'+(q[1]+11)+'" font-size="9" text-anchor="middle" fill="var(--mute)">'+esc(a.txt||'')+'</text>'});
  return h+'</svg>';
}

}
// ---------------- INJURIES ----------------
function renderInjuries(d){
  const ps=(d.players||[]).filter(p=>p.inj&&!blank(p.inj.status));
  const order={Out:0,IR:1,PUP:2,Doubtful:3,Questionable:4,Sus:5,COV:6,NA:7,DNR:8};
  const f=state.ifilt||'ALL';
  let list=ps.slice();if(f==='MINE')list=list.filter(p=>num(p.owner)===5);else if(f==='LEAGUE')list=list.filter(p=>num(p.owner));else if(f==='FA')list=list.filter(p=>!num(p.owner));else if(f!=='ALL')list=list.filter(p=>p.inj.status===f);
  list.sort((a,b)=>(num(b.owner)===5?1:0)-(num(a.owner)===5?1:0)||(order[a.inj.status]??9)-(order[b.inj.status]??9)||(num(b.value)||0)-(num(a.value)||0));
  const counts={};ps.forEach(p=>{counts[p.inj.status]=(counts[p.inj.status]||0)+1});const ks=Object.keys(counts).sort((a,b)=>(order[a]??9)-(order[b]??9));
  let h='<section><h2>Injuries · '+ps.length+' players flagged</h2>'+svgBars({labels:ks,series:[{vals:ks.map(k=>counts[k]),cls:'me',clsAt:ks.map(k=>/out|ir|pup|sus/i.test(k)?'bad':(/doubt|quest/i.test(k)?'warn':''))}],h:120})+'<div class="filters" style="margin-top:8px"><select id="ifilt">'+[['ALL','Everyone'],['MINE','My roster'],['LEAGUE','Rostered in league'],['FA','Free agents']].concat(ks.map(k=>[k,k])).map(o=>'<option value="'+o[0]+'"'+(f===o[0]?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></div></section>';
  state.ctx=list.slice(0,80).map(p=>p.name);state.ctxName='Injuries';
  h+='<section>'+list.slice(0,80).map(p=>{const i=p.inj;const g=p.game||{};
    return '<div class="row tapp" data-player="'+esc(p.name)+'">'+face(p.sid,p.team,p.pos)+'<div class="main" style="white-space:normal"><div class="name'+(num(p.owner)===5?' mine':'')+'">'+esc(p.name)+' <span class="flag'+(/out|ir|pup|sus/i.test(i.status)?' bad':'')+'" style="font-weight:700">'+esc(i.status)+'</span>'+(blank(i.part)?'':' <span class="sub">'+esc(i.part)+'</span>')+'</div><div class="sub" style="white-space:normal">'+esc([p.pos,p.team,num(p.owner)?p.ownerName:'Free agent',i.practice?'practice: '+i.practice:'',g.opp?(g.ha==='Home'?'v ':'@ ')+g.opp+' '+(g.kick||''):''].filter(x=>!blank(x)).join(' · '))+(blank(i.note)?'':'<br>'+esc(i.note))+(blank(p.statusKw)?'':'<br><span class="flag">news: '+esc(p.statusKw)+'</span>')+'</div></div><div class="pts"><b>'+f1(p.value)+'</b><small>value</small></div></div>'}).join('')+(list.length>80?'<div class="sub">showing 80 of '+list.length+'</div>':'')+'</section>';
  return h;
}
// ---------------- NEWS ----------------
function renderNews(d){
  const all=(d.newsAll||[]);const f=state.nfilt||'ALL';
  let list=all.slice();if(f==='MINE')list=list.filter(x=>num(x.owner)===5);else if(f==='LEAGUE')list=list.filter(x=>num(x.owner));else if(f==='NEG')list=list.filter(x=>num(x.sig)<0);else if(f==='POS')list=list.filter(x=>num(x.sig)>0);else if(f!=='ALL')list=list.filter(x=>x.src===f);
  const q=(state.nq||'').toLowerCase();if(q)list=list.filter(x=>String(x.player).toLowerCase().indexOf(q)>=0||String(x.head).toLowerCase().indexOf(q)>=0);
  const srcs=Array.from(new Set(all.map(x=>x.src)));
  const FN={ALL:'everything',MINE:'your players',LEAGUE:'rostered players',NEG:'bad news',POS:'good news'};
  const net={};list.forEach(x=>{if(num(x.age)>72)return;const k=cleanName(x.player);if(!k)return;const o=net[k]||(net[k]={n:0,sig:0,owner:x.owner,ownerName:x.ownerName});o.n++;o.sig+=(num(x.sig)||0)});
  const mv=Object.keys(net).map(k=>Object.assign({name:k},net[k])).filter(x=>Math.abs(x.sig)>=0.5).sort((a,b)=>Math.abs(b.sig)-Math.abs(a.sig)).slice(0,8);
  const mine2=mv.filter(x=>num(x.owner)===5);
  let h='<section><h2>Who moved · last 72h'+(f==='ALL'?'':' · '+esc(FN[f]||f))+'</h2>';
  if(mv.length)h+=svgBars({labels:mv.map(x=>String(x.name).split(' ').slice(-1)[0].slice(0,9)),series:[{vals:mv.map(x=>Math.abs(x.sig)),cls:'me',clsAt:mv.map(x=>x.sig<0?'bad':'good')}],h:140,legend:[['bad','bad news'],['good','good news']]})
    +'<div class="sub" style="white-space:normal">How loudly the last 3 days of news moved each player: '+mv.slice(0,4).map(x=>pl(x.name)+' <b style="color:'+(x.sig<0?'var(--bad)':'var(--good)')+'">'+(x.sig>0?'+':'')+f1(x.sig)+'</b> ('+x.n+' report'+(x.n===1?'':'s')+')').join(' · ')+'. '+(mine2.length?'<b>On your roster:</b> '+mine2.map(x=>pl(x.name)+' ('+(x.sig>0?'+':'')+f1(x.sig)+')').join(', ')+'.':'Nobody on your roster is in it.')+'</div>';
  else h+='<div class="sub" style="white-space:normal">Nothing in the last 3 days carried a strong signal'+(f==='ALL'?'':' under this filter')+'.</div>';
  h+='<div class="sub" style="margin-top:6px">'+list.length+(f==='ALL'?'':' of '+all.length)+' report'+(list.length===1?'':'s')+' in the last 7 days.</div>'+'<div class="filters" style="margin-top:8px"><select id="nfilt">'+[['ALL','Everything'],['MINE','My players'],['LEAGUE','Rostered in league'],['NEG','Bad news'],['POS','Good news']].concat(srcs.map(s=>[s,s])).map(o=>'<option value="'+o[0]+'"'+(f===o[0]?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select><input id="nq" type="search" placeholder="Search news" value="'+esc(state.nq||'')+'"></div></section>';
  h+='<section>'+list.slice(0,80).map(x=>{const ago=num(x.age)===null?'':(x.age<1?'now':(x.age<24?Math.round(x.age)+'h':Math.round(x.age/24)+'d'));const sg=num(x.sig)||0;
    return '<div style="padding:8px 0;border-top:1px solid var(--line);white-space:normal;line-height:1.35"><div><b>'+pl(x.player)+'</b>'+(x.team?' <span class="sub">'+esc(x.pos)+' · '+esc(x.team)+'</span>':'')+(num(x.owner)?' <span class="pill'+(num(x.owner)===5?' warn':'')+'">'+(num(x.owner)===5?'YOU':tn(x.ownerName))+'</span>':'')+'</div><div>'+esc(x.head)+'</div>'+(blank(x.body)?'':'<div class="sub" style="white-space:normal">'+esc(x.body)+'</div>')+'<div class="sub">'+esc(x.src)+' · '+ago+(blank(x.kw)?'':' · <span class="'+(sg<0?'form dn':(sg>0?'form up':''))+'">'+esc(x.kw)+'</span>')+'</div></div>'}).join('')+'</section>';
  return h;
}
// ---------------- SEARCH ----------------
function searchHits(q){q=q.toLowerCase();if(q.length<2)return [];const out=[];
  (D.nflTeams||[]).forEach(t=>{if(String(t.name).toLowerCase().indexOf(q)>=0||String(t.team).toLowerCase()===q||String(t.hc).toLowerCase().indexOf(q)>=0||String(t.oc).toLowerCase().indexOf(q)>=0||String(t.dc).toLowerCase().indexOf(q)>=0)out.push({t:'nfl',label:t.name,sub:'HC '+t.hc+' · OC '+t.oc+' · DC '+t.dc,href:'#nfl/'+t.team,team:t.team})});
  (D.teams||[]).forEach(t=>{if(String(t.name).toLowerCase().indexOf(q)>=0||String(t.manager).toLowerCase().indexOf(q)>=0)out.push({t:'team',label:t.manager,sub:'Manager · '+t.name,href:'#team/'+t.team})});
  (D.nflTeams||[]).forEach(t=>{[['hc','Head coach'],['oc','Offensive coordinator'],['dc','Defensive coordinator']].forEach(r=>{const n=t[r[0]];if(n&&String(n).toLowerCase().indexOf(q)>=0)out.push({t:'nfl',label:n,sub:r[1]+' · '+t.name,href:'#coach/'+encodeURIComponent(n),team:t.team})})});
  (D.players||[]).filter(p=>String(p.name).toLowerCase().indexOf(q)>=0).sort((a,b)=>(num(b.value)||0)-(num(a.value)||0)).slice(0,8).forEach(p=>out.push({t:'player',label:p.name,sub:[p.pos,p.team,num(p.owner)?p.ownerName:'Free agent'].join(' · '),href:'#player/'+encodeURIComponent(p.name),sid:p.sid,team:p.team,pos:p.pos}));
  return out.slice(0,10);}

function crumbFill(d,v){
  const el=document.getElementById('crumb');if(!el)return;
  const P=n=>'<b>'+esc(n)+'</b>';const sep='<span class="sep">›</span>';
  let trail='',deep=false;
  if(v==='home')trail=P('Home');
  else if(v==='league')trail=P('League');
  else if(v==='players')trail=P('Players');
  else if(v==='games')trail=P('Games');
  else if(v==='matchups')trail=P('Matchups');
  else if(v==='matchup'){deep=true;const x=weekPairs(d,state.mwk)[num(state.midx)];trail='Matchups'+sep+P(x?(mgrOf(d,x.a)||x.a)+' vs '+(mgrOf(d,x.b)||x.b):'Matchup');}
  else if(v==='injuries')trail=P('Injuries');
  else if(v==='news')trail=P('News');
  else if(v==='dev')trail=P('Engine room');
  else if(v==='team'){deep=true;const t=(d.power||[]).find(x=>String(x.team)===String(state.team))||{};
    trail='League'+sep+P((t.manager||'Team')+(t.name?' · '+t.name:''));}
  else if(v==='player'){deep=true;const nm=cleanName(state.player);const pl2=(d.players||[]).find(x=>String(x.name).toLowerCase()===String(nm).toLowerCase())||{};
    trail=(state.ctxName?esc(state.ctxName):'Players')+sep+P(nm)+(pl2.pos?' <span class="sub">'+esc(pl2.pos)+(pl2.team?' · '+esc(pl2.team):'')+'</span>':'');}
  else if(v==='nfl'){deep=true;const t=(d.nflTeams||[]).find(x=>x.team===String(state.nfl2).toUpperCase())||{};
    trail='NFL teams'+sep+P(t.name||state.nfl2);}
  else if(v==='coach'){deep=true;const nm=state.coach;const ts=(d.nflTeams||[]);let team='';
    ts.forEach(t=>{['hc','oc','dc'].forEach(r=>{if(String(t[r]).toLowerCase()===String(nm).toLowerCase())team=t.name})});
    trail='Coaches'+sep+P(nm)+(team?' <span class="sub">'+esc(team)+'</span>':'');}
  else trail=P(v);
  el.innerHTML=(deep?'<a class="back" href="javascript:history.back()">‹</a>':'')+'<span class="path">'+trail+'</span>';
}
// ---------------- ROUTER ----------------
function route(){
  NAV=true;
  const hsh=decodeURIComponent(location.hash||"#home").slice(1);
  const parts=hsh.split("/");
  state.view=parts[0]||"home";
  if(state.view==="team")state.team=parts[1];
  if(state.view==="player")state.player=parts.slice(1).join("/");
  if(state.view==="nfl")state.nfl2=parts[1];
  if(state.view==="coach")state.coach=parts.slice(1).join("/");
  if(state.view==="matchup"){state.mwk=parts[1];state.midx=parts[2];}
  render();
}
function render(){
  const d=D; if(!d)return;
  if(clockTimer)clearInterval(clockTimer);
  clockTimer=setInterval(()=>{const el=document.getElementById('clock');if(el)el.textContent=clockText(d);},15000);
  d_week=num(d.week); stamp(d);
  let h="";
  const v=state.view;
  if(v==="league")h=renderLeague(d);
  else if(v==="team")h=renderTeam(d,state.team);
  else if(v==="players")h=renderPlayers(d);
  else if(v==="player")h=renderPlayer(d,state.player);
  else if(v==="games")h=renderGames(d);
  else if(v==="matchups")h=renderMatchups(d);
  else if(v==="matchup")h=renderMatchup(d,state.mwk,state.midx);
  else if(v==="nfl")h=renderNfl(d,state.nfl2);
  else if(v==="coach")h=renderCoach(d,state.coach);
  else if(v==="dev")h=renderDev(d);
  else if(v==="injuries")h=renderInjuries(d);
  else if(v==="news")h=renderNews(d);
  else h=renderHome(d);
  const _sy=Math.max(window.scrollY,SY);
  h+=laptopPanel(d);
  $("#app").innerHTML=h;
  crumbFill(d,v);
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===(v==="team"||v==="coach"||v==="nfl"?"league":(v==="player"?"players":v))));
  document.querySelectorAll(".ctl button[data-cmd]").forEach(b=>b.addEventListener("click",()=>send(b.dataset.cmd,CMDKEY,b)));
  const ck=$("#cmdsave");if(ck)ck.addEventListener("click",()=>{const v=($("#cmdkey").value||"").trim();if(v){CMDKEY=v;try{localStorage.setItem('lhc_cmd',v)}catch(e){}render()}});
  const cc=$("#cmdclear");if(cc)cc.addEventListener("click",e=>{e.preventDefault();CMDKEY='';try{localStorage.removeItem('lhc_cmd')}catch(e){}render()});
  const ps2=$('#pinsave');if(ps2)ps2.addEventListener('click',()=>{const val=($('#pinin').value||'').trim();PIN=val;try{localStorage.setItem('lhc_pin',val)}catch(e){}render()});
  const po=$('#pinout');if(po)po.addEventListener('click',e=>{e.preventDefault();PIN='';try{localStorage.removeItem('lhc_pin')}catch(e){}render()});
  const db=$('#devbtn');if(db){db.classList.toggle('on',v==='dev');db.style.display=SHOW?'none':'';}
  document.querySelectorAll('[data-want]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();
    const [m,kind,val]=b.dataset.want.split('|');const w=WANTS[m]||(WANTS[m]={pos:[],offered:[]});
    const arr=kind==='pos'?(w.pos=w.pos||[]):(w.offered=w.offered||[]);
    const i=arr.indexOf(val); if(i>=0)arr.splice(i,1); else arr.push(val);
    saveWants();render();}));
  document.querySelectorAll("[data-team]").forEach(el=>el.addEventListener("click",()=>{location.hash="#team/"+el.dataset.team}));
  document.querySelectorAll("[data-player]").forEach(el=>el.addEventListener("click",()=>{location.hash="#player/"+encodeURIComponent(el.dataset.player)}));
  const fp=$("#f-pos"),fo=$("#f-owner"),fs=$("#f-sort"),fq=$("#f-q"),mo=$("#more");
  const save=()=>{try{localStorage.setItem("lhc_filters",JSON.stringify(state.filters))}catch(e){}};
  if(fp)fp.addEventListener("change",()=>{state.filters.pos=fp.value;state.limit=60;save();render()});
  if(fo)fo.addEventListener("change",()=>{state.filters.owner=fo.value;state.limit=60;save();render()});
  if(fs)fs.addEventListener("change",()=>{state.filters.sort=fs.value;state.limit=60;save();render()});
  if(fq)fq.addEventListener("input",()=>{state.filters.q=fq.value;state.limit=60;save();const keep=fq.selectionStart;render();const q2=$("#f-q");if(q2){q2.focus();try{q2.setSelectionRange(keep,keep)}catch(e){}}});
  if(mo)mo.addEventListener("click",()=>{state.limit=(state.limit||60)+60;render()});
  const gw=$("#gweek");if(gw)gw.addEventListener("change",()=>{state.gweek=gw.value;render()});
  const mw=$("#mweek");if(mw)mw.addEventListener("change",()=>{state.mweek=mw.value;render()});
  const ns=$("#nflsel");if(ns)ns.addEventListener("change",()=>{if(ns.value)location.hash='#nfl/'+ns.value});
  const ifl=$("#ifilt");if(ifl)ifl.addEventListener("change",()=>{state.ifilt=ifl.value;render()});
  const nfl=$("#nfilt");if(nfl)nfl.addEventListener("change",()=>{state.nfilt=nfl.value;render()});
  const nq=$("#nq");if(nq)nq.addEventListener("input",()=>{state.nq=nq.value;const k=nq.selectionStart;render();const q2=$("#nq");if(q2){q2.focus();try{q2.setSelectionRange(k,k)}catch(e){}}});
  if(NAV){if(v!=="players"){RESTORING=1;window.scrollTo(0,0);RESTORING=0;SY=0}NAV=false}else{keepPlace(_sy)}
}
function flash(btn,cls,txt,ms){if(!btn)return;const old=btn.dataset.lbl||btn.textContent;btn.dataset.lbl=old;
  btn.classList.remove('sending','sent','failed');btn.classList.add(cls);if(txt)btn.textContent=txt;
  if(ms)setTimeout(()=>{btn.classList.remove(cls);btn.textContent=old},ms);}
function send(cmd,topic,btn){
  const m=$("#ctlmsg"); if(m)m.textContent="Sending…";
  flash(btn,'sending','Sending…');
  fetch("https://ntfy.sh/"+topic,{method:"POST",body:cmd}).then(r=>{
    if(m)m.textContent=r.ok?"Sent. The laptop replies to your phone in a few seconds.":"Couldn't send ("+r.status+").";
    flash(btn,r.ok?'sent':'failed',r.ok?'Sent ✓':'Failed',2600);
  }).catch(()=>{if(m)m.textContent="Couldn't send — no connection.";flash(btn,'failed','No connection',2600);});
}
function load(){
  fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{D=d;try{localStorage.setItem("lhc",JSON.stringify(d))}catch(e){}if(LIVE.stats&&LIVE.at&&(Date.now()-LIVE.at.getTime())<180000)applyLive();render();liveTick(true)})
  .catch(()=>{try{const c=localStorage.getItem("lhc");if(c&&!D){D=JSON.parse(c);render();$("#stamp").textContent+=" · offline copy"}else if(!D){$("#stamp").textContent="no data yet"}}catch(e){$("#stamp").textContent="no data yet"}});
}
(function(){const inp=document.getElementById('gs'),box=document.getElementById('gsr');if(!inp)return;
  inp.addEventListener('input',()=>{if(!D){box.innerHTML='';return}const hits=searchHits(inp.value);box.innerHTML=hits.map(x=>'<a class="hit" href="'+x.href+'">'+(x.t==='player'?face(x.sid,x.team,x.pos):(x.t==='nfl'?logo(x.team):'<div class="logo"></div>'))+'<div><div class="name">'+esc(x.label)+'</div><div class="sub">'+esc(x.sub)+'</div></div></a>').join('');box.style.display=hits.length?'block':'none';});
  box.addEventListener('click',()=>{box.style.display='none';inp.value='';});inp.addEventListener('blur',()=>setTimeout(()=>{box.style.display='none'},250));})();
(function(){const b=document.getElementById('aa');if(!b)return;let big=false;try{big=localStorage.getItem('lhc_big')==='1'}catch(e){}const ap=()=>{document.body.classList.toggle('big',big);b.setAttribute('aria-pressed',big?'true':'false');b.classList.toggle('on',big)};ap();b.addEventListener('click',()=>{big=!big;try{localStorage.setItem('lhc_big',big?'1':'0')}catch(e){}ap()});})();
(function(){const b=document.getElementById('show');if(!b)return;const ap=()=>{b.textContent=SHOW?'Show mode on':'Show mode';b.classList.toggle('on',SHOW);document.body.classList.toggle('show',SHOW)};ap();b.addEventListener('click',()=>{SHOW=!SHOW;try{localStorage.setItem('lhc_show',SHOW?'1':'0')}catch(e){}ap();render()});})();
document.getElementById('app').addEventListener('click',e=>{const gx=e.target.closest('[data-gl]');if(gx){e.preventDefault();e.stopPropagation();glShow(gx.dataset.gl);return}const el=e.target.closest('[data-nfl],[data-psid]');if(!el)return;if(el.dataset.psid){const p=(D&&D.players||[]).find(x=>String(x.sid)===String(el.dataset.psid));if(p){e.preventDefault();e.stopPropagation();location.hash='#player/'+encodeURIComponent(p.name);return}}if(el.dataset.nfl&&(D&&D.nflTeams||[]).some(t=>t.team===el.dataset.nfl)){e.preventDefault();e.stopPropagation();location.hash='#nfl/'+el.dataset.nfl}});
(function(){let sx=0,sy=0,st=0;const app=document.getElementById('app');
  app.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
  app.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;if(Date.now()-st>700||Math.abs(dx)<70||Math.abs(dy)>50)return;
    const dir=dx<0?1:-1;
    if(state.view==='player'){const ctx=state.ctx||[];const ci=ctx.findIndex(n=>String(n).toLowerCase()===cleanName(state.player).toLowerCase());const ni=ci+dir;if(ci>=0&&ni>=0&&ni<ctx.length)location.hash='#player/'+encodeURIComponent(ctx[ni]);}
    else if(state.view==='team'){const pw=(D.power||[]).slice().sort((a,b)=>(num(a.standing)||99)-(num(b.standing)||99));const i=pw.findIndex(x=>String(x.team)===String(state.team));const n=i+dir;if(i>=0&&n>=0&&n<pw.length)location.hash='#team/'+pw[n].team;}
    else if(state.view==='coach'){const ts=(D.nflTeams||[]);let role=null,i=-1;ts.forEach((t,k)=>{['hc','oc','dc'].forEach(r=>{if(String(t[r]).toLowerCase()===String(state.coach).toLowerCase()){role=r;i=k}})});const n=i+dir;if(role&&n>=0&&n<ts.length)location.hash='#coach/'+encodeURIComponent(ts[n][role]);}
    else if(state.view==='nfl'){const ts=(D.nflTeams||[]);const i=ts.findIndex(x=>x.team===String(state.nfl2).toUpperCase());const n=i+dir;if(i>=0&&n>=0&&n<ts.length)location.hash='#nfl/'+ts[n].team;}
    else if(state.view==='matchup'){const ps=weekPairs(D,state.mwk);const i=num(state.midx);const n=i+dir;if(i!==null&&n>=0&&n<ps.length)location.hash='#matchup/'+state.mwk+'/'+n;}
    // same order as the nav row, or swiping skips a tab
    else{const tabs=['home','matchups','league','players','games','injuries','news'];const i=tabs.indexOf(state.view);const n=i+dir;if(i>=0&&n>=0&&n<tabs.length)location.hash='#'+tabs[n];}
  },{passive:true});})();
window.addEventListener("hashchange",route);
route(); load();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
setInterval(load,5*60*1000);
})();
</script>
