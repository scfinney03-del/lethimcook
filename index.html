function wantsOf(m){return WANTS[m]||{pos:[],offered:[]}}
function myTeamId(d){const me=(d.power||[]).find(x=>isMine(x.name));return me?me.team:null;}
function rosterOf(d,tid){return (d.league||[]).filter(r=>String(r.team)===String(tid)&&!/^IR/.test(r.slot||''));}
function bestNine(rows,key){
  const used={},out=[];
  SLOTS.forEach(s=>{let best=null;rows.forEach(p=>{if(used[p.player])return;if(s[1].indexOf(p.pos)<0)return;const v=num(p[key])||0;if(!best||v>(num(best[key])||0))best=p});
    if(best){used[best.player]=1;out.push(best)}});
  return {pts:out.reduce((a,p)=>a+(num(p[key])||0),0),used:used};
}
// A roster is worth more than its starting nine: the bench is insurance against injuries, byes
// and the guy who quietly becomes a starter in three weeks. That is why a bench-for-bench swap
// is not automatically worth zero.
function teamValue(rows){
  const nine=bestNine(rows,'value');
  let bench=0;rows.forEach(p=>{if(!nine.used[p.player])bench+=Math.max(0,num(p.value)||0)});
  return nine.pts+0.3*bench;
}
function weekPts(rows){return bestNine(rows,'week').pts;}
function asRow(p){return {player:p.name,pos:p.pos,value:p.value,ros:(p.ros&&p.ros.cons),week:p.proj,slot:'BN',nfl:p.team,bye:p.bye};}
function tradeCheck(d,p){
  if(SHOW)return '';
  const tid=myTeamId(d);if(tid===null)return '';
  const own=num(p.owner);
  if(!own||String(own)===String(tid))return '';
  const mine=rosterOf(d,tid),theirs=rosterOf(d,own);
  if(!mine.length||!theirs.length)return '';
  const theirTeam=(d.power||[]).find(x=>String(x.team)===String(own))||{};
  const mgr=theirTeam.manager||p.ownerName||'them';
  const W=wantsOf(mgr);
  const offered=(W.offered||[]).some(n=>cleanName(n)===cleanName(p.name));
  const target=theirs.find(r=>cleanName(r.player)===cleanName(p.name))||asRow(p);
  const base=teamValue(mine),baseT=teamValue(theirs),baseW=weekPts(mine);
  const offers=[];
  mine.forEach(g=>{
    const newMine=mine.filter(r=>r.player!==g.player).concat([target]);
    const newTheirs=theirs.filter(r=>cleanName(r.player)!==cleanName(target.player)).concat([g]);
    const wanted=(W.pos||[]).indexOf(g.pos)>=0;
    // how far below even they will still say yes: further if they asked for this position,
    // further still if they have publicly shopped the player you are asking for
    const tol=-0.75+(wanted?-1.5:0)+(offered?-1.75:0);
    const gt=teamValue(newTheirs)-baseT;
    offers.push({give:g,wanted:wanted,tol:tol,gainMe:teamValue(newMine)-base,gainThem:gt,weekMe:weekPts(newMine)-baseW,ok:gt>=tol});
  });
  offers.sort((a,b)=>b.gainMe-a.gainMe);
  const fair=offers.filter(o=>o.ok);
  const best=fair[0]||null,dream=offers[0]||null;
  const pv=theirTeam.posValue||{};const avg={};
  ['QB','RB','WR','TE','K','DST'].forEach(k=>{const v=(d.power||[]).map(x=>x.posValue&&num(x.posValue[k])).filter(x=>x!==null);avg[k]=v.length?v.reduce((a,b)=>a+b,0)/v.length:null});
  const theirThin=['QB','RB','WR','TE'].filter(k=>num(avg[k])&&num(pv[k])<avg[k]*0.85);
  const inj=(p.inj||{}).status||'';
  const already=(d.trades||[]).find(t=>cleanName(t.get)===cleanName(p.name));
  let verdict,cls,why;
  if(!best&&dream&&dream.gainMe>0.15){verdict='They will laugh';cls='bad';why='He would add '+f1(dream.gainMe)+'/wk of roster value, but every package that gets him costs them '+f1(Math.abs(dream.gainThem))+'/wk. You would need to package two pieces.';}
  else if(!best||best.gainMe<=0.15){verdict='Pass';cls='bad';why='Even counting bench insurance he adds '+f1(best?best.gainMe:(dream?dream.gainMe:0))+'/wk of roster value. Not worth the asset.';}
  else if(best.gainMe>=1.5&&best.gainThem>=-0.25){verdict='Go get him';cls='good';why='Adds '+f1(best.gainMe)+'/wk of roster value and barely dents theirs.';}
  else if(best.gainMe>=0.8){verdict=offered?'Ask now':'Worth asking';cls='warn';why='Adds '+f1(best.gainMe)+'/wk. They give up '+f1(Math.abs(best.gainThem))+'/wk'+(offered?', but they have already put him on the block, so the ask is cheap.':', so expect to sweeten it.');}
  else {verdict='Only if cheap';cls='warn';why='A thin gain of '+f1(best.gainMe)+'/wk — worth it only for a bench piece you do not miss.';}
  if(/^(IR|Out|PUP|Sus)/i.test(inj)&&verdict!=='Pass'){verdict='Wait';cls='bad';why='He is '+esc(inj)+'. Revisit when he practices — his manager reads the same report you do.';}
  let h='<section><details><summary style="color:var(--ink);font-size:15px"><b>Trade for him?</b> <span class="pill '+(cls==='good'?'ok':(cls==='bad'?'bad':'warn'))+'">'+esc(verdict)+'</span></summary>';
  h+='<div class="sub" style="white-space:normal;margin-top:6px">'+why+'</div>';
  // what this manager has asked for - you tell the app, it changes the maths
  h+='<div class="wants"><div class="sub" style="font-weight:600">What has '+esc(mgr)+' asked for?</div><div class="wi-chips">'
    +['QB','RB','WR','TE'].map(k=>'<button class="wchip'+((W.pos||[]).indexOf(k)>=0?' on':'')+'" data-want="'+esc(mgr)+'|pos|'+k+'">'+k+'</button>').join('')
    +'<button class="wchip'+(offered?' on':'')+'" data-want="'+esc(mgr)+'|off|'+esc(p.name)+'">offered '+esc(String(p.name).split(' ').slice(-1)[0])+'</button></div>'
    +'<div class="sub" style="white-space:normal">'+((W.pos||[]).length||offered?'Counted: '+[(W.pos||[]).length?'wants '+(W.pos||[]).join('/'):'',offered?'has shopped '+esc(p.name):''].filter(x=>x).join(' · ')+'. Packages matching that get more rope before they say no.':'Tap what they said in the league chat. It loosens how much they have to gain for a deal to be realistic.')+'</div></div>';
  h+=kv([['Owner',mg(theirTeam.manager,own)+' <small>('+tn(p.ownerName||'')+')</small>'],
    ['His value',f1(p.value)+'/wk <small>ROS '+f1(p.ros&&p.ros.cons)+'</small>'],
    ['They are thin at',theirThin.length?theirThin.join(', '):'<span class="sub">nothing obvious</span>'],
    ['Trade engine',already?'already lists him — give '+pl(already.give)+', score '+f1(already.score):'<span class="sub">not in this week\'s top trades</span>']]);
  const show=(fair.length?fair:offers).slice(0,3);
  if(show.length){h+='<div class="sub" style="font-weight:600;margin-top:8px">'+(fair.length?'Best packages from your roster':'Closest you could get')+'</div>';
    h+=show.map(o=>'<div class="row" style="padding:8px 0"><div class="main" style="white-space:normal"><div class="name">Give '+pl(o.give.player)+' <small class="sub">'+esc(o.give.pos)+' · '+f1(o.give.value)+'/wk</small>'+(o.wanted?' <span class="pill ok">they asked for '+esc(o.give.pos)+'</span>':'')+'</div><div class="sub" style="white-space:normal">roster value: you '+(o.gainMe>=0?'+':'')+f1(o.gainMe)+'/wk · them '+(o.gainThem>=0?'+':'')+f1(o.gainThem)+'/wk · this week '+(o.weekMe>=0?'+':'')+f1(o.weekMe)+' · '+(o.ok?'<b style="color:var(--good)">realistic ask</b>':'<b style="color:var(--bad)">they say no</b>')+'</div></div><div class="pts"><b style="color:'+(o.gainMe>0?'var(--good)':'var(--bad)')+'">'+(o.gainMe>0?'+':'')+f1(o.gainMe)+'</b><small>roster</small></div></div>').join('');
    h+=svgBars({labels:show.map(o=>String(o.give.player).split(' ').slice(-1)[0].slice(0,8)),series:[{vals:show.map(o=>o.gainMe),cls:'me'},{vals:show.map(o=>o.gainThem),cls:'them'}],h:120,legend:[['me','your gain'],['them','their gain']]});
  }
  h+='<div class="sub" style="white-space:normal;margin-top:6px">Roster value = best starting nine by '+gl('value','value')+' plus 30% of the bench, so depth counts — a bench player who becomes a starter after an injury or a bye is not worth zero. "This week" is the immediate lineup effect.</div>';
  return h+'</details></section>';
}
// ---------------- COLLEGE / DRAFT ----------------
const CMET=[['forty','40-yard dash','s',true],['vertical','Vertical','in',false],['broad','Broad jump','in',false],['bench','Bench reps','',false],['cone','3-cone','s',true],['shuttle','Shuttle','s',true]];
function cPct(pos,key,v,lowGood){const vs=(D&&D.players||[]).filter(x=>x.pos===pos&&x.college&&num(x.college[key])>0).map(x=>num(x.college[key]));if(vs.length<8)return null;const below=vs.filter(x=>lowGood?x>v:x<v).length;return Math.round(100*below/vs.length);}
function collegeSection(d,p){
  const c=p.college;if(!c)return '';
  const exp=num(c.expYears),gp=num((p.form||{}).gp)||0,rook=exp!==null&&exp<=0;
  const rd=num(c.round),pk=num(c.pick);
  const cap=num(c.capital);const capPct=cap!==null?Math.round(cap*100):null;
  const mets=CMET.map(m=>({k:m[0],lab:m[1],u:m[2],low:m[3],v:num(c[m[0]])})).filter(m=>m.v>0);
  const pcts=mets.map(m=>({...m,p:cPct(p.pos,m.k,m.v,m.low)})).filter(m=>m.p!==null);
  let h='<section><h2>'+(rook?'Rookie profile — no NFL sample yet':'Out of college')+'</h2>';
  h+=kv([['School',collegeLink(c.school||'')],['Drafted',rd?('round '+Math.round(rd)+', pick '+Math.round(pk)+' in '+Math.round(num(c.draftYear))):(num(c.draftYear)?'undrafted ('+Math.round(num(c.draftYear))+')':'')],
    [gl('capital','Draft capital'),capPct!==null?capPct+'/100 <small style="color:var(--mute)">'+(capPct>=70?'premium pick — teams force these on the field':(capPct>=40?'solid investment':'late pick — has to earn the work'))+'</small>':''],
    ['Age when drafted',num(c.draftAge)?Math.round(num(c.draftAge))+(num(c.draftAge)<=21?' <small style="color:var(--good)">young for his class</small>':''):''],
    ['Size',[c.height,num(c.weight)?Math.round(num(c.weight))+' lb':''].filter(x=>x).join(' · ')],
    ['NFL seasons',exp!==null?(exp<=0?'rookie':exp+(exp===1?' year in':' years in'))+' · '+gp+' game'+(gp===1?'':'s')+' played':'']]);
  if(pcts.length){h+='<div style="margin-top:8px">'+svgBars({labels:pcts.map(m=>m.lab.split(' ')[0]),series:[{vals:pcts.map(m=>m.p),cls:'me',clsAt:pcts.map(m=>m.p>=70?'good':(m.p<=30?'bad':''))}],h:120,line:{v:50,label:'average '+esc(p.pos)}})+'<div class="sub" style="white-space:normal">Percentile against every '+esc(p.pos)+' in the app with a combine number: '+pcts.map(m=>esc(m.lab)+' '+m.v+m.u+' ('+m.p+'th)').join(' · ')+'</div></div>';}
  const cy=num(c.collYear);
  if(cy){const ry=num(c.recYds)||0,rt=num(c.recTD)||0,rc=num(c.rec)||0,uy=num(c.rushYds)||0,ut=num(c.rushTD)||0,ca=num(c.car)||0,py=num(c.passYds)||0,pt=num(c.passTD)||0;
    const sh=num(c.collShare),us=num(c.collUsage);
    const line=[];if(rc)line.push(rc+' catches, '+Math.round(ry)+' yds, '+Math.round(rt)+' TD');if(ca)line.push(Math.round(ca)+' carries, '+Math.round(uy)+' yds, '+Math.round(ut)+' TD');if(py)line.push(Math.round(py)+' pass yds, '+Math.round(pt)+' TD');
    const shPct=sh!==null?Math.round(sh*100):null;
    h+='<h2 style="margin-top:14px">Last college season · '+Math.round(cy)+' '+collegeLink(c.collTeam||'')+'</h2>'+kv([['Production',line.join('<br>')],
      [gl('share','Share of his offense'),shPct!==null?shPct+'% <small style="color:var(--mute)">'+(shPct>=30?'carried that offense':(shPct>=20?'a real focal point':(shPct>=10?'one of several options':'a complementary piece')))+'</small>':''],
      ['Snap usage',us!==null?Math.round(us*100)+'% of his team\'s plays':'']]);
    const peers=(D&&D.players||[]).filter(x=>x.pos===p.pos&&x.college&&num(x.college.collShare)!==null).map(x=>num(x.college.collShare));
    if(sh!==null&&peers.length>=8){const below=peers.filter(v=>v<sh).length;const pc=Math.round(100*below/peers.length);
      h+=svgBars({labels:['His share','Average '+esc(p.pos)],series:[{vals:[sh*100,(peers.reduce((a,b)=>a+b,0)/peers.length)*100],cls:'me',clsAt:[pc>=70?'good':(pc<=30?'bad':''),'them']}],h:110})+'<div class="sub" style="white-space:normal">'+pc+'th percentile college share among '+esc(p.pos)+'s here. College production share is one of the better rookie signals — it survives the jump better than combine speed does.</div>';}
  }
  if(rook||gp<8)h+='<div class="sub" style="white-space:normal;margin-top:6px">With this little NFL tape, his projection leans on draft capital and the depth chart rather than his own numbers — treat week-to-week swings with more suspicion than usual.</div>';
  return h+'</section>';
}
// ---------------- GLOSSARY ----------------
const GLOSS={
 value:['Value per week','The one number for "how good is this guy going forward". It starts from the rest-of-season consensus, pulls toward his last 3 games and his own career history, adjusts for snap share and whether he is trending up or down, then mixes in a quarter of this week\'s projection. Use it for waivers, trades and who to stash — not for start/sit, where "this week" is the number that matters.'],
 week:['This week','What the six projection sources expect him to score in this week\'s game, weighted by how accurate each source has been, then cut for injury risk. This is the start/sit number.'],
 ros:['ROS','Rest of season, per week. What the season-long projections expect him to average from here on, ignoring this week\'s matchup. Good for trades and stashes.'],
 form:['Form','His average PPR points over his last 3 games. It answers "what is he doing lately", which projections are slow to catch. Weighted more heavily the more games he has played this season.'],
 usage:['Usage','How much of his offense he touches — target share for pass catchers, snap share for quarterbacks. Usage is stickier week to week than points, so a big usage number with small points often means points are coming.'],
 history:['History','His own points per game in 2025, or his career average if 2025 was short. It keeps a hot three weeks from running away with the number.'],
 alerts:['Player alerts','Two feeds you already pull, shown on every player: Sleeper trending drops and adds over the last 24 hours (500 or more to show), and ESPN\'s rostered share with its change over the week and how often he is started. Adds minus drops is one crowd signal in his value (up to the adds weight either way, on a log scale); the rostered share is shown but not weighted, because counting the crowd twice would stack.'],
 health:['Health','Two things multiplied: the chance he plays this week (injury designation and the latest news: Out, IR or PUP is 0%, doubtful 35%, questionable 85%, a live exit 25%, clean 100%) times how often he has actually been on the field over his career (injury history; a rookie gets his position\'s typical rate). Nobody reads 100. Only the first half multiplies his weekly projection; the second already sits in his season value, so nothing is counted twice.'],
 experts:['Expert rank','FantasyPros consensus rank across all their experts, plus how much those experts disagree. A wide spread means nobody knows, which is itself worth knowing.'],
 next3:['Next 3','How friendly his next three defenses are to his position, as a multiplier. 1.0 is average, 1.2 means those defenses give up 20% more than normal to his position, 0.8 means they are tough.'],
 buzz:['Buzz','Net tone of the last 72 hours of news about him, from our keyword list. Negative is bad news piling up, positive is good news. It is a nudge, not a projection.'],
 linemove:['Line move','How far the betting line has shifted since the week opened, in points. Money moves for a reason — a line sliding toward a team usually means the market learned something (a starter is out, weather turned) before the injury reports and projections catch up. A move of 2 points or more is worth a look.'],
 lifts:['What moved his value','Value starts as a blend of rest-of-season projections, recent form and his own history, then this week\'s consensus with the environment on it. These are the multipliers applied after that: durability from his injury record, the 72-hour news signal, the crowd (trending adds), the expert tilt (where 100+ ranked experts put him against our own rank, weighted by how much they agree), and draft capital for rookies with no sample. Each is capped so it nudges rather than decides.'],
 counter:['Counter offer','Built only when the offer on the table is not already a clear yes. What they need is read first from their own offer (the positions they asked for), then from their roster (empty or thin spots) and their rest-of-season lineup. A counter must fill at least one of those, be better for you than for them all-in, leave you no empty slot, and sit inside what they would accept given who asked, their desperation and the fit. Top three shown, one per player you would get.'],
 teamstats:['Team stats','This team against the league: projected points this week, rest-of-season power (best lineup by value, every remaining week), bench value, points for and against, each with the league average and the team\'s rank among the 12. Green bars are top four, red bottom four.'],
 tradecalc:['Trade calculator','Pick who you are trading with, who asked, and tick the players on each side. Roster value is the best starting nine by value plus 30% of the bench, for both teams before and after. The grade leans on your roster-value change, adds rest of season and this week, takes off for injury risk, for any position the trade leaves empty, and for what the other side gains weighted by how big a threat they are (roster strength, standing, and how many more times you play them). A trade that helps them more than you is never recommended, whatever else it does. "Would they accept" compares their loss against how much rope they have: the side that asked wants it more, and desperation adds rope - a losing record, a skid, hurt starters, thin positions (especially ones you are offering), frantic waiver activity, and anything they have said in the chat. High desperation with an easy yes means ask for more. The rope is deliberately short (asking earns 1.5 a week, desperation up to 2, fit 0.4 a point, 3 in total at most) and a trade they lose value on never reads above 85%: people judge the players in front of them, not the sum.'],
 tenure:['Coach tenure','Seasons with the team, his rank among the 32 (head coaches by win% with the team; coordinators by what their unit scored or allowed last full season), and a survival model: head coaches leave at about one in five a year, less with a winning record, playoff games and a long run, more with a losing record or a bad current season. Coordinators leave both ways - fired when the unit is bad, hired away when it is great. Expected seasons left is one over that yearly chance, capped at seven.'],
 wxtol:['Weather tolerance','His scoring in windy (15+ mph), wet and cold (35F or under) games against his calm-day average, using the real weather at every kickoff since 2024. When this week\'s forecast matches one of those, the weather adjustment uses his own rate, trusted in proportion to how many games back it up, instead of a one-size-fits-all cut for his position.'],
 alumni:['Alumni tracker','Every player in the pool grouped by the college he came from. A school\'s total is the sum of its players\' value per week, so it rewards schools that keep sending starters, not just bodies. Draft capital is the average of where its men were picked (100% = first overall).'],
 boom:['Boom or bust','How far each side can still land from its expected final. Each starter swings by an amount set by his position and projection, shrinking as his game runs out. Then the stacks: two of your players from the same offence rise and fall together, so your side swings wider than nine independent players would; one of yours against one of theirs from the same offence partly cancels. That true spread is what the win chance uses. A boom is 15+ points over expected, a bust 15+ under. Each starter\'s own rates come from his career game logs: a boom game is 20+ points, a bust game under 5.'],
 durability:['Injury history','How often he has actually missed games hurt over the last three seasons — counted from weeks on injured reserve plus weeks ruled out, divided by weeks he was on a roster. A backup who simply never plays is not counted as fragile. Shrunk toward a normal 90% when there is only a season or so to go on. It nudges his value by a few percent at most, because the projection sources already price in some fragility.'],
 stack:['Moves with','How much his weekly score rises and falls with a teammate\'s, from every game they played together since 2023 (a correlation from -1 to +1, shrunk toward zero when they have few games together). A quarterback and his top receiver usually sit around +0.26. Two running backs on the same team usually go negative — one\'s good day is the other\'s quiet one. Starting players who move together makes your week more boom-or-bust.'],
 qbeff:['With a backup quarterback','What he scored with his usual quarterback against a backup — same team, same season only, so a team change is never mistaken for a quarterback change. Shrunk toward no effect when there are only a few backup games. It only touches his projection when his usual quarterback is actually out this week.'],
 cuff:['Handcuffs','Who takes over if the starter goes down, and what that is worth. When the backup has actually played without that starter, it uses what he really scored in those games. When not, it estimates from the starter\'s value and the backup\'s place in line, and says so. Insurance value is the weekly chance the starter misses — from his own injury history — times the lift, and it is added to the backup\'s value.'],
 outweeks:['How long he is out','Two sources, and the app says which one it used. If a reporter has put a number on it — "expected to miss 4-6 weeks", "week to week", "out for the season" — that number wins, and it is marked reported. Otherwise it falls back to how that body part normally goes, marked typical, with a range because a knee can be a one-week sprain or a torn ACL. A designation sets a floor: on IR he cannot return for four games whatever the injury. The points figure is his value per week multiplied by the weeks he misses — what the injury actually costs, rather than just a label.'],
 rushv:['Pass rush','A per-game score for what a defender does to the quarterback: three points a sack, plus a bit for every quarterback hit and tackle for loss. It is not fantasy scoring — nobody in your league starts defenders — it is a way of ranking who actually wrecks a pocket, so you can see at a glance whether the guy your quarterback faces on Sunday is a problem or a name.'],
 coverv:['Coverage','A per-game score for a defensive back or linebacker in coverage: three points an interception, one a pass broken up. Thin on two weeks of data, so read it as a hint rather than a verdict.'],
 dmen:['Defenders out','How much of the opposing defence is unavailable this week, weighted by what each missing man is worth per game, then applied to the position it actually helps. A missing edge rusher shows up mostly for your quarterback; a missing corner mostly for your receivers. Capped at 8% and deliberately small, because two weeks of snaps is a thin base to reason from.'],
 livewin:['Live win chance','Who wins the actual NFL game, updated from the score and the clock. It starts at the betting line, then leans harder on the scoreboard as time runs out — a 7-point lead in the first quarter is worth far less than the same lead with four minutes left.'],
 winpct:['Win %','Your chance of winning this week. Every slot is treated as a range rather than a single number — a receiver can swing 20 points, a kicker maybe 6 — and we add those swings up. Players who finished are locked in, players mid-game count part way.'],
 slotwin:['Slot win %','Chance your player outscores theirs in that slot, given how much each can swing from here.'],
 capital:['Draft capital','Where he went in the NFL draft, on a 0–100 scale. It matters because teams play their expensive picks through bad games, and that opportunity is what fantasy points come from.'],
 share:['Share of his offense','In his last college season, the share of his team\'s yards and touchdowns he accounted for. One of the few college numbers that keeps predicting once players reach the NFL.'],
 mae:['MAE','Mean absolute error — the average miss, in fantasy points, between a projection and what actually happened. Lower is better. It is how sources earn or lose weight in the blend.'],
 bias:['Bias','Whether a source runs hot or cold. Positive means it projects more points than players actually score; negative means it under-projects.'],
 adjust:['Adjustments','Weather, his home/away record, this week\u2019s defence, altitude and the betting line, applied on top of the six projection sources. Each is capped, and the combined effect is damped to 60% and held inside \u00b118%, because the sources already price some of this in.'],
 urgency:['Urgency','0–100 on how soon a board item needs you. 85 and up is green — act now. 40 to 84 is yellow — this week. Under 40 is red — nothing to do yet, just noise to be aware of.'],
 scarcity:['Scarcity','How few comparable players are left on the wire. A multiplier above 1 means a rival grabbing this guy is a real loss because there is no equivalent behind him.'],
 implied:['Implied points','Vegas\'s expectation for a team\'s score, from the game total and the spread. More implied points means more touchdowns to go around.'],
 spread:['Spread and total','The betting line. The total is the combined points both teams are expected to score; the spread is the expected margin. Together they say how much scoring is on the table.'],
 depth:['Depth chart','Where he sits on his own team at his position, per Sleeper. 1 is the starter.'],
 bust:['Bust rate','How often he has finished under 5 points in a game. A high number means a boom-or-bust week-winner; a low number means a floor you can trust.']

// ---------------- COACH TENURE: how long he has been here, where he ranks, how long he lasts ----------------
// A simple yearly-survival model. Head coaches leave at roughly one in five a year league-wide; a
// winning record, playoff games and a long tenure pull that down, a losing one and a bad current
// season push it up. Expected seasons left = 1 / yearly chance of leaving, capped at ten.
function coachModel(d,t,role){
  const yr=num(d.nflSeason)||new Date().getFullYear();
  const since=num(t[role+'Since']);const tenure=since?Math.max(1,yr-since+1):null;
  const rec=/^(\d+)-(\d+)/.exec(t.hcRecord||'');const w=rec?+rec[1]:0,l=rec?+rec[2]:0,g=w+l;const wp=g?w/g:null;
  const po=/^(\d+)-(\d+)/.exec(t.hcPlayoffs||'');const pw=po?+po[1]:0,pg=po?(+po[1])+(+po[2]):0;
  const cur=(t.seasons||[]).find(x=>num(x.season)===yr)||{};const cg=num(cur.games)||0,cwp=cg?(num(cur.w)||0)/cg:null;
  const seasons=(t.seasons||[]).filter(x=>num(x.games)>0&&(!since||num(x.season)>=since));
  const gg=seasons.reduce((a,x)=>a+(num(x.games)||0),0);
  const ppg=gg?seasons.reduce((a,x)=>a+(num(x.ppg)||0)*(num(x.games)||0),0)/gg:null,pa=gg?seasons.reduce((a,x)=>a+(num(x.pa)||0)*(num(x.games)||0),0)/gg:null;
  let p,why=[];
  if(role==='hc'){
    if(g<10){p=0.12;why.push('first season with the team - almost nobody is fired in year one');}
    else{p=wp>=0.6?0.06:(wp>=0.5?0.14:(wp>=0.4?0.30:0.50));why.push('career '+w+'-'+l+' here ('+Math.round(wp*100)+'%)');}
    if(pg>0){p*=0.7;why.push('has coached '+pg+' playoff game'+(pg>1?'s':'')+(pw?', won '+pw:''));}
    if(tenure>=8&&wp>=0.55){p*=0.8;why.push('established: '+tenure+' seasons of winning');}
    if(cg>=4){if(cwp<=0.3){p*=1.6;why.push('this season is going badly ('+cur.w+'-'+cur.l+')');}else if(cwp>=0.65){p*=0.7;why.push('this season is going well ('+cur.w+'-'+cur.l+')');}}
  }else{
    // coordinators move on for two reasons: fired when the unit is bad, hired away when it is great
    p=0.30;const rk=role==='oc'?t.ocRank:t.dcRank;
    if(num(rk)!==null){if(rk<=8){p=0.42;why.push('unit ranks #'+rk+' - a head-coach candidate, likely hired away');}else if(rk>=25){p=0.48;why.push('unit ranks #'+rk+' - on the hot seat');}else why.push('unit ranks #'+rk+' - middle of the pack');}
    if(tenure>=4)p*=0.85;
  }

  else if(v==='team'){deep=true;const t=(d.power||[]).find(x=>String(x.team)===String(state.team))||{};
    trail=A('League',up('#league'))+sep+P((t.manager||'Team')+(t.name?' · '+t.name:''));}
  else if(v==='player'){deep=true;const nm=cleanName(state.player);const pl2=(d.players||[]).find(x=>String(x.name).toLowerCase()===String(nm).toLowerCase())||{};

    trail=A('NFL teams',up('#games'))+sep+P(t.name||state.nfl2);}

const DEEPV=['player','team','nfl','coach','matchup','college'];
let PREVHASH='',SCROLLMEM={};
function route(){
  NAV=true;
  const hsh=decodeURIComponent(location.hash||"#home").slice(1);
  const parts=hsh.split("/");
  const nv=parts[0]||"home";
  // where a player (or team, or coach) page was opened from, so its breadcrumb can go back there
  if(PREVHASH&&PREVHASH!=='#'+hsh){
    SCROLLMEM[PREVHASH]=window.scrollY;
    // a different kind of page is a real change of context; player -> player is just a swipe
    if(DEEPV.indexOf(nv)>=0&&state.view!==nv)state.backTo=PREVHASH;
  }
  state.view=nv;
  if(state.view==="team")state.team=parts[1];
  if(state.view==="player")state.player=parts.slice(1).join("/");
  if(state.view==="nfl")state.nfl2=parts[1];
  if(state.view==="college")state.college=parts.slice(1).join("/");
  if(state.view==="coach")state.coach=parts.slice(1).join("/");
  if(state.view==="matchup"){state.mwk=parts[1];state.midx=parts[2];}
  PREVHASH='#'+hsh;
  render();
}

// ---------------- COLLEGES: an alumni tracker ----------------
// Every player in the pool who has a college on file, grouped by school. "What a school produces"
// is read off the players themselves: how many, at which positions, how good (value per week),
// how they were drafted, and how athletic they tested.
function collegeRows(d){
  const by={};
  (d.players||[]).forEach(p=>{const c=p.college;const sch=c&&(c.school||c.collTeam);if(!sch)return;(by[sch]||(by[sch]=[])).push(p)});
  return Object.keys(by).map(k=>{const ps=by[k];const v=ps.map(p=>num(p.value)||0);const st=ps.filter(p=>(num(p.value)||0)>=6);
    const pos={};ps.forEach(p=>{pos[p.pos]=(pos[p.pos]||0)+1});
    const cap=ps.map(p=>num(p.college.capital)).filter(x=>x!==null);
    const rook=ps.filter(p=>num(p.college.expYears)!==null&&num(p.college.expYears)<=0).length;
    const mine=ps.filter(p=>num(p.owner)===5).length,owned=ps.filter(p=>num(p.owner)).length;
    return {school:k,players:ps.slice().sort((a,b)=>(num(b.value)||0)-(num(a.value)||0)),n:ps.length,total:v.reduce((a,b)=>a+b,0),avg:v.reduce((a,b)=>a+b,0)/ps.length,starters:st.length,pos:pos,
      cap:cap.length?cap.reduce((a,b)=>a+b,0)/cap.length:null,rookies:rook,mine:mine,owned:owned,top:ps.slice().sort((a,b)=>(num(b.value)||0)-(num(a.value)||0))[0]};});
}
function posMix(pos){return ['QB','RB','WR','TE','K','DST'].filter(k=>pos[k]).map(k=>pos[k]+' '+k).join(' · ');}
function renderColleges(d){
  const rows=collegeRows(d);if(!rows.length)return '<section><div class="empty">No college data yet.</div></section>';
  const sort=state.csort||'total';const f=state.cpos||'ALL';
  let list=rows.slice();if(f!=='ALL')list=list.filter(r=>r.pos[f]);
  const key={total:r=>r.total,n:r=>r.n,avg:r=>r.avg,starters:r=>r.starters,cap:r=>r.cap||0,rookies:r=>r.rookies}[sort]||(r=>r.total);
  list.sort((a,b)=>key(b)-key(a)||b.total-a.total);

  h+='<div class="opt" style="margin-top:8px">'+[['total','total value'],['starters','starters'],['n','head count'],['avg','value per man'],['cap','draft capital'],['rookies','rookies']].map(x=>'<button data-csort="'+x[0]+'" class="'+(sort===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div>';
  h+='<div class="opt">'+['ALL','QB','RB','WR','TE'].map(x=>'<button data-cpos="'+x+'" class="'+(f===x?'on':'')+'">'+(x==='ALL'?'every position':x)+'</button>').join('')+'</div>';
  const top=list.slice(0,12);
  h+=svgBars({labels:top.map(r=>r.school.replace(/ St\.$/,' St').slice(0,9)),series:[{vals:top.map(r=>Math.round(key(r)*10)/10),cls:'me'}],h:150})+'<div class="sub">top 12 by '+esc({total:'total value per week',n:'players in the pool',avg:'value per player',starters:'players worth starting (6+/wk)',cap:'average draft capital',rookies:'2026 rookies'}[sort]||sort)+'</div></section>';
  h+='<section><table><tr><th>School</th><th class="n" style="width:44px">Men</th><th class="n" style="width:48px">Start</th><th class="n" style="width:56px">Value</th></tr>'+list.slice(0,state.climit||40).map(r=>'<tr class="tap" data-college="'+esc(r.school)+'"><td style="white-space:normal"><b>'+esc(r.school)+'</b><small style="display:block;color:var(--mute)">'+posMix(r.pos)+' · best '+esc(r.top.name)+(r.mine?' · <b style="color:var(--good)">'+r.mine+' yours</b>':'')+'</small></td><td class="n">'+r.n+'</td><td class="n">'+r.starters+'</td><td class="n"><b>'+f1(r.total)+'</b></td></tr>').join('')+'</table>'
    +(list.length>(state.climit||40)?'<button class="more" id="cmore">Show more schools</button>':'')+'</section>';
  return h;

function renderCollege(d,name){
  const rows=collegeRows(d);const r=rows.find(x=>x.school===name)||rows.find(x=>x.school.toLowerCase()===String(name||'').toLowerCase());
  if(!r)return '<section><a class="back" href="#colleges">← Colleges</a><div class="empty">No players from '+esc(name)+' in this pool.</div></section>';
  const all=rows.slice().sort((a,b)=>b.total-a.total);const rank=all.indexOf(r)+1;
  const pr=(v,f)=>{const a=rows.map(f).filter(x=>num(x)!==null);return a.length?Math.round(100*a.filter(x=>x<v).length/a.length):0};
  let h='<section><a class="back" href="'+esc(state.backTo||'#colleges')+'">← Colleges</a><div style="margin-top:8px"><div style="font-size:19px;font-weight:700">'+esc(r.school)+'</div><div class="sub" style="white-space:normal">#'+rank+' of '+rows.length+' schools by total value in this pool · '+r.n+' players · '+posMix(r.pos)+'</div></div>';
  h+=kv([['Total value','<b>'+f1(r.total)+'</b>/wk'],['Per player',f1(r.avg)+'/wk'],['Worth starting',r.starters+' of '+r.n],['Rostered in the league',r.owned+' of '+r.n+(r.mine?' · <b style="color:var(--good)">'+r.mine+' on your team</b>':'')],['Average draft capital',r.cap!==null?Math.round(r.cap*100)+'%':'—'],['2026 rookies',String(r.rookies)]]);
  h+='</section>';
  // what kind of players: position mix and the value each position carries
  const posV={};r.players.forEach(p=>{posV[p.pos]=(posV[p.pos]||0)+(num(p.value)||0)});
  const pk=['QB','RB','WR','TE','K','DST'].filter(k=>r.pos[k]);
  h+='<section><h2>What '+esc(r.school)+' produces</h2>'+svgBars({labels:pk.map(k=>k+' ('+r.pos[k]+')'),series:[{vals:pk.map(k=>Math.round(posV[k]*10)/10),cls:'me'}],h:130})+'<div class="sub">value per week at each position (number of players in brackets)</div>'
    +'<div class="sub" style="white-space:normal">'+(function(){const best=pk.slice().sort((a,b)=>posV[b]-posV[a])[0];const share=Math.round(100*posV[best]/Math.max(0.01,r.total));return best?'A '+best+' school: '+share+'% of its value in this pool is at '+best+'.':''})()+'</div>';
  // athletic and draft profile against the other schools
  const m=(f)=>{const a=r.players.map(f).filter(x=>num(x)!==null&&x>0);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
  const forty=m(p=>num(p.college.forty)),wt=m(p=>num(p.college.weight)),age=m(p=>num(p.college.draftAge));
  const prof=[];if(forty)prof.push(['Average 40',forty.toFixed(2)+'s']);if(wt)prof.push(['Average weight',Math.round(wt)+' lb']);if(age)prof.push(['Average draft age',age.toFixed(1)]);
  if(r.cap!==null)prof.push(['Draft capital',Math.round(r.cap*100)+'% · '+pr(r.cap,x=>x.cap)+'th pct of schools']);
  if(prof.length)h+=kv(prof);
  h+='</section>';
  // the pipeline year by year

function teamStats(d,pw){

  const avg=key=>{const a=all.map(x=>num(x[key])).filter(x=>x!==null);return a.length?a.reduce((p,q)=>p+q,0)/a.length:null};
  const adds=x=>num(x.activity&&x.activity.adds)||0,drops=x=>num(x.activity&&x.activity.drops)||0;

  // every team on rest-of-season power, this one lit up
  const srt=all.slice().sort((a,b)=>(num(b.ros)||0)-(num(a.ros)||0));
  h+='<div class="sub" style="font-weight:600;margin-top:10px">Rest-of-season power, all '+N+' teams</div>'+svgBars({labels:srt.map(x=>String(x.manager||x.name).slice(0,7)),series:[{vals:srt.map(x=>num(x.ros)),cls:'me',clsAt:srt.map(x=>String(x.team)===String(pw.team)?'good':(isMine(x.name)?'warn':'them'))}],h:130,legend:[['good','this team'],['warn','you'],['them','the rest']]});
  const srt2=all.slice().sort((a,b)=>(num(b.pf)||0)-(num(a.pf)||0));
  if(num(pw.pf))h+='<div class="sub" style="font-weight:600;margin-top:10px">Points scored so far, all '+N+' teams</div>'+svgBars({labels:srt2.map(x=>String(x.manager||x.name).slice(0,7)),series:[{vals:srt2.map(x=>num(x.pf)),cls:'me',clsAt:srt2.map(x=>String(x.team)===String(pw.team)?'good':(isMine(x.name)?'warn':'them'))}],h:130});
  if(num(pw.desperation)!==null){const dh=(pw.desperationHist||[]);
    h+='<div class="sub" style="font-weight:600;margin-top:10px">Desperation · '+Math.round(pw.desperation)+'%'+(num(pw.desperationAvg)!==null?' <small class="sub">(running average '+Math.round(pw.desperationAvg)+'%)</small>':'')+'</div>'

    const R=tcEval(d2,mine,theirs,TC.give,TC.get,TC.asked);const k=b.dataset.tcrec;
    logEvent({kind:k==='idecl'?'declined-by-me':k,mgr:pt.manager||'',give:TC.give.join('+'),get:TC.get.join('+'),asked:TC.asked,gainMe:f1(R.gainMe),gainThem:f1(R.gainThem),desp:R.desperation,note:'wk'+(d2.week||'')});
    b.textContent='Recorded ✓';setTimeout(render,700)}));

  document.querySelectorAll("[data-college]").forEach(el=>el.addEventListener("click",e=>{if(e.target.closest('a'))return;location.hash="#college/"+encodeURIComponent(el.dataset.college)}));

  const cm=$("#cmore");if(cm)cm.addEventListener("click",()=>{state.climit=(state.climit||40)+40;render()});

  const fp=$("#f-pos"),fo=$("#f-owner"),fs=$("#f-sort"),fq=$("#f-q"),mo=$("#more");
  const save=()=>{try{localStorage.setItem("lhc_filters",JSON.stringify(state.filters))}catch(e){}};
  if(fp)fp.addEventListener("change",()=>{state.filters.pos=fp.value;state.limit=60;save();render()});

  if(fq)fq.addEventListener("input",()=>{state.filters.q=fq.value;state.limit=60;save();const keep=fq.selectionStart;render();const q2=$("#f-q");if(q2){q2.focus();try{q2.setSelectionRange(keep,keep)}catch(e){}}});
  if(mo)mo.addEventListener("click",()=>{state.limit=(state.limit||60)+60;render()});
  const gw=$("#gweek");if(gw)gw.addEventListener("change",()=>{state.gweek=gw.value;render()});

  const ns=$("#nflsel");if(ns)ns.addEventListener("change",()=>{if(ns.value)location.hash='#nfl/'+ns.value});
  const ifl=$("#ifilt");if(ifl)ifl.addEventListener("change",()=>{state.ifilt=ifl.value;render()});

  const nfl=$("#nfilt");if(nfl)nfl.addEventListener("change",()=>{state.nfilt=nfl.value;render()});
  const nq=$("#nq");if(nq)nq.addEventListener("input",()=>{state.nq=nq.value;const k=nq.selectionStart;render();const q2=$("#nq");if(q2){q2.focus();try{q2.setSelectionRange(k,k)}catch(e){}}});
  if(NAV){const back=SCROLLMEM[PREVHASH];
    if(back>0){RESTORING=1;window.scrollTo(0,back);RESTORING=0;SY=back;delete SCROLLMEM[PREVHASH];}
    else if(v!=="players"){RESTORING=1;window.scrollTo(0,0);RESTORING=0;SY=0}
    NAV=false}else{keepPlace(_sy)}

function flash(btn,cls,txt,ms){if(!btn)return;const old=btn.dataset.lbl||btn.textContent;btn.dataset.lbl=old;
  btn.classList.remove('sending','sent','failed');btn.classList.add(cls);if(txt)btn.textContent=txt;
  if(ms)setTimeout(()=>{btn.classList.remove(cls);btn.textContent=old},ms);}
// ---------------- EVENT LOG: things you record on the phone, relayed to the laptop ----------------
// Each event is kept here and posted to the command channel as "log|...". The laptop appends it to
// trade_log.csv; the engine then lists the ids it has, and anything not yet listed is re-sent on the
// next load, so a laptop that was asleep still gets it.
let TLOG=[];try{TLOG=JSON.parse(localStorage.getItem('lhc_tlog')||'[]')}catch(e){}
function saveTLOG(){try{localStorage.setItem('lhc_tlog',JSON.stringify(TLOG.slice(-300)))}catch(e){}}
function logEvent(ev){ev.id=ev.id||(Date.now().toString(36)+Math.random().toString(36).slice(2,6));ev.ts=ev.ts||new Date().toISOString();ev.sent=false;TLOG.push(ev);saveTLOG();flushTLOG();return ev}
function evLine(ev){const c=x=>String(x==null?'':x).replace(/[|"]/g,'').slice(0,80);return ['log',ev.id,c(ev.kind),c(ev.mgr),c(ev.give),c(ev.get),c(ev.asked),c(ev.gainMe),c(ev.gainThem),c(ev.desp),c(ev.note)].join('|')}
function flushTLOG(){if(!CMDKEY)return;const acked=new Set((D&&D.tradeLogIds)||[]);
  TLOG.filter(ev=>!acked.has(ev.id)&&(!ev.sent||(Date.now()-new Date(ev.sentAt||0).getTime())>600000)).slice(0,20).forEach(ev=>{
    fetch("https://ntfy.sh/"+CMDKEY,{method:"POST",body:evLine(ev)}).then(r=>{if(r.ok){ev.sent=true;ev.sentAt=new Date().toISOString();saveTLOG()}}).catch(()=>{})});}
function send(cmd,topic,btn){
  const m=$("#ctlmsg"); if(m)m.textContent="Sending…";
  flash(btn,'sending','Sending…');
  fetch("https://ntfy.sh/"+topic,{method:"POST",body:cmd}).then(r=>{
    if(m)m.textContent=r.ok?"Sent. The server replies to your phone in a few seconds.":"Couldn't send ("+r.status+").";
    flash(btn,r.ok?'sent':'failed',r.ok?'Sent ✓':'Failed',2600);
  }).catch(()=>{if(m)m.textContent="Couldn't send — no connection.";flash(btn,'failed','No connection',2600);});
}
// Server console: "sh|<pin hash>|<id>|<base64 command>" goes down the command channel; the listener runs it
// and answers on the phone channel with the title "console <id>", which this polls for (about 2.5 minutes max).
const PHONE_TOPIC="lethimcook-7k3q9v2m";
function b64utf8(s){return btoa(unescape(encodeURIComponent(s)))}
function runOnServer(){
  const ta=$("#shin"),msg=$("#shmsg"),out=$("#shout");if(!ta||!CMDKEY)return;
  const cmd=(ta.value||"").trim();if(!cmd){if(msg)msg.textContent="Type a command first.";return}
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);const sentAt=Math.floor(Date.now()/1000)-2;
  if(msg)msg.textContent="Sending…";if(out){out.style.display="block";out.textContent="$ "+cmd+"\n";}
  fetch("https://ntfy.sh/"+CMDKEY,{method:"POST",body:"sh|"+DEVPINH+"|"+id+"|"+b64utf8(cmd)}).then(r=>{
    if(!r.ok){if(msg)msg.textContent="Couldn't send ("+r.status+").";return}
    if(msg)msg.textContent="Sent — waiting for the server…";
    let tries=0;const poll=()=>{tries++;
      fetch("https://ntfy.sh/"+PHONE_TOPIC+"/json?poll=1&since="+sentAt).then(r=>r.text()).then(t=>{
        let hit=null;t.split("\n").forEach(ln=>{if(!ln.trim())return;try{const o=JSON.parse(ln);if(o.event==="message"&&o.title==="console "+id)hit=o}catch(e){}});
        if(hit){if(out)out.textContent="$ "+cmd+"\n"+hit.message;if(msg)msg.textContent="Done "+new Date(hit.time*1000).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+".";}
        else if(tries<50){if(msg)msg.textContent="Waiting for the server… ("+(tries*3)+"s)";setTimeout(poll,3000)}
        else if(msg)msg.textContent="No answer in 2.5 minutes. The listener may be restarting; try again in a minute.";
      }).catch(()=>{if(tries<50)setTimeout(poll,3000)});};
    setTimeout(poll,2500);
  }).catch(()=>{if(msg)msg.textContent="Couldn't send — no connection.";});
}
// The page is served by GitHub Pages, which rebuilds the site after every publish - usually a
// minute, sometimes ten when their queue is busy. The raw file on GitHub itself skips that build
// (it lags at most about five minutes), so fetch both and keep whichever is newer.
const RAW_URL=(location.hostname.indexOf('github.io')>=0&&D0RAW())||'';
function D0RAW(){const m=/^([^.]+)\.github\.io$/.exec(location.hostname);const seg=location.pathname.split('/').filter(x=>x);if(!m||!seg.length)return '';return 'https://raw.githubusercontent.com/'+m[1]+'/'+seg[0]+'/main/data.json'}
function fetchJ(u){return fetch(u,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()})}
function load(){
  const local=fetchJ("data.json?v="+Date.now());
  const raw=RAW_URL?fetchJ(RAW_URL+"?v="+Date.now()).catch(()=>null):Promise.resolve(null);
  Promise.all([local.catch(()=>null),raw]).then(([a,b])=>{
    const t=x=>x&&x.updatedIso?new Date(x.updatedIso).getTime():(x?0:-1);
    let d=a;if(b&&t(b)>t(a)){d=b;d.viaRaw=true}
    if(!d)throw 0;return d}).then(d=>{D=d;try{localStorage.setItem("lhc",JSON.stringify(d))}catch(e){}if(LIVE.stats&&LIVE.at&&(Date.now()-LIVE.at.getTime())<180000)applyLive();render();liveTick(true);try{flushTLOG()}catch(e){}})
  .catch(()=>{try{const c=localStorage.getItem("lhc");if(c&&!D){D=JSON.parse(c);render();$("#stamp").textContent+=" · offline copy"}else if(!D){$("#stamp").textContent="no data yet"}}catch(e){$("#stamp").textContent="no data yet"}});
}
(function(){const inp=document.getElementById('gs'),box=document.getElementById('gsr');if(!inp)return;
  inp.addEventListener('input',()=>{if(!D){box.innerHTML='';return}const hits=searchHits(inp.value);box.innerHTML=hits.map(x=>'<a class="hit" href="'+x.href+'">'+(x.t==='player'?face(x.sid,x.team,x.pos):(x.t==='nfl'?logo(x.team):'<div class="logo"></div>'))+'<div><div class="name">'+esc(x.label)+'</div><div class="sub">'+esc(x.sub)+'</div></div></a>').join('');box.style.display=hits.length?'block':'none';});
  box.addEventListener('click',()=>{box.style.display='none';inp.value='';});inp.addEventListener('blur',()=>setTimeout(()=>{box.style.display='none'},250));})();
(function(){const b=document.getElementById('aa');if(!b)return;let big=false;try{big=localStorage.getItem('lhc_big')==='1'}catch(e){}const ap=()=>{document.body.classList.toggle('big',big);b.setAttribute('aria-pressed',big?'true':'false');b.classList.toggle('on',big)};ap();b.addEventListener('click',()=>{big=!big;try{localStorage.setItem('lhc_big',big?'1':'0')}catch(e){}ap()});})();
(function(){const b=document.getElementById('show');if(!b)return;const ap=()=>{b.textContent=SHOW?'Show mode on':'Show mode';b.classList.toggle('on',SHOW);document.body.classList.toggle('show',SHOW)};ap();b.addEventListener('click',()=>{SHOW=!SHOW;try{localStorage.setItem('lhc_show',SHOW?'1':'0')}catch(e){}ap();render()});})();
document.getElementById('app').addEventListener('click',e=>{const gx=e.target.closest('[data-gl]');if(gx){e.preventDefault();e.stopPropagation();glShow(gx.dataset.gl);return}const el=e.target.closest('[data-nfl],[data-psid]');if(!el)return;if(el.dataset.psid){const p=(D&&D.players||[]).find(x=>String(x.sid)===String(el.dataset.psid));if(p){e.preventDefault();e.stopPropagation();location.hash='#player/'+encodeURIComponent(p.name);return}}if(el.dataset.nfl&&(D&&D.nflTeams||[]).some(t=>t.team===el.dataset.nfl)){e.preventDefault();e.stopPropagation();location.hash='#nfl/'+el.dataset.nfl}});
(function(){let sx=0,sy=0,st=0;const app=document.getElementById('app');
  app.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
  app.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;if(Date.now()-st>700||Math.abs(dx)<70||Math.abs(dy)>50)return;
    const dir=dx<0?1:-1;
    if(state.view==='player'){const ctx=state.ctx||[];const ci=ctx.findIndex(n=>String(n).toLowerCase()===cleanName(state.player).toLowerCase());const ni=ci+dir;if(ci>=0&&ni>=0&&ni<ctx.length)location.hash='#player/'+encodeURIComponent(ctx[ni]);}
    else if(state.view==='team'){const pw=(D.power||[]).slice().sort((a,b)=>(num(a.standing)||99)-(num(b.standing)||99));const i=pw.findIndex(x=>String(x.team)===String(state.team));const n=i+dir;if(i>=0&&n>=0&&n<pw.length)location.hash='#team/'+pw[n].team;}
    else if(state.view==='coach'){const ts=(D.nflTeams||[]);let role=null,i=-1;ts.forEach((t,k)=>{['hc','oc','dc'].forEach(r=>{if(String(t[r]).toLowerCase()===String(state.coach).toLowerCase()){role=r;i=k}})});const n=i+dir;if(role&&n>=0&&n<ts.length)location.hash='#coach/'+encodeURIComponent(ts[n][role]);}
    else if(state.view==='nfl'){const ts=(D.nflTeams||[]);const i=ts.findIndex(x=>x.team===String(state.nfl2).toUpperCase());const n=i+dir;if(i>=0&&n>=0&&n<ts.length)location.hash='#nfl/'+ts[n].team;}
    else if(state.view==='matchup'){const ps=weekPairs(D,state.mwk);const i=num(state.midx);const n=i+dir;if(i!==null&&n>=0&&n<ps.length)location.hash='#matchup/'+state.mwk+'/'+n;}
    // same order as the nav row, or swiping skips a tab
    else{const tabs=['home','matchups','league','players','games','injuries','news'];const i=tabs.indexOf(state.view);const n=i+dir;if(i>=0&&n>=0&&n<tabs.length)location.hash='#'+tabs[n];}
  },{passive:true});})();
window.addEventListener("hashchange",route);
route(); load();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
setInterval(load,5*60*1000);
})();
