<link rel="icon" href="icon.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#5d6673;--line:#e3e6ea;--acc:#1f6feb;--good:#1a8f4a;--bad:#c0392b;--warn:#b7791f;--live:#d64545;--chip:#eef1f5;--bar:#c9d3e0;--barme:#1f6feb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#e8ebef;--mute:#9aa4b1;--line:#262c35;--acc:#5b9cff;--good:#3ccf6f;--bad:#ff6b6b;--warn:#f0b849;--live:#ff5c5c;--chip:#232932;--bar:#2c3440;--barme:#5b9cff}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:12px 12px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;overflow-x:hidden}
table{table-layout:fixed}
td .sub{white-space:normal;overflow:visible}
td{overflow-wrap:anywhere}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px 12px}
h1{font-size:20px;margin:0;letter-spacing:.2px}
.stamp{color:var(--mute);font-size:12px;text-align:right}
.stamp.stale{color:var(--warn)}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:0 0 8px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.slot{width:40px;flex:0 0 40px;font-size:12px;color:var(--mute);font-weight:600}
.main{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.pts b{font-size:16px}
.pts small{display:block;font-size:11px;color:var(--mute)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--chip);color:var(--mute);margin-right:4px;vertical-align:1px}
.pill.live{background:var(--live);color:#fff}
.pill.final{background:var(--chip)}
.pill.warn{background:var(--warn);color:#111}
.pill.bad{background:var(--bad);color:#fff}
.flag{font-size:12px;color:var(--warn)}
.flag.bad{color:var(--bad)}
.flag.good{color:var(--good)}
.act{padding:10px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .when{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--acc)}
.act .when.now{color:var(--bad)}
.act .text{margin-top:2px}
.act .where{font-size:12px;color:var(--mute);margin-top:2px}
.empty{color:var(--mute);font-size:14px;padding:4px 0}
details summary{cursor:pointer;color:var(--mute);font-size:13px;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
.score{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:4px 0 10px}
.score .lbl{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .num{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bar{grid-column:1/3;height:8px;background:var(--bar);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--barme)}
.bar.them i{background:var(--mute)}
.vs{display:grid;grid-template-columns:40px 1fr auto 1fr;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.vs:first-of-type{border-top:0}
.vs .me,.vs .them{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .them{text-align:right}
.vs .edge{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;padding:1px 6px;border-radius:8px;background:var(--chip)}
.vs .edge.up{color:var(--good)}
.vs .edge.down{color:var(--bad)}
.vs small{display:block;color:var(--mute);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.win{color:var(--good);font-weight:700}.loss{color:var(--bad);font-weight:700}
footer{color:var(--mute);font-size:11px;text-align:center;margin-top:16px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ctl button{font:inherit;font-size:14px;font-weight:600;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;transition:background .12s,color .12s,transform .08s;-webkit-tap-highlight-color:transparent}
.ctl button:active{transform:scale(.96);background:var(--acc);color:#fff;border-color:var(--acc)}
.ctl button.sending{background:var(--warn);color:#fff;border-color:var(--warn)}
.ctl button.sent{background:var(--good);color:#fff;border-color:var(--good)}
.ctl button.failed{background:var(--bad);color:#fff;border-color:var(--bad)}
.ctl button:active{opacity:.7}
.ctl button.warn{color:var(--warn)}.ctl button.go{color:var(--acc)}
.ctlmsg{font-size:12px;color:var(--mute);margin-top:8px;min-height:16px}
.paused{color:var(--warn);font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.6px;padding:3px 10px;border-radius:9px;color:#fff;background:var(--good);vertical-align:1px}
.badge.off{background:var(--bad)}
.ctl button.stop{background:var(--bad);color:#fff;border-color:var(--bad)}
.ctl button.start{background:var(--good);color:#fff;border-color:var(--good)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:4px;vertical-align:0}
.dot.off{background:var(--bad)}
.logo{width:26px;height:26px;flex:0 0 26px;object-fit:contain;border-radius:6px;background:var(--chip)}
.mb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);margin-top:3px}
.mb i{display:block;height:5px;border-radius:3px;background:var(--barme)}
.mb i.them{background:var(--mute)}
.mb span{min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
.pair{grid-column:1/5;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 4px 46px}
.pair .t{height:5px;border-radius:3px;background:var(--bar);overflow:hidden}
.pair .t i{display:block;height:100%;background:var(--barme)}
.pair .t.r{direction:rtl}.pair .t.r i{background:var(--mute)}
.fbar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute)}
.fbar .t{flex:1;height:6px;border-radius:3px;background:var(--bar);overflow:hidden}.fbar .t i{display:block;height:100%;background:var(--barme)}
.fbar .t i.up{background:var(--good)}.fbar .t i.dn{background:var(--bad)}
.form{color:var(--mute)}.form.up{color:var(--good)}.form.dn{color:var(--bad)}

.stick{position:sticky;top:0;z-index:6;background:var(--bg);padding-top:4px;margin-bottom:10px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0;background:var(--bg);padding:0 0 4px}
.crumb{background:var(--bg);padding:2px 2px 8px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--acc);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.crumb .back{flex:0 0 auto;color:var(--acc);font-weight:700;text-decoration:none;font-size:16px}
.crumb .path{overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--acc)}
.crumb .sub{color:var(--acc);opacity:.75}
.crumb .sep{opacity:.5;margin:0 4px}
body.big .crumb{font-size:19px;padding:4px 2px 10px}
.nav a{text-align:center;font-size:13px;font-weight:600;padding:8px 4px;border-radius:9px;background:var(--chip);color:var(--mute);text-decoration:none}
.nav a.on{background:var(--acc);color:#fff}
a.pl{color:inherit;text-decoration:none;border-bottom:1px dotted var(--mute)}
a.back{color:var(--acc);text-decoration:none;font-size:13px;font-weight:600}
.tap,.tapp{cursor:pointer}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.filters select,.filters input{font:inherit;font-size:14px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--ink);width:100%;min-width:0}
.filters input{grid-column:1/3}
table.kv{margin-top:6px}table.kv td{white-space:normal}
button.more{font:inherit;font-weight:600;width:100%;margin-top:8px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--acc)}
details.g summary::before{content:none}details.g summary{padding:0}
.g summary .sub{display:block;white-space:normal!important;line-height:1.45}details.g summary > div{display:flex}
.slot{width:44px;flex:0 0 44px}
.ch rect.b{fill:var(--barme)}.ch rect.b.them{fill:var(--mute)}.ch rect.b.proj{fill:var(--barme);opacity:.35}.ch rect.b.me{fill:var(--barme)}
circle.d{fill:var(--mute);opacity:.7}circle.d.me{fill:var(--good);opacity:1}circle.d.fa{fill:var(--acc)}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--mute);vertical-align:-1px;margin-right:3px}.lg.me{background:var(--barme)}.lg.them{background:var(--mute)}.lg.proj{background:var(--barme);opacity:.35}.lg.fa{background:var(--acc)}
.name.mine,.sub.mine a{color:var(--good)}
path.ln{stroke:var(--barme)}path.ln.them{stroke:var(--mute)}path.ln.proj{stroke:var(--barme);opacity:.6}circle.pt{fill:var(--barme)}circle.pt.them{fill:var(--mute)}circle.pt.proj{fill:var(--barme);opacity:.6}
.ch rect.b.good{fill:var(--good)}.ch rect.b.bad{fill:var(--bad)}.lg.good{background:var(--good)}.lg.bad{background:var(--bad)}

/* Easy-read mode: bigger, bolder, higher contrast (keratoconus-friendly) */
body.big{font-size:22px;line-height:1.5;padding-left:8px;padding-right:8px}
body.big{--ink:#000;--mute:#1e242c;--line:#9aa3af;--bar:#9aa3af;--good:#0b6b31;--bad:#b0160e;--warn:#7a4d00;--acc:#0a4fc2;--barme:#0a4fc2;--card:#fff;--bg:#e9ecf0;--chip:#dfe4ea}
@media (prefers-color-scheme:dark){body.big{--ink:#fff;--mute:#e3e8ee;--line:#6b7583;--bar:#6b7583;--good:#5ce08a;--bad:#ff7b7b;--warn:#ffd166;--acc:#7fb2ff;--barme:#7fb2ff;--card:#0f1216;--bg:#000;--chip:#2a313b}}
body.big section{border-width:2px}body.big b,body.big .name{font-weight:800}
body.big h1{font-size:30px}body.big h2{font-size:17px;letter-spacing:.4px;color:var(--ink)}body.big .stamp{font-size:17px}
body.big .sub,body.big .flag,body.big .pill,body.big small,body.big .fbar,body.big .mb,body.big .act .where,body.big .act .when,body.big .vs small,body.big .sub *{font-size:19px!important}
body.big .name{font-size:22px}body.big .pts b{font-size:26px}body.big .vs{font-size:20px;grid-template-columns:50px 1fr auto 1fr}body.big .vs .edge{font-size:16px}
body.big table{font-size:20px}body.big th{font-size:16px;color:var(--ink)}body.big td,body.big th{padding:9px 5px}
body.big .row{padding:12px 0}body.big .slot{font-size:17px;width:58px;flex:0 0 58px;color:var(--ink)}
body.big .bar{height:14px}body.big .fbar .t,body.big .pair .t,body.big .mb i{height:11px}
body.big .pill{padding:3px 10px;border-radius:12px}body.big .logo{width:34px;height:34px;flex-basis:34px}
body.big .nav a{font-size:19px;padding:14px 4px;color:var(--ink)}body.big .nav a.on{color:#fff}body.big .ctl button,body.big .filters select,body.big .filters input,body.big button.more{font-size:18px;padding:14px 10px}
body.big svg text{font-size:15px!important;fill:var(--ink)!important}body.big svg{height:auto!important;min-height:190px}body.big path.ln{stroke-width:3.5}body.big circle.d{r:5.5}body.big circle.d.me{r:7}
body.big a.pl{border-bottom:2px solid var(--acc);font-weight:600}
body.big .flag{font-weight:700}body.big .score .lbl{font-size:16px;white-space:normal}

body.big .vs{grid-template-columns:58px 1fr auto;row-gap:4px}
body.big .vs .me,body.big .vs .them{white-space:normal;overflow:visible;text-overflow:clip;text-align:left}
body.big .vs .slot{grid-column:1;grid-row:1}body.big .vs .me{grid-column:2;grid-row:1}body.big .vs .them{grid-column:2;grid-row:2}body.big .vs .edge{grid-column:3;grid-row:1/3;align-self:center}body.big .pair{grid-row:3}
body.big .vs .them::before{content:"vs ";color:var(--mute);font-weight:400}
body.big .pair{grid-column:1/4;padding-left:58px}
body.big .name,body.big .sub,body.big .score .lbl{white-space:normal;overflow:visible;text-overflow:clip}
body.big .pill{white-space:nowrap}
body.big .pts{max-width:36%}body.big .main{min-width:0}
body.big .vs .pill{font-size:15px!important;padding:2px 7px}
.aa{font:inherit;font-size:13px;font-weight:700;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;margin-left:6px}
body.big .aa{background:var(--acc);color:#fff;border-color:var(--acc);font-size:18px;padding:6px 12px}

:root{--me:#1f6feb;--them:#6b7280;--proj:#9ec1ff;--fa:#7c3aed}
@media (prefers-color-scheme:dark){:root{--me:#5b9cff;--them:#9aa4b1;--proj:#3b5a8a;--fa:#b794f6}}
.ch rect.b{fill:var(--me)}.ch rect.b.them{fill:var(--them)}.ch rect.b.proj{fill:var(--proj);opacity:1}.ch rect.b.me{fill:var(--me)}.ch rect.b.warn{fill:var(--warn)}
circle.d{fill:var(--them);opacity:.75}circle.d.me{fill:var(--good);opacity:1}circle.d.fa{fill:var(--fa)}
.lg{background:var(--them)}.lg.me{background:var(--me)}.lg.them{background:var(--them)}.lg.proj{background:var(--proj);opacity:1}.lg.fa{background:var(--fa)}
path.ln{stroke:var(--me)}path.ln.them{stroke:var(--them)}path.ln.proj{stroke:var(--proj);opacity:1}circle.pt{fill:var(--me)}circle.pt.them{fill:var(--them)}circle.pt.proj{fill:var(--proj)}
polygon.rad{fill:var(--me);fill-opacity:.25;stroke:var(--me);stroke-width:2}polygon.rad.me{fill:var(--good);stroke:var(--good)}circle.radp{fill:var(--me)}
.nav{grid-template-columns:repeat(4,1fr);gap:3px}.nav a{font-size:12px;padding:8px 2px}
.search{position:relative;margin:0 0 10px}.search input{font:inherit;font-size:15px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.search #gsr{display:none;position:absolute;left:0;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.15);max-height:60vh;overflow:auto}
.hit{display:flex;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);text-decoration:none;color:inherit}.hit:first-child{border-top:0}

.hdrbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

body.big .nav{grid-template-columns:repeat(4,1fr)}body.big .nav a{font-size:18px}
body.big polygon.rad{stroke-width:3.5}

.vs .face{width:22px;height:22px;flex-basis:22px;vertical-align:middle;margin:0 3px}body.big .search input{font-size:19px;padding:12px}
.ch rect.b.them{fill:var(--them)}.ch rect.b.proj{fill:var(--proj)}.ch rect.b.good{fill:var(--good)}.ch rect.b.bad{fill:var(--bad)}.ch rect.b.warn{fill:var(--warn)}
.portal{cursor:pointer}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;overflow:auto;padding:14px 10px calc(30px + env(safe-area-inset-bottom))}
.modal-c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;max-width:640px;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal-c section{border:0;padding:8px 0 0;margin:0;background:transparent}

/* colour scheme forced from Settings (System is the default: the media queries above) */
:root[data-scheme=dark]{--bg:#0f1216;--card:#181c22;--ink:#e8ebef;--mute:#9aa4b1;--line:#262c35;--acc:#5b9cff;--good:#3ccf6f;--bad:#ff6b6b;--warn:#f0b849;--live:#ff5c5c;--chip:#232932;--bar:#2c3440;--barme:#5b9cff}
:root[data-scheme=light]{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#5d6673;--line:#e3e6ea;--acc:#1f6feb;--good:#1a8f4a;--bad:#c0392b;--warn:#b7791f;--live:#d64545;--chip:#eef1f5;--bar:#c9d3e0;--barme:#1f6feb}
:root[data-scheme=dark] body.big{--ink:#fff;--mute:#e3e8ee;--line:#6b7583;--bar:#6b7583;--good:#5ce08a;--bad:#ff7b7b;--warn:#ffd166;--acc:#7fb2ff;--barme:#7fb2ff;--card:#0f1216;--bg:#000;--chip:#2a313b}
:root[data-scheme=light] body.big{--ink:#000;--mute:#1e242c;--line:#9aa3af;--bar:#9aa3af;--good:#0b6b31;--bad:#b0160e;--warn:#7a4d00;--acc:#0a4fc2;--barme:#0a4fc2;--card:#fff;--bg:#e9ecf0;--chip:#dfe4ea}
:root[data-scheme=dark]{--me:#5b9cff;--them:#9aa4b1;--proj:#3b5a8a;--fa:#b794f6}
:root[data-scheme=light]{--me:#1f6feb;--them:#6b7280;--proj:#9ec1ff;--fa:#7c3aed}
.bar.them i{background:var(--them)}.mb i.them{background:var(--them)}
.vs .me{color:var(--me)}.vs .them{color:var(--them)}
/* the two sides get their own tinted columns so the split is obvious before you read a name */
.vs .me,.vs .them{align-self:stretch;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.25}
.vs{grid-template-columns:34px 1fr auto 1fr;gap:0 4px;padding:6px 6px;margin:0 -8px;border-top:0;border-radius:0}.vs .slot{width:34px;flex-basis:34px}.vs .edge{padding:1px 4px;position:relative;z-index:1}
/* no white between the sides: the whole row is painted, left half yours, right half theirs */
.vs{background:linear-gradient(90deg,var(--meT) 0 50%,var(--thT) 50% 100%)}
.vs .me,.vs .them{background:transparent;border-radius:0;padding:4px 4px 4px 6px}.vs .them{padding:4px 6px 4px 4px}
.vs .me{border-left:3px solid var(--me)}.vs .them{border-right:3px solid var(--them)}
.vs+.vs{border-top:2px solid var(--card)}
body{--meT:color-mix(in srgb,var(--me) 13%,var(--card));--thT:color-mix(in srgb,var(--them) 16%,var(--card))}
body.big{--meT:color-mix(in srgb,var(--me) 22%,var(--card));--thT:color-mix(in srgb,var(--them) 26%,var(--card))}
.split{background:linear-gradient(90deg,var(--meT) 0 50%,var(--thT) 50% 100%);border-radius:10px;margin:0 -6px;padding:0 6px}

<body>
<header><div><h1>Let Him Cook</h1><div class="hdrbtns"><button class="aa" id="aa" title="Easy-read mode: bigger text, higher contrast" aria-pressed="false">Aa</button><a class="aa" id="devbtn" href="#settings" title="Settings">⚙</a><button class="aa show" id="show" title="Hide the private stuff when showing others">Show mode</button></div></div><div class="stamp" id="stamp">loading…</div></header>
<div class="stick"><nav class="nav"><a href="#home" data-v="home">Home</a><a href="#matchups" data-v="matchups">Matchups</a><a href="#league" data-v="league">League</a><a href="#players" data-v="players">Players</a><a href="#games" data-v="games">Games</a><a href="#injuries" data-v="injuries">Injuries</a><a href="#news" data-v="news">News</a><a href="#tradecalc" data-v="tradecalc">Trade</a></nav><div class="crumb" id="crumb"></div></div>
<div class="search"><input id="gs" type="search" placeholder="Search players, teams, managers" autocomplete="off"><div id="gsr"></div></div>
<div id="app"><section><div class="empty">Waiting for the first refresh…</div></section></div>
<footer>Updates every 3 minutes from the server. Pull down to reload the page.</footer>
<script>
(function(){
const $=(s)=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>(v===null||v===""||v===undefined||isNaN(+v))?null:+v;
const f1=v=>{const n=num(v);return n===null?"":n.toFixed(1)};
const f2=v=>{const n=num(v);return n===null?"":n.toFixed(2)};
const pct=v=>{const n=num(v);return n===null?"":Math.round(n*(n<=1?100:1))+"%"};
const blank=v=>v===null||v===undefined||String(v).trim()==="";
let D=null, d_week=null, clockTimer=null;
let NAV=true,LASTSIG='',SY=0,USER_SCROLL=0,RESTORING=0;
window.addEventListener('scroll',()=>{if(!RESTORING){SY=window.scrollY;USER_SCROLL=Date.now()}},{passive:true});
function keepPlace(y){
  if(!(y>0))return;
  const t0=Date.now(),mark=USER_SCROLL;
  const tick=()=>{
    if(USER_SCROLL!==mark)return;                 // the user moved: leave them alone
    if(Math.abs(window.scrollY-y)>2){RESTORING=1;window.scrollTo(0,y);RESTORING=0}
    if(Date.now()-t0<1200)requestAnimationFrame(tick);
  };
  tick();
}
let SHOW=false;try{SHOW=localStorage.getItem('lhc_show')==='1'}catch(e){}
document.addEventListener('DOMContentLoaded',()=>{try{applyLook()}catch(e){}});
let CMDKEY='';try{CMDKEY=localStorage.getItem('lhc_cmd')||''}catch(e){}
const WXI={Indoors:'🏟️','Heavy wind':'💨','Rain likely':'🌧️',Cold:'🥶',Breezy:'🍃',Fine:'☀️'};const wxIcon=i=>WXI[i]||'';
function face(sid,team,pos){if(!sid)return logo(team);if(pos==='DST'||!/^\d+$/.test(String(sid)))return logo(team||sid);return '<img class="logo face portal" data-psid="'+esc(sid)+'" alt="" loading="lazy" src="https://sleepercdn.com/content/nfl/players/thumb/'+esc(sid)+'.jpg" onerror="this.onerror=null;this.src=\'https://a.espncdn.com/i/teamlogos/nfl/500/'+(LOGOFIX[String(team||'').toUpperCase()]||String(team||'').toLowerCase())+'.png\'">';}
function co(name){if(blank(name)||/^(TBD|vacant|-)$/i.test(name))return esc(name||'');return '<a class="pl" href="#coach/'+encodeURIComponent(name)+'">'+esc(name)+'</a>';}
function tn(name){ // a league team name, as a portal to that team's page
  if(blank(name))return '';
  const p=(D&&D.power||[]).find(x=>x.name===name)||(D&&D.teams||[]).find(x=>x.name===name);
  if(!p||p.team===undefined)return esc(name);
  return '<a class="pl'+(isMine(name)?' mine':'')+'" href="#team/'+esc(p.team)+'">'+esc(name)+'</a>';
}
function mg(manager,team){if(blank(manager))return '';const t=team!==undefined?team:((D&&D.teams||[]).find(x=>x.manager===manager)||{}).team;return t!==undefined?'<a class="pl" href="#team/'+esc(t)+'">'+esc(manager)+'</a>':esc(manager);}
function posChip(p){if(blank(p))return '';const k=String(p).toUpperCase().replace('DEF','DST');return '<span class="pos '+esc(k)+'">'+esc(k)+'</span>';}
function teamLink(name){const t=(D&&D.teams||[]).find(x=>x.name===name);return t?'<a class="pl" href="#team/'+t.team+'">'+esc(name)+'</a>':esc(name);}
const state={view:"home",team:null,player:null,filters:{pos:"ALL",owner:"ALL",sort:"value",q:""}};
try{const f=JSON.parse(localStorage.getItem("lhc_filters")||"null");if(f)Object.assign(state.filters,f)}catch(e){}

const LOGOFIX={JAC:"jax",WAS:"wsh",LA:"lar",OAK:"lv",SD:"lac",STL:"lar"};
function logo(team){team=String(team||"").toUpperCase();if(!team||team==="0")return '<div class="logo"></div>';const ab=LOGOFIX[team]||team.toLowerCase();return '<img class="logo portal" data-nfl="'+team+'" alt="" loading="lazy" src="https://a.espncdn.com/i/teamlogos/nfl/500/'+ab+'.png" onerror="this.style.visibility=\'hidden\'">';}
function gamePill(st){st=String(st||"");if(/progress/i.test(st))return '<span class="pill" style="background:var(--good);color:#fff">LIVE</span>';if(/final/i.test(st))return '<span class="pill" style="background:var(--bad);color:#fff">FINAL</span>';if(/bye/i.test(st))return '<span class="pill" style="background:var(--warn);color:#fff">BYE</span>';return '<span class="pill" style="background:var(--warn);color:#fff">PENDING</span>';}
function statusPill(st,kick){
  st=String(st||"");
  if(/progress/i.test(st))return '<span class="pill" style="background:var(--good);color:#fff">LIVE</span>';
  if(/final/i.test(st))return '<span class="pill" style="background:var(--bad);color:#fff">FINAL</span>';
  if(/bye/i.test(st))return '<span class="pill" style="background:var(--warn);color:#fff">BYE</span>';
  if(kick)return '<span class="pill" style="background:var(--warn);color:#fff">PENDING</span> <span class="pill">'+esc(kick)+'</span>';
  if(/upcoming/i.test(st))return '<span class="pill" style="background:var(--warn);color:#fff">PENDING</span>';
  return st?'<span class="pill">'+esc(st)+'</span>':"";
}
const cleanName=n=>String(n||"").replace(/\s+(Jr\.|Sr\.|III|II|IV)$/,"").trim();
// Wrap every player or league-team name inside a sentence in a portal. Longest names first so
// "James Cook III" is matched before "James Cook"; the text is escaped first, then linked.
let NAMERX=null,NAMERX_D=null;
function linkNames(text){
  const t=esc(text);if(!D)return t;
  if(NAMERX_D!==D){NAMERX_D=D;const names=[];
    (D.players||[]).forEach(p=>{if(p.name&&String(p.name).length>4)names.push({n:String(p.name),h:'#player/'+encodeURIComponent(cleanName(p.name))})});
    (D.teams||[]).forEach(t2=>{if(t2.name&&t2.team!==undefined&&String(t2.name).length>3)names.push({n:String(t2.name),h:'#team/'+t2.team})});
    names.sort((a,b)=>b.n.length-a.n.length);const byName={};names.forEach(x=>{byName[esc(x.n)]=x.h});
    NAMERX=names.length?{rx:new RegExp('('+names.map(x=>esc(x.n).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g'),by:byName}:null;}
  if(!NAMERX)return t;
  return t.replace(NAMERX.rx,m=>'<a class="pl" href="'+NAMERX.by[m]+'">'+m+'</a>');
}
function collegeLink(name){if(blank(name))return '';return '<a class="pl" href="#college/'+encodeURIComponent(name)+'">'+esc(name)+'</a>';}
function pl(name){if(blank(name))return "";return '<a class="pl" href="#player/'+encodeURIComponent(cleanName(name))+'">'+esc(name)+'</a>';}
function findPlayer(name){const c=cleanName(name).toLowerCase();return (D&&D.players||[]).find(p=>String(p.name).toLowerCase()===c)||null;}
function gradeColor(g){return /^A/.test(g)?'var(--good)':(/^B/.test(g)?'#2f8f5b':(/^C/.test(g)?'#b8860b':'var(--bad)'));}
function bar(v,mx,cls){const w=mx>0?Math.max(0,Math.min(100,100*(num(v)||0)/mx)):0;return '<div class="t"><i class="'+(cls||'')+'" style="width:'+w+'%"></i></div>';}
function fbar(label,v,mx,txt,cls){return '<div class="fbar"><span style="width:84px;flex:0 0 84px">'+esc(label)+'</span>'+bar(v,mx,cls)+'<span style="width:44px;flex:0 0 44px;text-align:right">'+esc(txt===undefined?f1(v):txt)+'</span></div>';}
function kv(rows){return '<table class="kv">'+rows.filter(r=>r&&!blank(r[1])).map(r=>'<tr><td style="color:var(--mute);width:46%">'+String(r[0])+'</td><td>'+r[1]+'</td></tr>').join("")+'</table>';}
function flags(p){
  const out=[];
  if(!blank(p.inj)&&!/healthy|^ok$|^-$/i.test(p.inj))out.push('<span class="flag'+(/^out|ir|season/i.test(p.inj)?' bad':'')+'">'+esc(p.inj)+'</span>');
  if(!blank(p.practice)&&!/full|^ok$/i.test(p.practice))out.push('<span class="flag">'+esc(p.practice)+'</span>');
  if(!blank(p.news)&&/out|risk|uncertain|role|trending/i.test(p.news))out.push('<span class="flag'+(/out|risk/i.test(p.news)?' bad':'')+'">'+esc(p.news)+'</span>');
  if(!blank(p.forecast)&&!/indoor|clear|fine|mild|^-$/i.test(p.forecast))out.push('<span class="flag">'+esc(p.forecast)+'</span>');
  return out.join(' · ');
}
function playerRow(p){
  const started=/progress|final/i.test(String(p.status||""));
  const live=num(p.live),proj=num(p.proj);
  let pts="";
  if(started&&live!==null)pts='<b>'+f1(live)+'</b><small>proj '+f1(proj)+'</small>';
  else if(proj!==null)pts='<b>'+f1(proj)+'</b><small>proj</small>';
  if(String(p.team)==="0")p.team="";
  let fl=flags(p);
  const nb=num(p.nextBye); if(nb!==null&&d_week!==null&&nb===d_week+1)fl=(fl?fl+' · ':'')+'<span class="flag">Bye next week</span>';
  let fb="";
  if(SHOW){const kick0=(p.kickoff&&String(p.game||"").indexOf(String(p.kickoff))<0)?p.kickoff:"";return '<div class="row"><div class="slot">'+esc(p.slot)+'</div>'+face(p.sid,p.team,p.pos)+'<div class="main"><div class="name">'+pl(p.player)+'</div><div class="sub">'+statusPill(p.status,kick0)+esc([p.pos,p.team,p.game].filter(x=>!blank(x)).join(' · '))+(p.forecast?' '+wxIcon(p.forecast):'')+(fl?'<br>'+fl:'')+'</div></div><div class="pts">'+pts+'</div></div>';}
  const nu=blank(p.nextUp)?p.fallback:p.nextUp, nsrc=blank(p.nextUp)?'Waiver':(p.nextSrc||''), nwk=blank(p.nextUp)?p.fbWk:p.nextWk;
  if(!blank(nu))fb+='Next up → <b>'+pl(nu)+'</b>'+(nsrc?' <span class="pill">'+esc(nsrc)+'</span>':'')+(num(nwk)!==null?' '+f1(nwk)+'/wk':'');
  if(num(p.cons)!==null&&num(p.nsrc)!==null&&p.nsrc>0){fb+=(fb?'<br>':'')+'consensus <b>'+f1(p.cons)+'</b> <small>('+Math.round(p.nsrc)+' source'+(p.nsrc==1?'':'s')+(num(p.spread)!==null&&p.spread>0?', spread '+f1(p.spread):'')+(blank(p.grade)?'':', experts <b style="color:'+gradeColor(p.grade)+'">'+esc(p.grade)+'</b>')+')</small>'+(num(p.spread)!==null&&p.spread>=6?' <span class="flag">sources split</span>':'');}
  if(num(p.buzz)!==null&&p.buzz<=-3)fb+='<br><span class="flag bad" style="font-weight:600">News: '+esc(p.headline||'negative buzz')+' ('+f1(p.buzz)+')</span>';
  if(num(p.value)!==null&&num(p.perWk)!==null&&Math.abs(p.value-p.perWk)>=0.05)fb+=(fb?' · ':'')+'value <b>'+f1(p.value)+'</b>/wk <small>(ROS '+f1(p.perWk)+' + form)</small>';
  if(!blank(p.verdict)&&!/^Hold$/.test(p.verdict))fb+='<br><span class="flag'+(/^Upgrade/.test(p.verdict)?' bad':'')+'" style="font-weight:600">'+esc(p.verdict)+'</span>';
  if(num(p.weekVsValue)!==null&&(p.weekVsValue>=1.25||p.weekVsValue<=0.7))fb+='<br><span class="flag'+(p.weekVsValue>=1.25?' good':'')+'">'+(p.weekVsValue>=1.25?'Big week projected ('+Math.round(p.weekVsValue*100)+'% of his usual) — hold through it':'Weak week projected ('+Math.round(p.weekVsValue*100)+'% of his usual)')+'</span>';
  if(num(p.next3)!==null&&(p.next3>=1.15||p.next3<=0.85))fb+=' · <span class="flag'+(p.next3>=1.15?' good':' bad')+'">next 3 defenses '+(p.next3>=1.15?'soft':'tough')+' ('+f1(p.next3)+'x)</span>';
  if(!blank(p.plan))fb+='<br><span class="flag'+(/IR|Out|drop/i.test(p.plan)?' bad':'')+'" style="font-weight:600">Plan: '+esc(p.plan)+'</span>';
  if(!blank(p.handcuff))fb+=(fb?' · ':'')+'handcuff <b>'+pl(p.handcuff)+'</b>'+(blank(p.hcStatus)?'':' <span class="'+(/^free/i.test(p.hcStatus)?'form up':'form dn')+'">'+esc(p.hcStatus)+'</span>');
  const kick=(p.kickoff&&String(p.game||"").indexOf(String(p.kickoff))<0)?p.kickoff:"";

// ---------------- CHARTS (inline SVG, bars + one scatter) ----------------
function svgBars(o){ // o: {labels:[], series:[{vals:[],cls:'',name:''}], line:{v,label}, h}
  const W=360,H=o.h||150,L=30,B=22,T=10,R=6;const n=o.labels.length;if(!n)return '';
  const all=[].concat.apply([],o.series.map(s=>s.vals.map(v=>num(v)||0))).concat(o.line?[num(o.line.v)||0]:[]);
  // negative values used to be clamped to zero, which drew an empty chart for anything that only
  // goes down (the adjustment percentages, for one). Keep a real zero line and let bars hang below it.
  const hi=Math.max.apply(null,all),lo=Math.min.apply(null,all);
  const mx=(hi>0?hi*1.08:0),mn=(lo<0?lo*1.08:0),span=(mx-mn)||1;
  const sc=v=>(H-B)-((H-B-T)*(((num(v)||0)-mn)/span));
  const gw=(W-L-R)/n,bw=Math.max(2,(gw-4)/o.series.length);
  let h='<svg class="ch" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:'+H+'px;display:block">';
  const gv=(mn<0&&mx>0)?[mn/1.08,0,mx/1.08]:(mn<0?[mn/1.08,mn/2/1.08,0]:[0,mx/1.08/2,mx/1.08]);
  // on a small range every gridline rounds to the same number and the labels sit on top of
  // each other, so show a decimal there and never print the same label twice
  const gfmt=v=>(Math.abs(mx-mn)<5?f1(v):String(Math.round(v)));let gprev=null;
  gv.forEach(val=>{const y=sc(val),lab=gfmt(val);
    h+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--line)" stroke-width="'+(val===0&&mn<0?1.5:1)+'"/>';
    if(lab!==gprev){h+='<text x="'+(L-4)+'" y="'+(y+4)+'" font-size="9" text-anchor="end" fill="var(--mute)">'+lab+'</text>';gprev=lab}});
  const z=sc(0);
  o.series.forEach((s,si)=>{s.vals.forEach((v,i)=>{if(num(v)===null)return;const x=L+i*gw+2+si*bw,y=sc(v);
    const top=Math.min(y,z),ht=Math.max(1,Math.abs(y-z));
    h+='<rect class="b '+(s.cls||'')+(s.clsAt&&s.clsAt[i]?' '+s.clsAt[i]:'')+'" x="'+x+'" y="'+top+'" width="'+bw+'" height="'+ht+'" rx="2"/>'})});
  if(o.line&&num(o.line.v)!==null){const y=sc(o.line.v);h+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="'+(W-R)+'" y="'+(y-3)+'" font-size="9" text-anchor="end" fill="var(--warn)">'+esc(o.line.label||'')+'</text>'}
  const wMax=Math.max.apply(null,o.labels.map(l=>String(l).length*5.6+6).concat([1])),stepB=Math.max(1,Math.ceil(wMax/Math.max(1,gw)));
  // when labels are too wide, shorten them before hiding any: every bar keeps a name while at
  // least four letters fit; only past that do we fall back to labelling every other bar
  const fitC=Math.floor((gw-4)/5.6),cut=(stepB>1&&fitC>=4);
  o.labels.forEach((l,i)=>{if(stepB>1&&!cut&&i%stepB)return;let t=String(l);if(cut&&t.length>fitC)t=t.slice(0,fitC-1)+'.';h+='<text x="'+(L+i*gw+gw/2)+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" fill="var(--mute)">'+esc(t)+'</text>'});
  h+='</svg>';
  if(o.legend)h+='<div class="sub" style="white-space:normal">'+o.legend.map(x=>'<span class="lg '+x[0]+'"></span>'+esc(x[1])).join(' &nbsp; ')+'</div>';
  return h;
}
function svgScatter(o){ // o:{pts:[{x,y,label,cls}], xl, yl, h}
  const W=360,H=o.h||220,L=34,B=26,T=12,R=10;const pts=o.pts.filter(p=>num(p.x)!==null&&num(p.y)!==null);if(!pts.length)return '';
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);const x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  const px=v=>L+((W-L-R)*((v-x0)/((x1-x0)||1))),py=v=>(H-B)-((H-B-T)*((v-y0)/((y1-y0)||1)));
  let h='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:'+H+'px;display:block">';
  h+='<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="var(--line)"/><line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="var(--line)"/>';
  h+='<text x="'+((W+L)/2)+'" y="'+(H-4)+'" font-size="10" text-anchor="middle" fill="var(--mute)">'+esc(o.xl||'')+'</text><text x="9" y="'+((H-B+T)/2)+'" font-size="10" text-anchor="middle" fill="var(--mute)" transform="rotate(-90 9 '+((H-B+T)/2)+')">'+esc(o.yl||'')+'</text>';
  h+='<text x="'+L+'" y="'+(H-B+10)+'" font-size="9" fill="var(--mute)">'+f1(x0)+'</text><text x="'+(W-R)+'" y="'+(H-B+10)+'" font-size="9" text-anchor="end" fill="var(--mute)">'+f1(x1)+'</text><text x="'+(L-3)+'" y="'+(T+4)+'" font-size="9" text-anchor="end" fill="var(--mute)">'+f1(y1)+'</text><text x="'+(L-3)+'" y="'+(H-B)+'" font-size="9" text-anchor="end" fill="var(--mute)">'+f1(y0)+'</text>';

    put.push(best.box);

  });
  h+='</svg>';return h;
}

// The offer window: a rival's man goes down and the first reasonable offer usually gets the
// conversation. Time-sensitive, so it sits at the top of Home rather than in the trades page.
function hurtPanel(d){
  const hr=(d.hurtRivals||[]).filter(x=>num(x.need)===null||num(x.need)>=30);if(!hr.length)return '';
  const tr=(d.trades||[]);
  return '<section style="border-left:4px solid var(--warn)"><h2>Offer window</h2>'
    +'<div class="sub" style="white-space:normal">Someone else\'s player just went down. Being first in usually gets the conversation, even if the deal takes days.</div>'
    +hr.map(x=>{const best=tr.filter(t=>t.partner===x.manager&&String(t.get||'').indexOf(x.player)<0).sort((a,b)=>(num(b.score)||0)-(num(a.score)||0))[0];
      const lk={trade:['In the market','var(--good)'],waiver:['Probably claims someone','var(--warn)'],bench:['Covered on their own bench','var(--mute)'],nothing:['Bench man — changes nothing','var(--mute)']}[x.likely]||['',''];
      return '<div class="row" style="padding:8px 0"><div class="main" style="white-space:normal">'
        +'<div class="name" style="white-space:normal;overflow:visible">'+mg(x.manager)+' lost '+pl(x.player)+' <span class="flag">'+esc(x.kw)+'</span></div>'
        +'<div class="sub" style="white-space:normal">'+esc(x.pos)+' · '+(String(x.slot)==='BN'||String(x.slot)==='IR'?'was on their bench':'was in their starting lineup')
        +' · <b style="color:'+lk[1]+'">'+esc(lk[0])+'</b>'+(num(x.need)!==null?' <span class="sub">('+Math.round(x.need)+'/100 need)</span>':'')+'</div>'
        +(x.needTxt?'<div class="sub" style="white-space:normal">'+esc(x.needTxt)+'</div>':'')
        +(best&&x.likely==='trade'?'<div class="sub" style="white-space:normal"><b>Offer now: give '+pl(best.give)+', get '+pl(best.get)+'</b></div>':'')
        +'</div></div>';}).join('')
    +'<div class="sub" style="white-space:normal;margin-top:4px">Their loss is the reason the window is open, not a reason to take a bad deal — the offer still has to be good for you.</div></section>';
}

// ---------------- LEAGUE MATCHUPS (every pairing, not just ours) ----------------
const LSLOTS=['QB','WR','WR','RB','RB','TE','W/R/T','K','DEF'];
function mgrOf(d,team){const p=(d.power||[]).find(x=>x.name===team);return p?p.manager:'';}
function enrichL(d,x){
  const p=(x.sid&&(d.players||[]).find(y=>String(y.sid)===String(x.sid)))||findPlayer(x.player)||{};
  const g=p.game||{};const st=String(g.status||'');
  const proj=num(p.proj)!==null?num(p.proj):(num(x.week)||0);
  const live=num(g.live);const nfl=x.nfl||p.team;
  const frac=g.opp?gameFrac(nfl,st):0;                  // no game (bye) means nothing left to score
  const started=live!==null&&!/upcoming/i.test(st);
  const exp=!g.opp?0:(started?live+proj*frac:proj);
  return {name:x.player,slot:x.slot,pos:x.pos==='DEF'?'DST':x.pos,nfl:nfl,sid:x.sid||p.sid,proj:proj,live:started?live:null,frac:frac,exp:exp,status:st,opp:g.opp,ha:g.ha,kick:g.kick,bye:!g.opp,inj:String((p.inj||{}).status||'')};
}
function sideL(d,team){
  const rows=(d.league||[]).filter(p=>p.teamName===team);
  const st=rows.filter(p=>!/^(BN|IR)/i.test(String(p.slot||'')));
  const used=new Set(),lineup=[];
  LSLOTS.forEach(sl=>{const i=st.findIndex((p,ix)=>!used.has(ix)&&String(p.slot)===sl);if(i>=0){used.add(i);lineup.push(enrichL(d,st[i]))}else lineup.push({slot:sl,empty:true,exp:0,proj:0,frac:0,live:null})});
  st.forEach((p,ix)=>{if(!used.has(ix))lineup.push(enrichL(d,p))});
  const bench=rows.filter(p=>/^BN/i.test(String(p.slot||''))).map(x=>enrichL(d,x));
  return {team:team,mgr:mgrOf(d,team),lineup:lineup,bench:bench};
}
function modelL(A,B){
  const sdr=r=>{if(r.empty)return 0;const b=SDPOS[r.pos]||6;const p=findPlayer(r.name);const sm=(p&&num(p.sdMult))||1;return b*Math.sqrt(Math.max(0.35,(r.proj||0)/12))*Math.sqrt(r.frac)*sm};
  const sum=(L,f)=>L.reduce((s,r)=>s+(f(r)||0),0);
  const ea=sum(A.lineup,r=>r.exp),eb=sum(B.lineup,r=>r.exp),na=sum(A.lineup,r=>r.live),nb=sum(B.lineup,r=>r.live);
  const va=sum(A.lineup,r=>sdr(r)*sdr(r)),vb=sum(B.lineup,r=>sdr(r)*sdr(r));
  const cov=stackCov(A.lineup.filter(r=>!r.empty).map(r=>({name:r.name,sd:sdr(r)})),B.lineup.filter(r=>!r.empty).map(r=>({name:r.name,sd:sdr(r)})));
  const sd=Math.sqrt(Math.max(0.01,va+cov.cm+vb+cov.ct-2*cov.cx));
  const win=sd<0.01?(ea>eb?100:(ea<eb?0:50)):Math.round(100*phi((ea-eb)/sd));
  const n=Math.max(A.lineup.length,B.lineup.length),rows=[];
  for(let i=0;i<n;i++){const a=A.lineup[i]||{empty:true,exp:0},b=B.lineup[i]||{empty:true,exp:0};
    const s2=Math.sqrt(sdr(a)*sdr(a)+sdr(b)*sdr(b));
    rows.push({slot:(a.slot||b.slot),a:a,b:b,gap:(a.exp||0)-(b.exp||0),sw:s2<0.01?((a.exp||0)>(b.exp||0)?100:((a.exp||0)<(b.exp||0)?0:50)):Math.round(100*phi(((a.exp||0)-(b.exp||0))/s2))});}
  return {ea:ea,eb:eb,na:na,nb:nb,win:win,sd:sd,rows:rows,live:(na>0||nb>0),va:va,vb:vb,cov:cov,minsA:sum(A.lineup,r=>r.empty?0:r.frac*60),minsB:sum(B.lineup,r=>r.empty?0:r.frac*60),
    benchA:sum(A.bench,r=>r.live!==null?r.live:0),benchB:sum(B.bench,r=>r.live!==null?r.live:0)};
}

// ---------------- GAME CHARTS & HISTORY ----------------
function histChips(rows){return '<div class="hist">'+(rows||[]).slice().reverse().map(x=>'<i class="'+esc(x.result)+'">'+esc(x.result)+' '+Math.round(x.pts)+'-'+Math.round(x.pa)+' '+(x.ha==='Home'?'v ':'@ ')+tl(x.opp)+'</i>').join('')+'</div>';}
function liveWin(g){
  const L=nflWin(g);if(!L||L.winHome===null||L.winHome===undefined)return '';
  const wh=Math.round(L.winHome),wa=100-wh;
  const A=String(g.away||''),Hm=String(g.home||'');
  const when=L.state==='post'?'final':(L.state==='in'?(esc(L.detail||('Q'+L.period))+' · '+Math.round(L.minsLeft)+' min left'):'before kickoff, from the line');
  const sc=L.state==='in'||L.state==='post'?' · '+esc(A)+' '+Math.round(L.awayScore)+'–'+Math.round(L.homeScore)+' '+esc(Hm):'';
  const row=(nm,pct,lead)=>'<div class="wrow'+(lead?' lead':'')+'"><span class="nm">'+esc(nm)+'</span><div class="tr"><i style="width:'+pct+'%"></i></div><span class="pc">'+pct+'%</span></div>';
  return '<div style="margin-top:6px">'+row(A,wa,wa>=wh)+row(Hm,wh,wh>wa)+'</div>'
    +'<div class="sub" style="white-space:normal">'+gl('livewin','Live win chance')+' · '+when+sc+'</div>';
}
// ---------------- WHAT ACTUALLY HAPPENED (games already played) ----------------
function gameWeek(g){
  if(num(g.week)!==null)return num(g.week);
  const hl=((g.hist||{}).homeLast||[])[0];   // the engine puts the most recent game first
  if(hl&&String(hl.opp||'').toUpperCase()===String(g.away||'').toUpperCase())return num(hl.week);
  return num(D&&D.week);
}
function gameScore(g){
  // the engine's score comes from nflverse, which lags a day or two; the phone's scoreboard is live
  let a=num(g.awayScore),hh=num(g.homeScore),done=/final/i.test(g.status||'');
  const L=NFLG.by[String(g.home||'').toUpperCase()];
  if(L&&L.home===String(g.home||'').toUpperCase()&&(L.state==='in'||L.state==='post')){
    if(num(L.awayScore)!==null)a=num(L.awayScore);
    if(num(L.homeScore)!==null)hh=num(L.homeScore);
    done=(L.state==='post');
  }
  return {a:a,h:hh,done:done,has:(a!==null&&hh!==null)};
}
function logLine(l){
  const b=[],G=k=>num(l[k])||0;
  if('pa' in l){        // team defense: a different box score entirely
    if(G('sack'))b.push(G('sack')+' sack'+(G('sack')===1?'':'s'));
    if(G('dint'))b.push(G('dint')+' INT');
    if(G('fr'))b.push(G('fr')+' fumble'+(G('fr')===1?'':'s')+' recovered');
    if(G('dtd'))b.push(G('dtd')+' TD');
    if(G('sfty'))b.push(G('sfty')+' safety');
    if(G('blk'))b.push(G('blk')+' blocked kick');
    b.push(Math.round(G('pa'))+' allowed');
    return b.join(' · ');
  }
  if(G('fga')||G('pat'))b.push(G('fgm')+' of '+G('fga')+' FG'+(G('pat')?', '+G('pat')+' PAT':''));
  if(G('payd'))b.push(Math.round(G('payd'))+' pass yd');
  if(G('car'))b.push(G('car')+' car, '+Math.round(G('ruyd'))+' yd');
  if(G('rec')||G('tgt'))b.push(G('rec')+' of '+G('tgt')+', '+Math.round(G('reyd'))+' yd');
  if(G('td'))b.push(G('td')+' TD');
  if(num(l.snap)>0)b.push(Math.round(100*num(l.snap))+'% of snaps');
  return b.join(' · ');
}
function rawLine(sid){
  const s=(LIVE.stats||{})[sid];if(!s)return '';const G=k=>num(s[k])||0,b=[];
  if(G('pass_yd'))b.push(Math.round(G('pass_yd'))+' pass yd'+(G('pass_td')?', '+G('pass_td')+' TD':''));
  if(G('rush_att'))b.push(G('rush_att')+' car, '+Math.round(G('rush_yd'))+' yd'+(G('rush_td')?', '+G('rush_td')+' TD':''));
  if(G('rec'))b.push(G('rec')+' of '+(G('rec_tgt')||G('rec'))+', '+Math.round(G('rec_yd'))+' yd'+(G('rec_td')?', '+G('rec_td')+' TD':''));
  return b.join(' · ');
}
function shortName(n){const w=cleanName(n).split(/\s+/);if(w.length>2&&/^(St\.|Van|De|Mc|La)$/i.test(w[w.length-2]))return w.slice(-2).join(' ');return w[w.length-1]||n;}
function boxRows(g){
  const A=String(g.away||'').toUpperCase(),Hm=String(g.home||'').toUpperCase(),wk=gameWeek(g);
  const out=[];
  (D.players||[]).forEach(p=>{
    const t=String(p.team||'').toUpperCase();if(t!==A&&t!==Hm)return;
    const opp=(t===Hm)?A:Hm;
    let pts=null,line='';
    const lg=(p.log||[]).filter(l=>String(l.opp||'').toUpperCase()===opp&&(wk===null||num(l.week)===wk));
    if(lg.length){const l=lg[lg.length-1];pts=num(l.ppr);line=logLine(l);
      // a 0 from before the kicking/defense fix is missing data, not a blank game; a row that
      // carries the fields is real, even when the number is 0
      if(pts===0&&p.pos==='K'&&!('fga' in l)&&!('pat' in l)){pts=null;line='';}
      if(pts===0&&(p.pos==='DST'||p.pos==='DEF')&&!('pa' in l)){pts=null;line='';}}
    if(pts===null&&p.game&&String(p.game.opp||'').toUpperCase()===opp&&num(p.game.live)!==null){pts=num(p.game.live);line=rawLine(p.sid);}
    if(pts===null)return;

  });

}
function finalBlock(g){

    const mx=Math.max(S.a,S.h,1);

    h+='<div class="sub" style="font-weight:600;margin-top:10px">'+(S.done?'Final score':'Score so far')+'</div>'+srow(A,S.a,S.a>S.h)+srow(Hm,S.h,S.h>S.a);
    const ia=num(g.impliedAway),ih=num(g.impliedHome),tot=num(g.total),spr=num(g.spread);
    if(S.done&&(ia!==null||ih!==null)){
      h+='<div class="sub" style="font-weight:600;margin-top:10px">Expected vs actual — '+gl('implied','implied points')+'</div>'
        +svgBars({labels:[A,Hm],series:[{vals:[ia,ih],cls:'proj'},{vals:[S.a,S.h],cls:'me',clsAt:[(ia===null?'':(S.a>=ia?'good':'bad')),(ih===null?'':(S.h>=ih?'good':'bad'))]}],h:120,legend:[['proj','the book expected'],['good','scored more'],['bad','scored less']]});
      const bits=[];
      if(ia!==null)bits.push(esc(A)+' '+(S.a>=ia?'beat':'missed')+' its '+f1(ia)+' by '+f1(Math.abs(S.a-ia)));
      if(ih!==null)bits.push(esc(Hm)+' '+(S.h>=ih?'beat':'missed')+' its '+f1(ih)+' by '+f1(Math.abs(S.h-ih)));
      if(tot!==null){const act=S.a+S.h;bits.push('the game went '+(act>=tot?'over':'under')+' '+f1(tot)+' by '+f1(Math.abs(act-tot)));}
      if(spr!==null&&S.done){const marg=S.h-S.a,cov=marg-spr;
        bits.push(esc(spr>=0?Hm:A)+' '+(spr===0?'was level':'was favoured by '+f1(Math.abs(spr)))+' and '+(Math.abs(cov)<0.01?'landed on the number':((cov>0)===(spr>=0)?'covered':'did not cover')+' by '+f1(Math.abs(cov))));}
      if(bits.length)h+='<div class="sub" style="white-space:normal">'+bits.join(' · ')+'.</div>';
    }
  }
  const rows=boxRows(g);
  if(rows.length){
    const top=rows.slice(0,10),mxp=Math.max.apply(null,top.map(r=>Math.abs(r.pts)).concat([1]));

      +top.map(r=>'<div class="frow'+(r.mine?' mine':'')+'"><div class="ft"><span class="fn pl" data-psid="'+esc(r.sid||'')+'">'+esc(r.name)+'</span><span class="fp">'+f1(r.pts)+'</span></div>'
        +'<div class="tr"><i class="'+(r.pts<0?'neg':'')+'" style="width:'+Math.round(100*Math.abs(r.pts)/mxp)+'%"></i></div>'
        +'<div class="sub bline">'+esc(r.pos)+' '+esc(r.team)+(r.line?' · '+esc(r.line):'')+' · '+(r.mine?'<b style="color:var(--good)">yours</b>':(r.owner?tn(r.owner):'free agent'))+'</div></div>').join('')
      +'<div class="sub" style="white-space:normal">Everyone the app tracks who played in this game, best first. Green is yours.</div>';
    const sw=rows.filter(r=>r.proj!==null&&r.proj>3).map(r=>Object.assign({},r,{diff:r.pts-r.proj})).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff)).slice(0,6);
    if(sw.length>2){
      const o=sw.slice().sort((a,b)=>b.diff-a.diff);
      h+='<div class="sub" style="font-weight:600;margin-top:12px">How '+gl('week','our projection')+' did</div>'
        +svgBars({labels:o.map(r=>shortName(r.name)),series:[{vals:o.map(r=>r.proj),cls:'proj'},{vals:o.map(r=>Math.max(0,r.pts)),cls:'me',clsAt:o.map(r=>r.diff>0?'good':'bad')}],h:130,legend:[['proj','we projected'],['good','he beat it'],['bad','he missed it']]})
        +'<div class="sub" style="white-space:normal">'+o.map(r=>esc(r.name)+' '+(r.diff>0?'+':'')+f1(r.diff)).join(' · ')+'. This is the same projection the app used before kickoff, so it is scoring itself.</div>';
    }
  } else if(S.has&&S.done){

}
function gameCharts(g){

function nflWin(g){

  const frac=Math.max(0,Math.min(1,L.minsLeft/60));
  const O2=g.odds||{};const sprNow=num(O2.spread)!==null?num(O2.spread):(blank(g.spread)?null:num(g.spread));const pre=sprNow===null?0:-1*sprNow;          // spread is home-relative; negative means home favoured

// ---------------- BOOM OR BUST: players who move together ----------------
// Two of your starters from the same offence rise and fall together, so your week swings wider
// than nine independent players would. One of yours against one of theirs from the same offence

function mateR(a,b){
  if(!a||!b)return 0;const pa=findPlayer(a),pb=findPlayer(b);
  const look=(p,n)=>((p&&p.mates)||[]).find(m=>cleanName(m.name).toLowerCase()===cleanName(n).toLowerCase());
  const m=look(pa,b)||look(pb,a);return m?(num(m.r)||0):0;

function stackCov(mine,theirs){      // mine/theirs: [{name, sd}] with sd already scaled for time left
  let cm=0,ct=0,cx=0;const st=[];
  for(let i=0;i<mine.length;i++)for(let j=i+1;j<mine.length;j++){const r=mateR(mine[i].name,mine[j].name);if(r){cm+=2*r*mine[i].sd*mine[j].sd;st.push({a:mine[i].name,b:mine[j].name,r:r,side:'mine'})}}
  for(let i=0;i<theirs.length;i++)for(let j=i+1;j<theirs.length;j++){const r=mateR(theirs[i].name,theirs[j].name);if(r){ct+=2*r*theirs[i].sd*theirs[j].sd;st.push({a:theirs[i].name,b:theirs[j].name,r:r,side:'theirs'})}}
  for(let i=0;i<mine.length;i++)for(let j=0;j<theirs.length;j++){const r=mateR(mine[i].name,theirs[j].name);if(r){cx+=r*mine[i].sd*theirs[j].sd;st.push({a:mine[i].name,b:theirs[j].name,r:r,side:'cross'})}}

}
function boomBust(M,labA,labB){

  const sdB=Math.sqrt(Math.max(0.01,M.vB+M.cov.ct));

    if(num(sp.all)){const rows=[['Home',sp.home],['Away',sp.away],['Good wx',sp.all],['Bad wx',sp.badWx]].filter(r=>num(r[1]));h+=svgBars({labels:rows.map(r=>r[0]),series:[{vals:rows.map(r=>r[1]),cls:'me'}],h:110});}
    if(inL.length)h+='<div class="sub" style="margin-top:6px;white-space:normal"><b>In our league:</b> '+inL.map(p=>pl(p.name)+' <small>'+esc(p.pos)+' · '+(isMine(p.ownerName)?'YOU':tn(p.ownerName))+'</small>').join(' · ')+'</div>';
  }
  return h;
}
function renderNfl(d,abbr){
  const t=(d.nflTeams||[]).find(x=>x.team===String(abbr).toUpperCase());if(!t)return '<section><a class="back" href="javascript:history.back()">← Back</a><div class="empty">No data for '+esc(abbr)+'.</div></section>';
  const sp=t.splits||{};const inL=(d.players||[]).filter(p=>p.team===t.team&&num(p.owner)).sort((a,b)=>(num(b.value)||0)-(num(a.value)||0));
  const fa=(d.players||[]).filter(p=>p.team===t.team&&!num(p.owner)&&(num(p.value)||0)>3).sort((a,b)=>(num(b.value)||0)-(num(a.value)||0)).slice(0,6);
  let h='<section><a class="back" href="javascript:history.back()">← Back</a><div style="display:flex;gap:10px;align-items:center;margin-top:8px">'+logo(t.team).replace('class="logo"','class="logo" style="width:56px;height:56px;flex-basis:56px"')+'<div><div style="font-size:19px;font-weight:700">'+esc(t.name)+'</div><div class="sub" style="white-space:normal">'+(num(t.wins)!==null?Math.round(t.wins)+'-'+Math.round(t.losses)+' since 2024 · ':'')+'this week '+esc(t.thisWeek)+(t.bye?' · bye wk '+t.bye:'')+(num(t.altitude)?' · ⛰️ '+Math.round(t.altitude).toLocaleString()+' ft':'')+'</div></div></div></section>';
  h+='<section><h2>Coaches</h2>'+kv([['Head coach','<b>'+co(t.hc)+'</b> <small>since '+esc(t.hcSince)+(t.hcRecord&&t.hcRecord!=='0-0'?' · '+esc(t.hcRecord)+(t.hcPlayoffs&&t.hcPlayoffs!=='0-0'?' · playoffs '+esc(t.hcPlayoffs):''):' · first year with the team')+'</small>'],['Offensive coordinator','<b>'+co(t.oc)+'</b> <small>since '+esc(t.ocSince)+'</small>'+(num(sp.all)?'<br><span class="sub">offense: '+f1(sp.all)+' ppg · home '+f1(sp.home)+' / away '+f1(sp.away)+(num(sp.badN)>=3?' · bad weather '+f1(sp.badWx):'')+'</span>':'')],['Defensive coordinator','<b>'+co(t.dc)+'</b> <small>since '+esc(t.dcSince)+'</small>'+(num(t.pa)?'<br><span class="sub">defense: '+f1(t.pa)+' allowed · home '+f1(t.paHome)+' / away '+f1(t.paAway)+'</span>':'')]])+'<div class="sub" style="white-space:normal;margin-top:4px">Records and scoring are the team\'s 2024–26 numbers; a coordinator hired since then only owns the part of that he has coached.</div></section>';
  const hc=(t.hcRecord||'').split('-');
  if(hc.length===2&&(+hc[0]+ +hc[1])>0)h+='<section><h2>'+esc(t.hc)+' with the '+esc(t.name.split(' ').pop())+'</h2>'+svgBars({labels:['Wins','Losses','Playoff W','Playoff L'],series:[{vals:[+hc[0],+hc[1],+((t.hcPlayoffs||'0-0').split('-')[0]),+((t.hcPlayoffs||'0-0').split('-')[1])],cls:'me',clsAt:['good','bad','good','bad']}],h:120})+'</section>';
  if(num(sp.all)||num(t.pa)){const rows=[['Scored',sp.all],['Allowed',t.pa],['Scored home',sp.home],['Scored away',sp.away],['Allowed home',t.paHome],['Allowed away',t.paAway]].filter(r=>num(r[1]));
    h+='<section><h2>Offense vs defense · 2024–26</h2>'+svgBars({labels:rows.map(r=>r[0]),series:[{vals:rows.map(r=>r[1]),cls:'me',clsAt:rows.map(r=>/Allowed/.test(r[0])?'them':'')}],h:130})+'</section>';}
  const da=t.defAllowed||{},pa=t.posAvg||{};const poss=['QB','RB','WR','TE'].filter(k=>num(da[k])!==null);
  if(poss.length)h+='<section><h2>Fantasy points allowed by position · 2025</h2>'+svgBars({labels:poss,series:[{vals:poss.map(k=>da[k]),cls:'me',clsAt:poss.map(k=>da[k]>pa[k]*1.1?'good':(da[k]<pa[k]*0.9?'bad':''))},{vals:poss.map(k=>pa[k]),cls:'them'}],h:130,legend:[['me','this defense allows'],['them','league average'],['good','soft spot — start your guys'],['bad','tough — think twice']]})+'<div class="sub" style="white-space:normal">This is what the Next-3 index on every player card is built from.</div></section>';
  const sc=(t.sched||[]);
  if(sc.length)h+='<section><h2>Schedule</h2><table><tr><th style="width:30px">Wk</th><th>Opponent</th><th></th><th class="n">Result</th></tr>'+sc.map(x=>{const fin=/final/i.test(x.status)&&x.pts!=='';const w=fin&&(+x.pts>+x.oppPts);return '<tr'+(String(x.week)===String(d.week)?' style="font-weight:700"':'')+'><td>'+x.week+'</td><td>'+(x.opp==='bye'?'<span class="sub">bye</span>':(x.ha==='Home'?'v ':'@ ')+tl(x.opp))+'</td><td>'+(x.opp==='bye'?'':gamePill(x.status)+' <span class="sub">'+esc(x.kick)+'</span>')+'</td><td class="n '+(fin?(w?'win':'loss'):'')+'">'+(fin?esc(x.pts)+'–'+esc(x.oppPts):'')+'</td></tr>'}).join('')+'</table></section>';
  if(inL.length){state.ctx=inL.concat(fa).map(p=>p.name);state.ctxName=t.name;}
  h+=defUnit(t.defense,'Defence','Who does the damage on this side of the ball.');
  if(inL.length)h+='<section><h2>In our league</h2>'+inL.map(p=>'<div class="row tapp" data-player="'+esc(p.name)+'">'+face(p.sid,p.team,p.pos)+'<div class="main"><div class="name'+(isMine(p.ownerName)?' mine':'')+'">'+esc(p.name)+'</div><div class="sub">'+posChip(p.pos)+' '+esc(isMine(p.ownerName)?'YOU':p.ownerName)+(p.slot?' ('+esc(p.slot)+')':'')+'</div></div><div class="pts"><b>'+f1(p.value)+'</b><small>value</small></div></div>').join('')+'</section>';
  if(fa.length)h+='<section><h2>Free agents on this team</h2>'+fa.map(p=>'<div class="row tapp" data-player="'+esc(p.name)+'">'+face(p.sid,p.team,p.pos)+'<div class="main"><div class="name">'+esc(p.name)+'</div><div class="sub">'+esc(p.pos)+' · wk '+f1(p.proj)+'</div></div><div class="pts"><b>'+f1(p.value)+'</b><small>value</small></div></div>').join('')+'</section>';
  return h;
}



// ---------------- DEFENSIVE PERSONNEL ----------------
function defRow(m,line){
  const out=!!m.out;
  return '<div class="row" style="padding:5px 0"><div class="main"><div class="name" style="white-space:normal;overflow:visible'+(out?';color:var(--bad)':'')+'">'+esc(m.name)
    +' <small style="color:var(--mute);font-weight:400">'+esc(m.pos||'')+(num(m.snap)>0?' · '+Math.round(100*num(m.snap))+'% of snaps':'')+'</small>'
    +(out?' <span class="flag">'+esc(m.inj||'out')+'</span>':(m.inj?' <span class="flag">'+esc(m.inj)+'</span>':''))
    +'</div><div class="sub" style="white-space:normal">'+line+'</div></div></div>';
}
function plu(n,one,many){n=num(n)||0;return (Number.isInteger(n)?n:f1(n))+' '+(n===1?one:many);}
function rushLine(m){const b=[];if(num(m.sack))b.push(plu(m.sack,'sack','sacks'));if(num(m.qbh))b.push(plu(Math.round(num(m.qbh)),'QB hit','QB hits'));if(!b.length&&num(m.tkl))b.push(plu(Math.round(num(m.tkl)),'tackle','tackles'));return b.join(' \u00b7 ')||'\u2014';}
function covLine(m){const b=[];if(num(m.dint))b.push(plu(Math.round(num(m.dint)),'INT','INTs'));if(num(m.pd))b.push(plu(Math.round(num(m.pd)),'pass broken up','passes broken up'));if(!b.length&&num(m.tkl))b.push(plu(Math.round(num(m.tkl)),'tackle','tackles'));return b.join(' \u00b7 ')||'\u2014';}
function defUnit(u,heading,intro){
  if(!u)return '';
  const rush=(u.rush||[]).filter(m=>num(m.v)>0),cov=(u.cover||[]).filter(m=>num(m.v)>0),outs=(u.outs||[]);
  if(!rush.length&&!cov.length&&!outs.length)return '';
  const missing=Math.round(100*(num(u.outShare)||0));
  let h='<section><h2>'+esc(heading)+'</h2>';
  if(intro)h+='<div class="sub" style="white-space:normal">'+intro+'</div>';
  h+='<div class="sub" style="white-space:normal;margin-top:2px">'+Math.round(num(u.men)||0)+' defenders tracked'
    +(missing>0?' · <b style="color:var(--warn)">missing '+missing+'% of its defensive production this week</b>':' · everyone who matters is available')+'.</div>';
  if(rush.length){
    h+='<div class="sub" style="font-weight:600;margin-top:10px">'+gl('rushv','Pass rush')+'</div>'
      +svgBars({labels:rush.map(m=>shortName(m.name)),series:[{vals:rush.map(m=>num(m.v)),cls:'me',clsAt:rush.map(m=>m.out?'bad':'')}],h:110})
      +rush.map(m=>defRow(m,rushLine(m))).join('');
  }
  if(cov.length){
    h+='<div class="sub" style="font-weight:600;margin-top:10px">'+gl('coverv','Coverage')+'</div>'
      +cov.map(m=>defRow(m,covLine(m))).join('');
  }
  if(outs.length){
    h+='<div class="sub" style="font-weight:600;margin-top:10px">Out or doubtful</div>'
      +outs.map(m=>defRow(Object.assign({out:true},m),(num(m.sack)?plu(m.sack,'sack','sacks')+' \u00b7 ':'')+'worth '+f1(m.impact)+' a game to this defence')).join('');
  }
  return h+'<div class="sub" style="white-space:normal;margin-top:6px">Built from every defensive snap in the nflverse box scores. Your league has no defensive slots, so nobody here is startable — this is for reading how hard a week your own guys are facing.</div></section>';
}


function histSections(d,p){
  let h='';
  // ---- injury history ----
  const ih=p.injHist;
  if(ih){
    const dur=Math.round(100*(num(ih.durability)||0));
    const parts=(ih.parts||[]).filter(x=>num(x.weeks)>0);
    const mult=num(ih.mult)||1;
    h+='<section><h2>'+gl('durability','Injury history')+'</h2>'
      +'<div style="display:flex;align-items:baseline;gap:10px;margin:2px 0 6px"><b style="font-size:26px;color:'+(dur>=90?'var(--good)':(dur>=80?'var(--warn)':'var(--bad)'))+'">'+dur+'%</b><span class="sub">available over the last '+ih.seasons+' season'+(ih.seasons===1?'':'s')+' · missed '+ih.missed+' of '+ih.weeks+' weeks to injury</span></div>';
    if(parts.length)h+=svgBars({labels:parts.map(x=>x.part.length>8?x.part.slice(0,7)+'.':x.part),series:[{vals:parts.map(x=>x.weeks),cls:'me',clsAt:parts.map(x=>(ih.recurring||[]).indexOf(x.part)>=0?'bad':'')}],h:110})
      +'<div class="sub" style="white-space:normal">Weeks he appeared on the injury report with each, over three seasons. Red is a <b>recurring</b> problem — listed four weeks or more.</div>';
    const notes=[];
    if((ih.recurring||[]).length)notes.push('keeps hurting his <b>'+ih.recurring.map(esc).join(', ')+'</b> — a new one there is expected to take longer');
    if(num(ih.soft)>=4)notes.push(ih.soft+' weeks of soft-tissue trouble (hamstring, groin, calf) — the kind that comes back');
    if(num(ih.concussions)>=2)notes.push(ih.concussions+' weeks listed with concussions');
    if(num(ih.illness)>0)notes.push('sick '+ih.illness+(ih.illness===1?' week':' weeks'));
    if(notes.length)h+='<div class="sub" style="white-space:normal;margin-top:4px">'+notes.join(' · ')+'.</div>';
    h+='<div class="sub" style="white-space:normal;margin-top:4px">Effect on his value: <b style="color:'+(mult>=1?'var(--good)':'var(--bad)')+'">'+(mult>=1?'+':'')+Math.round((mult-1)*100)+'%</b>. Deliberately small — the sources already price in some of this.</div></section>';
  }
  // ---- teammates ----
  const mt=(p.mates||[]);
  if(mt.length){
    h+='<section><h2>'+gl('stack','Moves with')+'</h2>'
      +'<div class="sub" style="white-space:normal">How his weekly score rises and falls with each teammate\'s. Positive: big days together. Negative: they take each other\'s work.</div>'
      +mt.map(m=>{const r=num(m.r)||0,w=Math.round(Math.abs(r)*100);
        return '<div class="frow"><div class="ft"><span class="fn">'+pl(m.name)+' <small style="color:var(--mute);font-weight:400">'+esc(m.pos)+' · '+m.games+' games together</small></span><span class="fp" style="color:'+(r>=0?'var(--good)':'var(--bad)')+'">'+(r>=0?'+':'')+r.toFixed(2)+'</span></div>'
          +'<div class="tr"><i class="'+(r<0?'neg':'')+'" style="width:'+Math.min(100,w*2)+'%"></i></div></div>';}).join('')
      +'<div class="sub" style="white-space:normal;margin-top:4px">A typical quarterback and his receiver sit around +0.26. Starting two players who move together raises your ceiling and lowers your floor.</div></section>';
  }
  // ---- backup quarterback ----
  const qe=p.qbEffect;
  if(qe){
    const r=num(qe.ratio)||1;
    h+='<section><h2>'+gl('qbeff','With a backup quarterback')+'</h2>'
      +(qe.active?'<div class="flag bad" style="display:inline-block;margin-bottom:6px">'+esc(qe.usual)+' is out this week — this is in his projection now</div>':'')
      +svgBars({labels:['With '+String(qe.usual).split(' ').pop(),'Backup'],series:[{vals:[qe.withUsual,qe.withBackup],cls:'me',clsAt:['',r<0.9?'bad':(r>1.05?'good':'')]}],h:100})
      +'<div class="sub" style="white-space:normal">'+f1(qe.withUsual)+' a game with '+esc(qe.usual)+(qe.current===false?' <i>(his quarterback at the time — not now)</i>':'')+', '+f1(qe.withBackup)+' with a backup ('+qe.games+' games, same team and season). '
      +(r<0.85?'<b style="color:var(--bad)">He needs his quarterback</b> — ×'+r.toFixed(2)+' after shrinking for the small sample.':(r>1.05?'<b style="color:var(--good)">Gets more work with a backup</b> — ×'+r.toFixed(2)+'.':'<b>Barely notices who is throwing</b> — ×'+r.toFixed(2)+'. The volume comes regardless.'))+'</div></section>';
  }
  // ---- his handcuff chain (he is the starter) ----
  const ch=p.cuffChain;
  if(ch&&(ch.chain||[]).length){
    h+='<section><h2>'+gl('cuff','If he goes down')+'</h2>'
      +'<div class="sub" style="white-space:normal">'+Math.round(100*(num(ch.pMiss)||0))+'% chance he misses any given week, from his own injury history'+(ch.hurt?' — <b style="color:var(--bad)">and he is hurt now</b>':'')+'. Next in line:</div>'
      +svgBars({labels:ch.chain.map(c=>shortName(c.name)),series:[{vals:ch.chain.map(c=>c.value),cls:'them'},{vals:ch.chain.map(c=>c.without),cls:'me'}],h:120,legend:[['them','now'],['me','if he starts']]})
      +ch.chain.map((c,i)=>'<div class="row" style="padding:6px 0"><div class="main" style="white-space:normal"><div class="name" style="white-space:normal;overflow:visible">'+String.fromCharCode(67+i)+'. '+pl(c.name)+(c.free?' <span class="flag good">free agent</span>':'')+'</div>'
        +'<div class="sub" style="white-space:normal">'+f1(c.without)+' a game if he starts'+(c.basis==='played without him'?' — <b>what he actually did in '+c.games+(c.games===1?' game':' games')+' without him</b>':' — <i>estimated from his place on the depth chart</i>')+' · worth '+f1(c.contingent)+' a week as insurance</div></div></div>').join('')
      +'</section>';
  }
  // ---- he is someone's handcuff ----
  const cf=p.cuffFor;
  if(cf){
    h+='<section><h2>'+gl('cuff','Handcuff')+'</h2>'
      +kv([['Backs up',pl(cf.starter)+(cf.starterHurt?' <span class="flag bad">hurt now</span>':'')],
           ['Place in line',['','','C — first up','D — second','E — third'][cf.depth]||('#'+cf.depth)],
           ['If he starts',f1(cf.without)+' a game <small>'+(cf.basis==='played without him'?'('+cf.games+' games without him on record)':'(estimated)')+'</small>'],
           ['Chance he\'s needed',Math.round(100*(num(cf.pMiss)||0))+'% a week <small>('+esc(cf.starter)+' is '+Math.round(100*(num(cf.starterDur)||0))+'% available)</small>'],
           ['Insurance value',f1(cf.contingent)+' a week <small>'+(cf.inValue?'already added to his value':'only to whoever owns '+esc(cf.starter)+' — one '+(p.pos==='QB'?'quarterback':'tight end')+' starts, so it is not in his general value')+'</small>']])
      +(cf.starterHurt?'<div class="sub" style="white-space:normal;margin-top:4px"><b>His starter is hurt now</b> — this is no longer insurance, it is the job.</div>':'')+'</section>';
  }
  return h;
}
function liftsSection(p){
  const L=p.lifts;if(!L)return '';
  const rows=[['Environment',L.env,'weather, home/away, defence, defenders out, backup QB, altitude, game script'],['Durability',L.durability,'his injury history'],['News',L.buzz,'keyword signal, last 72h'],['Crowd',L.adds,'Sleeper trending adds'],['Expert tilt',L.ecr,'FantasyPros rank vs our rank'+(num(p.expertRank)&&num(p.valueRank)?' (experts '+esc(p.pos)+Math.round(p.expertRank)+', us '+esc(p.pos)+Math.round(p.valueRank)+')':'')],['Draft capital',L.capital,'rookies only']].filter(r=>num(r[1])!==null&&Math.abs(num(r[1])-1)>=0.001);
  if(!rows.length)return '';
  const pc=v=>((v-1)*100>=0?'+':'')+Math.round((v-1)*1000)/10+'%';
  return '<section><h2>'+gl('lifts','What moved his value')+'</h2>'+svgBars({labels:rows.map(r=>r[0]),series:[{vals:rows.map(r=>Math.round((num(r[1])-1)*1000)/10),cls:'me',clsAt:rows.map(r=>num(r[1])>=1?'good':'bad')}],h:110})
    +'<div class="sub" style="white-space:normal">'+rows.map(r=>esc(r[0])+' <b style="color:'+(num(r[1])>=1?'var(--good)':'var(--bad)')+'">'+pc(num(r[1]))+'</b> <small>('+r[2]+')</small>').join(' · ')+'. Each is a multiplier on his value on top of the projection blend; anything not listed did not move him this week.</div></section>';
}
function envSection(p){
  const e=p.env||{};const t=num(e.total);
  if(t===null)return '';
  const parts=[['wx','Weather',e.wx,'Weather'],['ha','Home / away',e.ha,'Home'],['matchup','This defence',e.matchup,'Defence'],['dmen','Defenders out',e.dmen,'Injured'],['qb','Backup QB',e.qb,'Backup QB'],['alt','Altitude',e.alt,'Altitude'],['vegas','Game script',e.vegas,'Script']].filter(x=>num(x[2])!==null);
  if(!parts.length&&Math.abs(t-1)<0.005)return '';
  const pc=v=>((v-1)*100>=0?'+':'')+Math.round((v-1)*100)+'%';
  let h='<section><h2>'+gl('adjust','Adjustments')+' on this week</h2>';
  h+=(num(p.cons)===null
    ? '<div class="sub" style="white-space:normal">No source has a number for him this week, so there is nothing to adjust. The percentages below are what this week\'s conditions <i>would</i> do to him if he played.</div>'
    : '<div class="sub" style="white-space:normal">Sources say <b>'+f1(p.cons)+'</b>'+(num(p.avail)<1?' · health ×'+f1(p.avail):'')+' · conditions <b style="color:'+(t>=1?'var(--good)':'var(--bad)')+'">'+pc(t)+'</b> → <b>'+f1(p.proj)+'</b> projected.</div>');
  if(parts.length)h+=svgBars({labels:parts.map(x=>x[3]),series:[{vals:parts.map(x=>Math.round((num(x[2])-1)*100)),cls:'me',clsAt:parts.map(x=>num(x[2])>=1?'good':'bad')}],h:110})
    +'<div class="sub" style="white-space:normal">'+parts.map(x=>esc(x[1])+' <b style="color:'+(num(x[2])>=1?'var(--good)':'var(--bad)')+'">'+pc(num(x[2]))+'</b>').join(' · ')+'. Combined and damped to '+pc(t)+'.</div>';
  const w=e.wxWhy;if(w&&num(w.n))h+='<div class="sub" style="white-space:normal;margin-top:4px">Weather is <b>his own</b> number: in '+Math.round(w.n)+' '+esc(w.kind==='wind'?'windy':(w.kind==='rain'?'wet':'cold'))+' games he scored '+f1(w.ppg)+' against '+f1(w.calm)+' on calm days ('+Math.round(100*num(w.ratio))+'%). The generic '+esc(p.pos)+' figure is '+pc(num(w.posTab))+'; his history pulls it to '+pc(num(e.wx))+'.</div>';
  else if(num(e.wx)!==null&&Math.abs(num(e.wx)-1)>0.001)h+='<div class="sub" style="white-space:normal;margin-top:4px">Weather is the generic '+esc(p.pos)+' figure — fewer than two games of his own in this kind of weather yet.</div>';
  return h+'</section>';
}
