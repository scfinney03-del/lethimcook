<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let Him Cook</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Let Him Cook">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#5d6673;--line:#e3e6ea;--acc:#1f6feb;--good:#1a8f4a;--bad:#c0392b;--warn:#b7791f;--live:#d64545;--chip:#eef1f5;--bar:#c9d3e0;--barme:#1f6feb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#e8ebef;--mute:#9aa4b1;--line:#262c35;--acc:#5b9cff;--good:#3ccf6f;--bad:#ff6b6b;--warn:#f0b849;--live:#ff5c5c;--chip:#232932;--bar:#2c3440;--barme:#5b9cff}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:12px 12px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;overflow-x:hidden}
table{table-layout:fixed}
td .sub{white-space:normal;overflow:visible}
td{overflow-wrap:anywhere}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px 12px}
h1{font-size:20px;margin:0;letter-spacing:.2px}
.stamp{color:var(--mute);font-size:12px;text-align:right}
.stamp.stale{color:var(--warn)}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:0 0 8px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.slot{width:40px;flex:0 0 40px;font-size:12px;color:var(--mute);font-weight:600}
.main{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.pts b{font-size:16px}
.pts small{display:block;font-size:11px;color:var(--mute)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--chip);color:var(--mute);margin-right:4px;vertical-align:1px}
.pill.live{background:var(--live);color:#fff}
.pill.final{background:var(--chip)}
.pill.warn{background:var(--warn);color:#111}
.pill.bad{background:var(--bad);color:#fff}
.flag{font-size:12px;color:var(--warn)}
.flag.bad{color:var(--bad)}
.flag.good{color:var(--good)}
.act{padding:10px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .when{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--acc)}
.act .when.now{color:var(--bad)}
.act .text{margin-top:2px}
.act .where{font-size:12px;color:var(--mute);margin-top:2px}
.empty{color:var(--mute);font-size:14px;padding:4px 0}
details summary{cursor:pointer;color:var(--mute);font-size:13px;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
.score{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:4px 0 10px}
.score .lbl{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .num{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bar{grid-column:1/3;height:8px;background:var(--bar);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--barme)}
.bar.them i{background:var(--mute)}
.vs{display:grid;grid-template-columns:40px 1fr auto 1fr;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.vs:first-of-type{border-top:0}
.vs .me,.vs .them{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .them{text-align:right}
.vs .edge{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;padding:1px 6px;border-radius:8px;background:var(--chip)}
.vs .edge.up{color:var(--good)}
.vs .edge.down{color:var(--bad)}
.vs small{display:block;color:var(--mute);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.win{color:var(--good);font-weight:700}.loss{color:var(--bad);font-weight:700}
footer{color:var(--mute);font-size:11px;text-align:center;margin-top:16px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ctl button{font:inherit;font-size:14px;font-weight:600;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.ctl button:active{opacity:.7}
.ctl button.warn{color:var(--warn)}.ctl button.go{color:var(--acc)}
.ctlmsg{font-size:12px;color:var(--mute);margin-top:8px;min-height:16px}
.paused{color:var(--warn);font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.6px;padding:3px 10px;border-radius:9px;color:#fff;background:var(--good);vertical-align:1px}
.badge.off{background:var(--bad)}
.ctl button.stop{background:var(--bad);color:#fff;border-color:var(--bad)}
.ctl button.start{background:var(--good);color:#fff;border-color:var(--good)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:4px;vertical-align:0}
.dot.off{background:var(--bad)}
.logo{width:26px;height:26px;flex:0 0 26px;object-fit:contain;border-radius:6px;background:var(--chip)}
.mb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);margin-top:3px}
.mb i{display:block;height:5px;border-radius:3px;background:var(--barme)}
.mb i.them{background:var(--mute)}
.mb span{min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
.pair{grid-column:1/5;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 4px 46px}
.pair .t{height:5px;border-radius:3px;background:var(--bar);overflow:hidden}
.pair .t i{display:block;height:100%;background:var(--barme)}
.pair .t.r{direction:rtl}.pair .t.r i{background:var(--mute)}
.fbar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute)}
.fbar .t{flex:1;height:6px;border-radius:3px;background:var(--bar);overflow:hidden}.fbar .t i{display:block;height:100%;background:var(--barme)}
.fbar .t i.up{background:var(--good)}.fbar .t i.dn{background:var(--bad)}
.form{color:var(--mute)}.form.up{color:var(--good)}.form.dn{color:var(--bad)}

.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 0 12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0}
.nav a{text-align:center;font-size:13px;font-weight:600;padding:8px 4px;border-radius:9px;background:var(--chip);color:var(--mute);text-decoration:none}
.nav a.on{background:var(--acc);color:#fff}
a.pl{color:inherit;text-decoration:none;border-bottom:1px dotted var(--mute)}
a.back{color:var(--acc);text-decoration:none;font-size:13px;font-weight:600}
.tap,.tapp{cursor:pointer}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.filters select,.filters input{font:inherit;font-size:14px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--ink);width:100%;min-width:0}
.filters input{grid-column:1/3}
table.kv{margin-top:6px}table.kv td{white-space:normal}
button.more{font:inherit;font-weight:600;width:100%;margin-top:8px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--acc)}
details.g summary::before{content:none}details.g summary{padding:0}details.g summary > div{display:flex}
.slot{width:44px;flex:0 0 44px}
.ch rect.b{fill:var(--barme)}.ch rect.b.them{fill:var(--mute)}.ch rect.b.proj{fill:var(--barme);opacity:.35}.ch rect.b.me{fill:var(--barme)}
circle.d{fill:var(--mute);opacity:.7}circle.d.me{fill:var(--good);opacity:1}circle.d.fa{fill:var(--acc)}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--mute);vertical-align:-1px;margin-right:3px}.lg.me{background:var(--barme)}.lg.them{background:var(--mute)}.lg.proj{background:var(--barme);opacity:.35}.lg.fa{background:var(--acc)}
.name.mine,.sub.mine a{color:var(--good)}
path.ln{stroke:var(--barme)}path.ln.them{stroke:var(--mute)}path.ln.proj{stroke:var(--barme);opacity:.6}circle.pt{fill:var(--barme)}circle.pt.them{fill:var(--mute)}circle.pt.proj{fill:var(--barme);opacity:.6}
.ch rect.b.good{fill:var(--good)}.ch rect.b.bad{fill:var(--bad)}.lg.good{background:var(--good)}.lg.bad{background:var(--bad)}

/* Easy-read mode: bigger, bolder, higher contrast (keratoconus-friendly) */
body.big{font-size:22px;line-height:1.5;padding-left:8px;padding-right:8px}
body.big{--ink:#000;--mute:#1e242c;--line:#9aa3af;--bar:#9aa3af;--good:#0b6b31;--bad:#b0160e;--warn:#7a4d00;--acc:#0a4fc2;--barme:#0a4fc2;--card:#fff;--bg:#e9ecf0;--chip:#dfe4ea}
@media (prefers-color-scheme:dark){body.big{--ink:#fff;--mute:#e3e8ee;--line:#6b7583;--bar:#6b7583;--good:#5ce08a;--bad:#ff7b7b;--warn:#ffd166;--acc:#7fb2ff;--barme:#7fb2ff;--card:#0f1216;--bg:#000;--chip:#2a313b}}
body.big section{border-width:2px}body.big b,body.big .name{font-weight:800}
body.big h1{font-size:30px}body.big h2{font-size:17px;letter-spacing:.4px;color:var(--ink)}body.big .stamp{font-size:17px}
body.big .sub,body.big .flag,body.big .pill,body.big small,body.big .fbar,body.big .mb,body.big .act .where,body.big .act .when,body.big .vs small,body.big .sub *{font-size:19px!important}
body.big .name{font-size:22px}body.big .pts b{font-size:26px}body.big .vs{font-size:20px;grid-template-columns:50px 1fr auto 1fr}body.big .vs .edge{font-size:16px}
body.big table{font-size:20px}body.big th{font-size:16px;color:var(--ink)}body.big td,body.big th{padding:9px 5px}
body.big .row{padding:12px 0}body.big .slot{font-size:17px;width:58px;flex:0 0 58px;color:var(--ink)}
body.big .bar{height:14px}body.big .fbar .t,body.big .pair .t,body.big .mb i{height:11px}
body.big .pill{padding:3px 10px;border-radius:12px}body.big .logo{width:34px;height:34px;flex-basis:34px}
body.big .nav a{font-size:19px;padding:14px 4px;color:var(--ink)}body.big .nav a.on{color:#fff}body.big .ctl button,body.big .filters select,body.big .filters input,body.big button.more{font-size:18px;padding:14px 10px}
body.big svg text{font-size:15px!important;fill:var(--ink)!important}body.big svg{height:auto!important;min-height:190px}body.big path.ln{stroke-width:3.5}body.big circle.d{r:5.5}body.big circle.d.me{r:7}
body.big a.pl{border-bottom:2px solid var(--acc);font-weight:600}
body.big .flag{font-weight:700}body.big .score .lbl{font-size:16px;white-space:normal}

body.big .vs{grid-template-columns:58px 1fr auto;row-gap:4px}
body.big .vs .me,body.big .vs .them{white-space:normal;overflow:visible;text-overflow:clip;text-align:left}
body.big .vs .slot{grid-column:1;grid-row:1}body.big .vs .me{grid-column:2;grid-row:1}body.big .vs .them{grid-column:2;grid-row:2}body.big .vs .edge{grid-column:3;grid-row:1/3;align-self:center}body.big .pair{grid-row:3}
body.big .vs .them::before{content:"vs ";color:var(--mute);font-weight:400}
body.big .pair{grid-column:1/4;padding-left:58px}
body.big .name,body.big .sub,body.big .score .lbl{white-space:normal;overflow:visible;text-overflow:clip}
body.big .pill{white-space:nowrap}
body.big .pts{max-width:36%}body.big .main{min-width:0}
body.big .vs .pill{font-size:15px!important;padding:2px 7px}
.aa{font:inherit;font-size:13px;font-weight:700;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;margin-left:6px}
body.big .aa{background:var(--acc);color:#fff;border-color:var(--acc);font-size:18px;padding:6px 12px}
</style>
</head>
<body>
<header><h1>Let Him Cook <button class="aa" id="aa" title="Easy-read mode: bigger text, higher contrast" aria-pressed="false">Aa</button></h1><div class="stamp" id="stamp">loading…</div></header>
<nav class="nav"><a href="#home" data-v="home">Home</a><a href="#league" data-v="league">League</a><a href="#players" data-v="players">Players</a><a href="#games" data-v="games">Games</a></nav>
<div id="app"><section><div class="empty">Waiting for the first refresh…</div></section></div>
<footer>Updates every 5 minutes while the laptop is on. Pull down to refresh.</footer>
<script>

(function(){const b=document.body,btn=document.getElementById('aa');let on=false;try{on=localStorage.getItem('lhc_big')==='1'}catch(e){}
const apply=()=>{b.classList.toggle('big',on);btn.setAttribute('aria-pressed',on?'true':'false');btn.textContent=on?'Aa on':'Aa'};apply();
btn.addEventListener('click',()=>{on=!on;try{localStorage.setItem('lhc_big',on?'1':'0')}catch(e){}apply()});})();
(function(){
const $=(s)=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>(v===null||v===""||v===undefined||isNaN(+v))?null:+v;
const f1=v=>{const n=num(v);return n===null?"":n.toFixed(1)};
const f2=v=>{const n=num(v);return n===null?"":n.toFixed(2)};
const pct=v=>{const n=num(v);return n===null?"":Math.round(n*(n<=1?100:1))+"%"};
const blank=v=>v===null||v===undefined||String(v).trim()==="";
let D=null, d_week=null, clockTimer=null;
const state={view:"home",team:null,player:null,filters:{pos:"ALL",owner:"ALL",sort:"value",q:""}};
try{const f=JSON.parse(localStorage.getItem("lhc_filters")||"null");if(f)Object.assign(state.filters,f)}catch(e){}

const LOGOFIX={JAC:"jax",WAS:"wsh",LA:"lar",OAK:"lv",SD:"lac",STL:"lar"};
function logo(team){team=String(team||"").toUpperCase();if(!team||team==="0")return '<div class="logo"></div>';const ab=LOGOFIX[team]||team.toLowerCase();return '<img class="logo" alt="" loading="lazy" src="https://a.espncdn.com/i/teamlogos/nfl/500/'+ab+'.png" onerror="this.style.visibility=\'hidden\'">';}
function gamePill(st){st=String(st||"");if(/progress/i.test(st))return '<span class="pill" style="background:var(--good);color:#fff">LIVE</span>';if(/final/i.test(st))return '<span class="pill" style="background:var(--bad);color:#fff">FINAL</span>';if(/bye/i.test(st))return '<span class="pill" style="background:var(--warn);color:#fff">BYE</span>';return '<span class="pill" style="background:var(--warn);color:#fff">PENDING</span>';}
function statusPill(st,kick){
  st=String(st||"");
  if(/progress/i.test(st))return '<span class="pill" style="background:var(--good);color:#fff">LIVE</span>';
  if(/final/i.test(st))return '<span class="pill" style="background:var(--bad);color:#fff">FINAL</span>';
  if(/bye/i.test(st))return '<span class="pill" style="background:var(--warn);color:#fff">BYE</span>';
  if(kick)return '<span class="pill" style="background:var(--warn);color:#fff">PENDING</span> <span class="pill">'+esc(kick)+'</span>';
  if(/upcoming/i.test(st))return '<span class="pill" style="background:var(--warn);color:#fff">PENDING</span>';
  return st?'<span class="pill">'+esc(st)+'</span>':"";
}
const cleanName=n=>String(n||"").replace(/\s+(Jr\.|Sr\.|III|II|IV)$/,"").trim();
function pl(name){if(blank(name))return "";return '<a class="pl" href="#player/'+encodeURIComponent(cleanName(name))+'">'+esc(name)+'</a>';}
function findPlayer(name){const c=cleanName(name).toLowerCase();return (D&&D.players||[]).find(p=>String(p.name).toLowerCase()===c)||null;}
function gradeColor(g){return /^A/.test(g)?'var(--good)':(/^B/.test(g)?'#2f8f5b':(/^C/.test(g)?'#b8860b':'var(--bad)'));}
function bar(v,mx,cls){const w=mx>0?Math.max(0,Math.min(100,100*(num(v)||0)/mx)):0;return '<div class="t"><i class="'+(cls||'')+'" style="width:'+w+'%"></i></div>';}
function fbar(label,v,mx,txt,cls){return '<div class="fbar"><span style="width:84px;flex:0 0 84px">'+esc(label)+'</span>'+bar(v,mx,cls)+'<span style="width:44px;flex:0 0 44px;text-align:right">'+esc(txt===undefined?f1(v):txt)+'</span></div>';}
function kv(rows){return '<table class="kv">'+rows.filter(r=>r&&!blank(r[1])).map(r=>'<tr><td style="color:var(--mute);width:46%">'+esc(r[0])+'</td><td>'+r[1]+'</td></tr>').join("")+'</table>';}
function flags(p){
  const out=[];
  if(!blank(p.inj)&&!/healthy|^ok$|^-$/i.test(p.inj))out.push('<span class="flag'+(/^out|ir|season/i.test(p.inj)?' bad':'')+'">'+esc(p.inj)+'</span>');
  if(!blank(p.practice)&&!/full|^ok$/i.test(p.practice))out.push('<span class="flag">'+esc(p.practice)+'</span>');
  if(!blank(p.news)&&/out|risk|uncertain|role|trending/i.test(p.news))out.push('<span class="flag'+(/out|risk/i.test(p.news)?' bad':'')+'">'+esc(p.news)+'</span>');
  if(!blank(p.forecast)&&!/indoor|clear|fine|mild|^-$/i.test(p.forecast))out.push('<span class="flag">'+esc(p.forecast)+'</span>');
  return out.join(' · ');
}
function playerRow(p){
  const started=/progress|final/i.test(String(p.status||""));
  const live=num(p.live),proj=num(p.proj);
  let pts="";
  if(started&&live!==null)pts='<b>'+f1(live)+'</b><small>proj '+f1(proj)+'</small>';
  else if(proj!==null)pts='<b>'+f1(proj)+'</b><small>proj</small>';
  if(String(p.team)==="0")p.team="";
  let fl=flags(p);
  const nb=num(p.nextBye); if(nb!==null&&d_week!==null&&nb===d_week+1)fl=(fl?fl+' · ':'')+'<span class="flag">Bye next week</span>';
  let fb="";
  const nu=blank(p.nextUp)?p.fallback:p.nextUp, nsrc=blank(p.nextUp)?'Waiver':(p.nextSrc||''), nwk=blank(p.nextUp)?p.fbWk:p.nextWk;
  if(!blank(nu))fb+='Next up → <b>'+pl(nu)+'</b>'+(nsrc?' <span class="pill">'+esc(nsrc)+'</span>':'')+(num(nwk)!==null?' '+f1(nwk)+'/wk':'');
  if(num(p.cons)!==null&&num(p.nsrc)!==null&&p.nsrc>0){fb+=(fb?'<br>':'')+'consensus <b>'+f1(p.cons)+'</b> <small>('+Math.round(p.nsrc)+' source'+(p.nsrc==1?'':'s')+(num(p.spread)!==null&&p.spread>0?', spread '+f1(p.spread):'')+(blank(p.grade)?'':', experts <b style="color:'+gradeColor(p.grade)+'">'+esc(p.grade)+'</b>')+')</small>'+(num(p.spread)!==null&&p.spread>=6?' <span class="flag">sources split</span>':'');}
  if(num(p.buzz)!==null&&p.buzz<=-3)fb+='<br><span class="flag bad" style="font-weight:600">News: '+esc(p.headline||'negative buzz')+' ('+f1(p.buzz)+')</span>';
  if(num(p.value)!==null&&num(p.perWk)!==null&&Math.abs(p.value-p.perWk)>=0.05)fb+=(fb?' · ':'')+'value <b>'+f1(p.value)+'</b>/wk <small>(ROS '+f1(p.perWk)+' + form)</small>';
  if(!blank(p.verdict)&&!/^Hold$/.test(p.verdict))fb+='<br><span class="flag'+(/^Upgrade/.test(p.verdict)?' bad':'')+'" style="font-weight:600">'+esc(p.verdict)+'</span>';
  if(num(p.weekVsValue)!==null&&(p.weekVsValue>=1.25||p.weekVsValue<=0.7))fb+='<br><span class="flag'+(p.weekVsValue>=1.25?' good':'')+'">'+(p.weekVsValue>=1.25?'Big week projected ('+Math.round(p.weekVsValue*100)+'% of his usual) — hold through it':'Weak week projected ('+Math.round(p.weekVsValue*100)+'% of his usual)')+'</span>';
  if(num(p.next3)!==null&&(p.next3>=1.15||p.next3<=0.85))fb+=' · <span class="flag'+(p.next3>=1.15?' good':' bad')+'">next 3 defenses '+(p.next3>=1.15?'soft':'tough')+' ('+f1(p.next3)+'x)</span>';

function svgBars(o){ // o: {labels:[], series:[{vals:[],cls:'',name:''}], line:{v,label}, h}

  const mx=Math.max.apply(null,all)*1.08;const sc=v=>(H-B)-((H-B-T)*(Math.max(0,num(v)||0)/mx));

  if(o.line&&num(o.line.v)!==null){const y=sc(o.line.v);h+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="'+(W-R)+'" y="'+(y-3)+'" font-size="9" text-anchor="end" fill="var(--warn)">'+esc(o.line.label||'')+'</text>'}

function svgLine(o){ // o:{labels:[], series:[{vals:[],cls:'',dash:bool}], h}

function ncdf(z){const t=1/(1+0.2316419*Math.abs(z));const dd=0.3989423*Math.exp(-z*z/2);let p=dd*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));if(z>0)p=1-p;return p;}

  h+='<section><h2>Value</h2>';
  const rmx=Math.max.apply(null,[rs.cons,rs.sleeper,rs.espn,rs.fantasypros,p.value].map(v=>num(v)||0).concat([1]));
  h+='<div><b>'+f1(p.value)+' per week</b> <small style="color:var(--mute)">blended: ROS consensus + recent form + usage + history, plus 25% of this week</small></div>';
  h+=fbar('Value',p.value,rmx)+fbar('ROS consensus',rs.cons,rmx)+(num(rs.sleeper)?fbar('ROS Sleeper',rs.sleeper,rmx):'')+(num(rs.espn)?fbar('ROS ESPN',rs.espn,rmx):'')+(num(rs.fantasypros)?fbar('ROS FantasyPros',rs.fantasypros,rmx):'');
  h+=kv([['Rest of season',num(rs.season)!==null?Math.round(rs.season)+' pts over '+esc(d.weeksLeft)+' weeks':''],['History used',num(p.histUsed)?f1(p.histUsed)+' ppg':''],['Next 3 defenses',num(p.next3idx)!==null?'<b>'+f1(p.next3idx)+'x</b> <small style="color:var(--mute)">(1.0 = average; '+(p.next3idx>=1.15?'soft':(p.next3idx<=0.85?'tough':'neutral'))+')</small>':''],['Sleeper adds 24h',p.adds?Math.round(p.adds):''],['Buzz 72h',num(p.buzz)&&p.buzz!==0?f1(p.buzz)+' ('+p.mentions+' mentions)':(p.mentions?p.mentions+' mentions':'')]]);
  h+='</section>';
  // form
  if(p.pos!=='K'&&p.pos!=='DST'){
    const fmx=Math.max.apply(null,[fm.last,fm.avg3,fm.season].map(v=>num(v)||0).concat([1]));
    h+='<section><h2>Form &amp; usage</h2>'+fbar('Last week',fm.last,fmx)+fbar('3-week avg',fm.avg3,fmx)+fbar('Season avg',fm.season,fmx);
    h+=kv([['Trend',num(fm.trend)!==null?'<span class="'+(fm.trend>=3?'form up':(fm.trend<=-3?'form dn':''))+'">'+(fm.trend>0?'+':'')+f1(fm.trend)+' vs his prior average</span>':''],['Touches + targets',num(fm.touches)!==null?Math.round(fm.touches):''],['Target share',pct(fm.tgt)],['Snap share',pct(fm.snap)],['Depth chart',num(fm.depth)!==null?p.pos+fm.depth:''],['Games played',fm.gp]]);
    h+='</section>';
  }
  // history
  if(hs)h+='<section><h2>History</h2>'+kv([['2025',num(hs.ppg2025)?f1(hs.ppg2025)+' ppg over '+Math.round(hs.g2025)+' games':'did not play'],['Career',f1(hs.career)+' ppg · '+Math.round(hs.games)+' games · '+Math.round(hs.seasons)+' seasons'],['Range','floor '+f1(hs.floor)+' · ceiling '+f1(hs.ceiling)+' · best '+f1(hs.best)],['Boom / bust',Math.round(hs.boom*100)+'% of games 20+ · '+Math.round(hs.bust*100)+'% under 5'],['Week-to-week swing','±'+f1(hs.std)]])+'</section>';
  // next 3
  const n3=(p.next3||[]);
  if(n3.length&&p.pos!=='K'&&p.pos!=='DST')h+='<section><h2>Next 3</h2><table><tr><th style="width:40px">Wk</th><th>Opponent</th><th class="n">Pts allowed to '+esc(p.pos)+' (2025)</th></tr>'+n3.map(x=>'<tr><td>'+esc(x.week)+'</td><td>'+esc(x.opp)+'</td><td class="n">'+(num(x.allowed)!==null?f1(x.allowed):'')+'</td></tr>').join("")+'</table></section>';
  // season: actual so far, projected the rest of the way
  const wkNow=num(d.week);const lgA={};(p.log||[]).forEach(x=>{lgA[x.week]=x.ppr});const wkP={};(p.weekly||[]).forEach(x=>{wkP[x.week]=x.proj});
  const labs=[],va=[],vp=[],cls=[];for(let w=1;w<=17;w++){labs.push(''+w);const a=lgA[w],pr=wkP[w];if(a!==undefined&&w<wkNow){va.push(a);vp.push(null)}else if(a!==undefined&&w===wkNow&&(/final|progress/i.test(g.status||''))){va.push(a);vp.push(null)}else{va.push(null);vp.push(pr===undefined?(p.bye===w?0:null):pr)}}
  if(va.some(v=>v!==null)||vp.some(v=>v!==null)){const tot=vp.reduce((a,v)=>a+(num(v)||0),0),done=va.reduce((a,v)=>a+(num(v)||0),0);
    h+='<section><h2>Season</h2>'+svgBars({labels:labs,series:[{vals:va,cls:'me'},{vals:vp,cls:'proj'}],line:{v:p.value,label:'value/wk'},legend:[['me','actual'],['proj','projected (Sleeper, week by week)']]})+(function(){let c=0;const ca=[],cp=[];let lastA=null;for(let i=0;i<labs.length;i++){if(va[i]!==null){c+=va[i];ca.push(Math.round(c*10)/10);cp.push(null);lastA=i}else{ca.push(null);}}let c2=c;for(let i=0;i<labs.length;i++){if(va[i]===null){c2+=(num(vp[i])||0);cp[i]=Math.round(c2*10)/10}}if(lastA!==null)cp[lastA]=ca[lastA];return '<div style="margin-top:8px">'+svgLine({labels:labs,series:[{vals:ca,cls:'me'},{vals:cp,cls:'proj',dash:true}],h:130,legend:[['me','points so far'],['proj','season pace']]})+'</div>'})()
+'<div class="sub" style="white-space:normal;margin-top:4px">'+Math.round(done)+' scored so far · '+Math.round(tot)+' projected the rest of the way · '+Math.round(done+tot)+' season pace'+(p.bye?' · bye week '+p.bye:'')+'</div></section>';}
  if((p.log||[]).length>1){const L2=(p.log||[]);const avg=L2.map((x,i)=>{const w=L2.slice(Math.max(0,i-2),i+1).map(y=>num(y.ppr)||0);return Math.round(w.reduce((a,b)=>a+b,0)/w.length*10)/10});
    h+='<section><h2>Week by week</h2>'+svgLine({labels:L2.map(x=>'Wk '+x.week),series:[{vals:L2.map(x=>x.ppr),cls:'me'},{vals:avg,cls:'them',dash:true}],h:140,legend:[['me','points'],['them','3-week average']]})+'</section>';}
  // game log
  const lg=(p.log||[]);
  if(lg.length){const isQB=p.pos==='QB';
    h+='<section><h2>Game log</h2><table><tr><th style="width:30px">Wk</th><th>Opp</th><th class="n">Pts</th>'+(isQB?'<th class="n">Pass</th><th class="n">Rush</th>':'<th class="n">Car</th><th class="n">Tgt</th><th class="n">Rec</th><th class="n">Yds</th>')+'<th class="n">TD</th><th class="n">Snap</th></tr>';
    h+=lg.map(x=>'<tr><td>'+esc(x.week)+'</td><td>'+esc(x.opp)+'</td><td class="n"><b>'+f1(x.ppr)+'</b></td>'+(isQB?'<td class="n">'+Math.round(x.payd)+'</td><td class="n">'+Math.round(x.ruyd)+'</td>':'<td class="n">'+Math.round(x.car)+'</td><td class="n">'+Math.round(x.tgt)+'</td><td class="n">'+Math.round(x.rec)+'</td><td class="n">'+Math.round((x.ruyd||0)+(x.reyd||0))+'</td>')+'<td class="n">'+Math.round(x.td)+'</td><td class="n">'+pct(x.snap)+'</td></tr>').join("")+'</table></section>';
  }
  // news
  const nw=(p.news||[]);
  if(nw.length)h+='<section><h2>News</h2>'+nw.map(x=>{const ago=num(x.age)===null?'':(x.age<1?'now':(x.age<24?Math.round(x.age)+'h':Math.round(x.age/24)+'d'));
    return '<div style="padding:6px 0;border-top:1px solid var(--line);white-space:normal;line-height:1.35">'+esc(x.head)+'<div class="sub">'+esc(x.src)+' · '+ago+(blank(x.kw)?'':' · '+esc(x.kw))+(num(x.sig)?' · <span class="'+(x.sig<0?'form dn':'form up')+'">'+(x.sig>0?'+':'')+esc(x.sig)+'</span>':'')+'</div></div>'}).join("")+'</section>';
  return h;
}

// ---------------- GAMES ----------------
function renderGames(d){
  const gs=(d.games||[]); if(!gs.length)return '<section><div class="empty">No games loaded.</div></section>';
  const inLeague=t=>(d.players||[]).filter(p=>p.team===t&&num(p.owner)).sort((a,b)=>(num(b.proj)||0)-(num(a.proj)||0));
  let h='<section><h2>Week '+esc(d.week)+' games</h2></section>';
  h+=gs.map(g=>{const fin=/final|progress/i.test(g.status);
    const sc=fin&&!blank(g.awayScore)?'<b>'+esc(g.awayScore)+' – '+esc(g.homeScore)+'</b>':'';
    const wx=blank(g.impact)?'':'<span class="'+(/wind|rain|cold/i.test(g.impact)?'flag':'sub')+'">'+esc(g.impact)+'</span>'+(blank(g.cond)?'':' <span class="sub">'+esc(g.cond)+'</span>');
    const away=inLeague(g.away),home=inLeague(g.home);
    const side=(t,list)=>'<div style="min-width:0"><div class="sub" style="font-weight:600">'+esc(t)+' · implied '+f1(t===g.home?g.impliedHome:g.impliedAway)+'</div>'+list.map(p=>'<div class="sub'+(isMine(p.ownerName)?' mine':'')+'" style="white-space:normal">'+pl(p.name)+' <small>'+esc(p.pos)+' · '+(isMine(p.ownerName)?'<b style="color:var(--good)">YOU</b>':esc(p.ownerName))+' · '+f1(num(p.game&&p.game.live)!==null&&fin?p.game.live:p.proj)+'</small></div>').join("")+'</div>';
    return '<section><details><summary style="color:var(--ink);font-size:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="display:flex;align-items:center;gap:6px">'+logo(g.away)+'<b>'+esc(g.away)+'</b><span class="sub">@</span>'+logo(g.home)+'<b>'+esc(g.home)+'</b></div><div style="text-align:right">'+gamePill(g.status)+' <span class="sub">'+esc(g.kick)+'</span>'+(sc?'<br>'+sc:'')+'</div></div>'
      +'<div class="sub" style="white-space:normal;margin-top:4px">'+(blank(g.spread)?'':'spread '+esc(g.spread)+' · total '+esc(g.total)+' · ')+esc(g.roof||'')+(wx?' · '+wx:'')+'</div></summary>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">'+side(g.away,away)+side(g.home,home)+'</div></details></section>'}).join("");
  return h;
}


// ---------------- LIVE LAYER (Sleeper, straight from the phone) ----------------
const LIVE={at:null,stats:null,ok:false};
function scoreLine(s,pos){if(pos==='K'||pos==='DST'||pos==='DEF')return num(s.pts_ppr);const g=k=>num(s[k])||0;return Math.round((g('pass_yd')/25+4*g('pass_td')-g('pass_int')+g('rush_yd')/10+6*g('rush_td')+g('rec')+g('rec_yd')/10+6*g('rec_td')-2*g('fum_lost'))*100)/100;}
function liveStatus(kickIso,st){if(!kickIso||/final|bye/i.test(st||""))return st;const k=new Date(kickIso).getTime(),now=Date.now();if(isNaN(k))return st;if(now<k)return 'Upcoming';if(now<k+225*60000)return 'In progress';return 'Final';}
function anyLiveNow(){return (D&&D.games||[]).some(g=>liveStatus(g.kickIso,g.status)==='In progress');}
function applyLive(){
  if(!D||!LIVE.stats)return;const S=LIVE.stats;
  const posOf={};(D.players||[]).forEach(p=>{if(p.sid)posOf[p.sid]=p.pos});
  const pts=(sid,pos)=>{if(!sid||!S[sid])return null;const s=S[sid];if(s.pts_ppr==null&&s.pass_yd==null&&s.rush_yd==null&&s.rec_yd==null)return null;return scoreLine(s,pos||posOf[sid]);};
  const gm={};(D.games||[]).forEach(g=>{const st=liveStatus(g.kickIso,g.status);g.status=st;gm[g.home]=st;gm[g.away]=st;});
  (D.roster||[]).forEach(r=>{if(!r.sid)return;const st=liveStatus(r.kickIso,r.status);if(st!=='Upcoming'){r.status=st;const v=pts(r.sid,r.pos);if(v!==null)r.live=v;}});
  let myT=null,thT=null,myE=0,thE=0;const m=D.matchup||{};
  (m.rows||[]).forEach(r=>{const ms=liveStatus(r.myKick,r.myStatus),ts=liveStatus(r.theirKick,r.theirStatus);
    if(ms!=='Upcoming'){r.myStatus=ms;const v=pts(r.mySid);if(v!==null)r.myLive=v;}
    if(ts!=='Upcoming'){r.theirStatus=ts;const v=pts(r.theirSid);if(v!==null)r.theirLive=v;}
    if(r.myLive!=null&&r.myStatus!=='Upcoming'){myT=(myT||0)+r.myLive;r.myExp=r.myLive;}
    if(r.theirLive!=null&&r.theirStatus!=='Upcoming'){thT=(thT||0)+r.theirLive;r.theirExp=r.theirLive;}
    if(r.myExp!=null&&r.theirExp!=null){r.edge=Math.round((r.myExp-r.theirExp)*100)/100;r.verdict=r.edge>2?'Win the slot':(r.edge<-2?'Losing the slot':'Coin flip');}
    myE+=num(r.myExp)||0;thE+=num(r.theirExp)||0;});
  if(m.rows&&m.rows.length){m.myLive=myT;m.theirLive=thT;m.myExp=Math.round(myE*100)/100;m.theirExp=Math.round(thE*100)/100;D.live="";}
  (D.players||[]).forEach(p=>{if(!p.sid||!p.game)return;const st=gm[p.team];if(st&&st!=='Upcoming'){p.game.status=st;const v=pts(p.sid,p.pos);if(v!==null)p.game.live=v;}});
  (D.league||[]).forEach(p=>{if(!p.sid)return;const st=gm[p.nfl];if(st&&st!=='Upcoming'){const v=pts(p.sid,p.pos);if(v!==null)p.week=v;}});
}
function liveTick(force){
  if(!D||document.hidden)return;const yr=D.nflSeason||2026,wk=num(D.week);if(!wk)return;
  if(!force&&!anyLiveNow()&&LIVE.at&&(Date.now()-LIVE.at.getTime())<5*60000)return;
  fetch("https://api.sleeper.app/v1/stats/nfl/regular/"+yr+"/"+wk,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{LIVE.stats=j;LIVE.at=new Date();LIVE.ok=true;applyLive();render();}).catch(()=>{LIVE.ok=false;});
}
setInterval(()=>liveTick(false),45000);

// ---------------- ROUTER ----------------
function route(){
  const hsh=decodeURIComponent(location.hash||"#home").slice(1);
  const parts=hsh.split("/");
  state.view=parts[0]||"home";
  if(state.view==="team")state.team=parts[1];
  if(state.view==="player")state.player=parts.slice(1).join("/");
  render();
}
function render(){
  const d=D; if(!d)return;
  if(clockTimer)clearInterval(clockTimer);
  clockTimer=setInterval(()=>{const el=document.getElementById('clock');if(el)el.textContent=clockText(d);},15000);
  d_week=num(d.week); stamp(d);
  let h="";
  const v=state.view;
  if(v==="league")h=renderLeague(d);
  else if(v==="team")h=renderTeam(d,state.team);
  else if(v==="players")h=renderPlayers(d);
  else if(v==="player")h=renderPlayer(d,state.player);
  else if(v==="games")h=renderGames(d);
  else h=renderHome(d);
  $("#app").innerHTML=h;
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===(v==="team"?"league":(v==="player"?"players":v))));
  document.querySelectorAll(".ctl button[data-cmd]").forEach(b=>b.addEventListener("click",()=>send(b.dataset.cmd,d.cmd)));
  document.querySelectorAll("[data-team]").forEach(el=>el.addEventListener("click",()=>{location.hash="#team/"+el.dataset.team}));
  document.querySelectorAll("[data-player]").forEach(el=>el.addEventListener("click",()=>{location.hash="#player/"+encodeURIComponent(el.dataset.player)}));
  const fp=$("#f-pos"),fo=$("#f-owner"),fs=$("#f-sort"),fq=$("#f-q"),mo=$("#more");
  const save=()=>{try{localStorage.setItem("lhc_filters",JSON.stringify(state.filters))}catch(e){}};
  if(fp)fp.addEventListener("change",()=>{state.filters.pos=fp.value;state.limit=60;save();render()});
  if(fo)fo.addEventListener("change",()=>{state.filters.owner=fo.value;state.limit=60;save();render()});
  if(fs)fs.addEventListener("change",()=>{state.filters.sort=fs.value;state.limit=60;save();render()});
  if(fq)fq.addEventListener("input",()=>{state.filters.q=fq.value;state.limit=60;save();const keep=fq.selectionStart;render();const q2=$("#f-q");if(q2){q2.focus();try{q2.setSelectionRange(keep,keep)}catch(e){}}});
  if(mo)mo.addEventListener("click",()=>{state.limit=(state.limit||60)+60;render()});
  if(v!=="players")window.scrollTo(0,0);
}
function send(cmd,topic){
  const m=$("#ctlmsg"); if(m)m.textContent="Sending…";
  fetch("https://ntfy.sh/"+topic,{method:"POST",body:cmd}).then(r=>{if(m)m.textContent=r.ok?"Sent. The laptop replies to your phone in a few seconds.":"Couldn't send ("+r.status+").";}).catch(()=>{if(m)m.textContent="Couldn't send — no connection.";});
}
function load(){
  fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{D=d;try{localStorage.setItem("lhc",JSON.stringify(d))}catch(e){}if(LIVE.stats&&LIVE.at&&(Date.now()-LIVE.at.getTime())<180000)applyLive();render();liveTick(true)})
  .catch(()=>{try{const c=localStorage.getItem("lhc");if(c&&!D){D=JSON.parse(c);render();$("#stamp").textContent+=" · offline copy"}else if(!D){$("#stamp").textContent="no data yet"}}catch(e){$("#stamp").textContent="no data yet"}});
}
window.addEventListener("hashchange",route);
route(); load();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
setInterval(load,5*60*1000);
})();
</script>
